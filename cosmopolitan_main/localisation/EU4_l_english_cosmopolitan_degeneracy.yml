 cosmo_degeneracy_events.7.t:0 "Dreams of the Imperial Harem"
 cosmo_degeneracy_events.7.d:0 "The [Root.Monarch.GetTitle] has had many a restless night as of late.  Visions of his time in the Imperial Harem occupy his mind more and more.  Perhaps if he sent his good friend a sufficient gift the Sultan he would once again be allowed a visit."
 cosmo_degeneracy_events.7.a:0 "The Caliph is most generous."
 cosmo_degeneracy_events.8.t:0 "A Gentlewoman has Been Taken"
 cosmo_degeneracy_events.8.d:0 "In a brazen and outrageous assault on our sovereignty the [Root.GetAdjective] coast was raided by Barbary pirates, among those abducted is the daughter of one of your noblemen.  The ship belonged to slavers from the Barbary Coast it is feared she will be sold into slavery.  Your courageous son and heir leapt into action, without your permission he has commandeered a fast ship and is in hot pursuit."
 cosmo_degeneracy_events.8.a:0 "That reckless fool, I will pray for his safe return."
 cosmo_degeneracy_events.801.t:0 "Such Misery"
 cosmo_degeneracy_events.801.d:0 "A message from your heir has arrived at court.  He chased the raiders back to their lair, a lawless and wild city named Algiers. He tells us that no Christian can be found in these lands except those who are slaves.  He fears this fate has befallen the young [Root.GetAdjective] gentlewoman.  Setting an ambush, he managed to kill the party of a wealthy merchant and steal their garments.  Concealing himself and his crew as Muslim buyers he managed to infiltrate one of the slave markets where he hopes to discover what became of our lady."
 cosmo_degeneracy_events.801.a:0 "He is where?!  Tell him to return at once."
 cosmo_degeneracy_events.802.t:0 "No sign of the [Root.GetAdjective] Gentlewoman."
 cosmo_degeneracy_events.802.d:0 "Having searched every Market in the city your heir has nonetheless found no leads.  It appears the woman may have already been sold on, if he wishes to find where he will have to get some answers from a person involved in the trade."
 cosmo_degeneracy_events.802.a:0 "Tales of his bravery are on the lips of every [Root.GetAdjective]." 
 cosmo_degeneracy_events.803.t:0 "A Captive of Our Own"
 cosmo_degeneracy_events.803.d:0 "Our heir has returned to us safe.  Ambushing and seizing one of the auctioneers in a back alley he managed to escape back to his ship, the city guards in hot pursuit.  During the voyage under intense questioning the man revealed that the lady had been sold off to an envoy from the Ottoman Empire, he was told she is to become a concubine in the Sultan's Imperial Harem."
 cosmo_degeneracy_events.803.a:0 "We will not stand idly by while they enslave our people."
 cosmo_degeneracy_events.9.t:0 "Most Unfortunate News"
 cosmo_degeneracy_events.9.d:0 "A message from your heir has arrived at court.  He chased the raiders back to their lair, a lawless and wild city named Algiers. He tells us that no Christian can be found in these lands except those who are slaves.  He fears this fate has befallen the young [Root.GetAdjective] gentlewoman.  Concealing himself and his crew as raiders themselves he means to infiltrate one of the slave markets and discover what became of our lady."
 cosmo_degeneracy_events.9.a:0 "He is where?!  Tell him to return at once."
 cosmo_degeneracy_events.399.t:0 "Colony Prospering"
 cosmo_degeneracy_events.399.d:0 "A year later your decision has paid dividends."
 cosmo_degeneracy_events.399.a:0 "The colony will survive."
 cosmoDegeneracyVariable: "Libertinism level"