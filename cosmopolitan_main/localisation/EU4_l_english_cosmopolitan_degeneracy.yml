 cosmo_degeneracy_events.6.t:0 "The [Root.Monarch.GetTitle]'s appetites"
 cosmo_degeneracy_events.6.d:0 "The court of the previous [Root.Monarch.GetTitle] in [Root.Capital.GetCapitalName]'s [Root.cosmoDegeneracyVariable.GetName] is [Root.cosmoDegeneracyVariable].  But now [Root.Monarch.GetTitle] [Root.Monarch.GetName] sits on the throne in [Root.Capital.GetCapitalName], and [Root.Monarch.GetHerHis] appetites as well as others' attempts to satisfy them may help shape [Root.Monarch.GetHerHis] reign and the [Root.GovernmentName] as a whole."
 cosmo_degeneracy_events.6.a:0 "Long live the [Root.Monarch.GetTitle]."
 cosmo_degeneracy_events.6.b:0 "[Root.Monarch.GetName] will inherit the [Root.Monarch.GetTitle]'s relations."
 cosmo_degeneracy_events.600.t:0 "Indulgence for the [Root.Monarch.GetTitle]'s sins"
 cosmo_degeneracy_events.600.d:0 "The [Root.Monarch.GetTitle] has purchased an indulgence from [PAP.Monarch.GetTitle] [PAP.Monarch.GetName] [Root.Monarch.GetHerHim]self with this [Root.Monarch.GetSheHe] has a clear conscience, for now at least.  Perhaps this will be the start of a new era."
 cosmo_degeneracy_events.600.a:0 "Surely a pious soul like the [Root.Monarch.GetTitle] has earned the Lord's forgiveness." 
 cosmo_degeneracy_events.601.t:0 "The Libertinism of [Root.Capital.GetCapitalName]'s Court"
 cosmo_degeneracy_events.601.d:0 "The [Root.Monarch.GetTitle] and [Root.Monarch.GetHerHis] court in [Root.Capital.GetCapitalName]'s [Root.cosmoDegeneracyVariable.GetName] is [Root.cosmoDegeneracyVariable.GetValue] [Root.CosmoLibertineLevel].  \n\n[Root.CosmoLibertineBlerb]"
 cosmo_degeneracy_events.601.a:0 "Go Back" 
 cosmo_degeneracy_events.603.t:0 "The Libertinism of [Root.Monarch.GetTitle] [Root.Monarch.GetName]'s [Root.GovernmentName]"
 cosmo_degeneracy_events.603.d:0 "The more libertine court of [Root.Monarch.GetTitle] [Root.Monarch.GetName] has afforded [Root.GetName] many unique opportunities, but some wonder if the [Root.Monarch.GetTitle] and [Root.Monarch.GetHerHis] advisors and others serving the [Root.GovernmentName] have not become distracted from their other pursuits.  There are also those that question whether the loosened morals of [Root.Capital.GetCapitalName] have corrupted the [Root.GovernmentName].  The [Root.Monarch.GetTitle] however has dismissed any such nonesense, and thinks the issue if any is that the court simply does not have enough eligible women.  A problem [Root.Monarch.GetSheHe] plans to address."
 cosmo_degeneracy_events.603.a:0 "The [Root.Monarch.GetTitle] gets what [Root.Monarch.GetSheHe] wants"
