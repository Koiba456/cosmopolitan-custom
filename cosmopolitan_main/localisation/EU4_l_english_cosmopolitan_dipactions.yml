 cosmo_entertain_dignitary_desc:0 "[Root.GetName] has arranged special entertainment for the ambassador from [From.GetName], we can take advantage of this opportunity to advance the interests of [Root.GetName].  Having someone loyal to [Root.GetName] so close to the [From.GetAdjective] court will aid us greatly in our negotiations as a back channel for suggestions that are better made internally from someone close to the [From.Monarch.GetTitle]."
