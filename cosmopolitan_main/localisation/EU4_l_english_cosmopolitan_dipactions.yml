 cosmo_dignitary_trust:0 "Increase Trust"
 cosmo_dignitary_trust_title:0 "Increase Trust"
 cosmo_dignitary_trust_desc:0 "At the [From.GetAdjective] capital our representatives are hard at work to improve the trust between us and our ally.  With the aid of someone so intimately involved with their ambassador we appear to be making progress.  Lately, only the most flattering praise of [Root.GetName] has been on the lips of the [From.GetAdjective] dignitary."
 cosmo_dignitary_trust_tooltip:0 "Increase Trust"  
