 cosmo_send_trade_fleet_action:0 "Economic Aid"
 cosmo_send_trade_fleet:0 "Economic Aid"
 cosmo_send_trade_fleet_action_title:0 "Economic Aid"
 cosmo_send_trade_fleet_action_desc:0 "[From.GetName] is wary of outside influence from great powers such as [Root.GetName].  [Root.Monarch.GetTitle] [Root.Monarch.GetName] has suggested that a grand trade fleet should be assembled, one which the [From.GetAdjective] could not possibly think to send back.  By showing [Root.GetName]'s great material wealth we will demonstrate just what all we can offer the [From.GetAdjective].\n§Y$$§ Enables Trade Fleet Decisions.§!"
 cosmo_send_trade_fleetalert_tooltip:0 "Can send an aid or trade mission"
 cosmo_send_sacrifice_action:0 "Offer Sacrifice"
 cosmo_send_sacrifice:0 "Offer Sacrifice"
 cosmo_send_sacrifice_action_title:0 "Offer Sacrifice"
 cosmo_send_sacrifice_action_desc:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] has decided that [Root.GetName] should offer [From.GetName] a sacrifice as a way of winning their favor.  By sending one of [Root.GetName]'s own to serve as a sacrifice in honor of [From.Monarch.GetTitle] [From.Monarch.GetName] and the [From.Religion.GetName] faith.\n§Y$$§ Send your choice of sacrifice.§!"
 cosmo_send_sacrificealert_tooltip:0 "Can send a sacrifice" 
 cosmo_send_military_support:0 "Military aid"
 cosmo_send_military_support_title:0 "Military aid"
 cosmo_send_military_support_desc:0 "[From.GetName] is seeking military assistance from [Root.GetName].  [Root.Monarch.GetTitle] [Root.Monarch.GetName] has suggested that an offer be made to send aid the [From.GetAdjective] army.  By showing [Root.GetName]'s military knowledge and ability we will demonstrate just what all we can offer the [From.GetAdjective].\n§Y$$§ Enables Military Support Decisions.§!"
 cosmo_send_military_support_tooltip:0 "Send an offer of military assistance"
 cosmo_force_break_alliance:0 "Break their Alliance"
 cosmo_force_break_alliance_title:0 "Break their Alliance"
 cosmo_force_break_alliance_desc:0 "[Root.GetName] will intervene to break one of [From.GetName]'s alliances."
 cosmo_force_break_alliance_tooltip:0 "Break their alliance"  
 cosmo_strengthen_union:0 "Strengthen Union"
 cosmo_strengthen_union_title:0 "Strengthen Union"
 cosmo_strengthen_union_desc:0 "[Root.GetName] has so far earned the trust of her [From.GetAdjective] allies, but to further intertwine the [Root.Dynasty.GetName] and [From.Dynasty.GetName] dynasties [Root.Monarch.GetTitle] [Root.Monarch.GetName] has decided the hand of [Root.Monarch.GetHerHis] beautiful [Root.CosmoDaughterSister] to the [From.GetAdjective] [From.Monarch.GetTitle].  This along with our steady commitment to [From.GetName] will surely open the relationship between our two countries further."
 cosmo_strengthen_union_tooltip:0 "Send an offer of marriage" 
 cosmo_integrate_unions:0 "Integrate with Subject"
 cosmo_integrate_unions_title:0 "Integrate with Subject"
 cosmo_integrate_unions_desc:0 "[Root.GetName] can put pressure on [From.GetName] to give up some of their sovereignity in an attempt to consolidate our allies holdings in the region."
 cosmo_integrate_unions_tooltip:0 "have them integrate with another of our subjects"   
 cosmo_request_advisors_tooltip:0 "Recruit an advisor from the country"
 cosmo_pu_agenda:0 "Seek agenda from subject"
 cosmo_pu_agenda_title:0 "Seek agenda from subject"
 cosmo_pu_agenda_desc:0 "[Root.GetName] can make promises to [From.GetName] in order to improve their trust in us."
 cosmo_pu_agenda_tooltip:0 "increase trust by completing an agenda"  
 cosmo_request_troops:0 "Request Manpower from subject"
 cosmo_request_troops_title:0 "Request Manpower from subject"
 cosmo_request_troops_desc:0 "[Root.GetName] will request manpower from [From.GetName]."
 cosmo_request_troops_tooltip:0 "Requesting Manpower"    
 cosmo_release_union:0 "Release Subject"
 cosmo_release_union_title:0 "Release Subject"
 cosmo_release_union_desc:0 "[Root.GetName] can grant [From.GetName] its independence or switch control to the nation."
 cosmo_release_union_tooltip:0 "release this subject"   
 cosmo_pu_joinwar:0 "Call to Join War"
 cosmo_pu_joinwar_title:0 "Call to Join War"
 cosmo_pu_joinwar_desc:0 "[Root.GetName] can make promises to [From.GetName] to help them obtain claims in our enemy's lands in return for joining our war efforts."
 cosmo_pu_joinwar_tooltip:0 "they will join our wars to pursue their claims"  
 cosmo_request_advisors_tooltip:0 "increase trust by completing an agenda"
 cosmo_invitation_to_harem_action:0 "Access to Harem"
 cosmo_invitation_to_harem_action_title:0 "Invitation to harem"
 cosmo_invitation_to_harem_action_desc:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] has asked his friend [From.Monarch.GetTitle] [From.Monarch.GetName] if he might be allowed to visit the [From.Monarch.GetTitle] at [From.Capital.GetCapitalName].  While there he thought he might visit the gardens and see the [From.Monarch.GetTitle]'s famed harem. \n§Y$$§ Allows use of Visit Harem diplomatic action.§!"
 cosmo_invitation_to_harem_action_tooltip:0 "Request an invitation to the famed harem" 
 cosmo_send_concubines_action:0 "Send concubines"
 cosmo_send_concubines_action_title:0 "Send Concubines"
 cosmo_send_concubines_action_desc:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] has offered his friend [From.Monarch.GetTitle] [From.Monarch.GetName] several hand picked women for the [From.Monarch.GetTitle] at his Harem in [From.Capital.GetCapitalName].  Beautiful, and honoured for the privilege of living among the gardens in the luxury of the [From.Monarch.GetTitle]'s famed harem. \n§Y$$§ Spawns Send Concubine events.§!"
 cosmo_send_concubines_action_tooltip:0 "Send concubines" 
 cosmo_visit_harem_action:0 "Visit the harem"
 cosmo_visit_harem_action_title:0 "Visit the harem"
 cosmo_visit_harem_action_desc:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] has received permission from his friend [From.Monarch.GetTitle] [From.Monarch.GetName] to visit the [From.Monarch.GetTitle] at [From.Capital.GetCapitalName].  While there he thought he might visit the gardens and see the [From.Monarch.GetTitle]'s famed harem. \n§Y$$§ [Root.Monarch.GetTitle] [Root.Monarch.GetName] departs for [From.Capital.GetCapitalName].§!"
