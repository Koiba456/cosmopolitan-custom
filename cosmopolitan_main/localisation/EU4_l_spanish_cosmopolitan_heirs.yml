l_spanish:
 cosmo_heirs_1_desc:0 "You and your new wife are inseperable, and you can feel that she will soon be with child.  It is time to admit that your eldest is not fit to rule."
 cosmo_heirs_1_title:0 "Encourage your son to join the church"
 daughter_wed_to_noble_DESC: "Marriage is not about love, it is about cementing the bonds that keep our country together"
 daughter_wed_to_noble:0 "Daugher wed"
 eldest_joins_church_DESC: "We gave our beloved first born to the church"
 eldest_joins_church:0 "Eldest in Clergy"
 cosmo_barbary_upgrade_3_desc:0 "A dominant power in the region, Algiers is now the undisputed center of the Barbary slave trade and has amassed wealth and power as a result"
 cosmo_barbary_upgrade_3_title:0 "Barbary Slave Market Upgraded" 
 cosmo_barbary_upgrade_2_desc:0 "Algiers has grown wealthy off the Barbary Slave trade and is now a powerful force in the region capable of raiding throughout Europe.  Ottoman merchants regularly frequent the market."
 cosmo_barbary_upgrade_2_title:0 "Barbary Slave Market Upgrade"
 cosmo_heir_married: "Our heir is already married"
 cosmo_heir_married_DESC: "Together they will sit on the throne when the time comes" 
 cosmo_heir_visit_DESC: "the dynasty's future is safe"
 cosmo_heir_visit:0 "Recently visited"
 cosmo_heir_adventure_desc:0 "You have resorted to locking your heir in their room to keep them from running away"
 cosmo_heir_adventure_title:0 "Allow your heir to leave court" 
 cosmo_heir_abdicate_desc:0 "Having tasted freedom your heir has second thoughts about assuming the throne"
 cosmo_heir_abdicate_title:0 "Your heir wishes to abdicate"  
 cosmo_adventure_check_desc:0 "Check your heir's adventuring level, this caps at 100"
 cosmo_adventure_check_title:0 "Check adventuring level of heir" 
 cosmoAdventuringVariable:0 "Heir's Adventuring Level"
 heir_experienced_navigator_DESC: "Your heir is an experienced navigator, his experiences invaluable"
 heir_experienced_navigator:0 "Experienced Navigator" 
 cosmo_heirs_events.1.t:0 "Your Daughters Weddings"
 cosmo_heirs_events.1.d:0 "You can remember holding them when they were mere infants, you swore to yourself that you would always protect them.  But you are the [Root.Monarch.GetTitle] and your rule depends on men like these.  So you will parade your sweet young daughters in front of these lecherous old men.  You had told your daughters that you would find them worthy suitors, but these wrinkled old fools are truly only useful for one thing.  Lining your pockets, and cementing your legitimacy."
 cosmo_heirs_events.1.a:0 "Marry for power."
 cosmo_heirs_events.1.b:0 "Marry for wealth." 
 cosmo_heirs_events.1002.t:0 "The heirs"
 cosmo_heirs_events.1002.d:0 "Your new wife wishes to properly get to know you and has suggested the two of you travel so you can have the necessary privacy to ensure the future of your rule."
 cosmo_heirs_events.1002.a:0 "Matters of state can wait."
