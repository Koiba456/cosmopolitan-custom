 cosmo_heirs_events.8.t:0 "Your Heir and his Books"
 cosmo_heirs_events.8.d:0 "Since that damned tutor taught the boy to read he has been consuming the day's literature at a disturbing pace.  His favorite genre is that of the Chivalric Knight, he dreamed of slaying dragons and rescuing princess.  Though he talks less of dragons these days, the damsels in distress seem to be on his mind more and more."
 cosmo_heirs_events.8.a:0 "I should have had that troublesome tutor beheaded."
