 cosmo_heirs_events.9.t:0 "Your son has left [Root.Capital.GetCapitalName]"
 cosmo_heirs_events.9.d:0 "Your son is determined to leave court and see the world for himself.  He has taken to calling himself by the nom de guerre, Rodrigo Díaz, after the title character of his favorite piece of literature El Cid.  He told a close group of confidants to meet him outside the city walls and together they embarked in the middle of the night.  Seeking out some kind of grand adventure of their own in the hopes others will one day read about their many exploits."
 cosmo_heirs_events.9.a:0 "He sets out with a band of friends to make names for themselves." 
 cosmo_heirs_events.9.b:0 "He abscods with the [Root.Monarch.GetTitle]'s own ship, setting sail for open seas."   
