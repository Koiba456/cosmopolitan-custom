 cosmo_heirs_events.10.t:0 "Your heir has died"
 cosmo_heirs_events.10.d:0 "Word has arrived at court that your son and heir is dead.  We pray he is in a better place now." 
 cosmo_heirs_events.10.a:0 "I will mourn his loss." 
 cosmo_heirs_events.110.t:0 "Encounters while traveling"
 cosmo_heirs_events.110.d:0 "Your heir has just met the most spectacular woman.  She is not only beautiful, but she has told him the most fascinating things about the local area.  Together they walked through the streets and as they did she pointed out all the most influential people.  Later on, she showed him how the people here entertain themselves.  Your heir seemed quite taken with her, hopefully he was careful." 
 cosmo_heirs_events.110.a:0 "Good for him" 
 cosmo_heirs_events.120.t:0 "Encounters while traveling"
 cosmo_heirs_events.120.d:0 "Your heir has just met the most spectacular woman.  She is not only beautiful, but she has told him the most fascinating things about the local area.  The two of them could be seen walking on the beaches for hours and hours, and did not reappear until some time later." 
 cosmo_heirs_events.120.a:0 "Good for him"
 cosmo_heirs_events.130.t:0 "Encounters while traveling"
 cosmo_heirs_events.130.d:0 "Trecking across the wild untamed wilderness the last thing your heir was expecting was to meet a woman.  They encountered her near a stream and your heir managed to converse with her long enough to find out some basic information about the surrounding area.  The two seemed to get along and our party was asked back to her village to spend the night.  That night the two of them were practically inseperable and she gave him a tour of the nearby countryside." 
 cosmo_heirs_events.130.a:0 "Good for him." 
