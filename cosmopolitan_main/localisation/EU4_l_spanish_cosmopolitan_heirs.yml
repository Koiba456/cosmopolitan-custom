 cosmo_heirs_events.601.t:0 "Adventures of your heir"
 cosmo_heirs_events.601.d:0 "Your gallant heir has already had many an adventure, and gotten to know a bit of the world.  This experience may prove invaluable when and if he becomes ruler.   [Root.cosmoAdventuringVariable.GetName] [Root.cosmoAdventuringVariable.GetValue]"
 cosmo_heirs_events.601.a:0 "When he returns he will be a better man"  