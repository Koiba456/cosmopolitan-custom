 cosmo_heirs_events.101.t:0 "Ghana and the gold coast"
 cosmo_heirs_events.101.d:0 "The Gold Coast saw a great deal of merchant and military activity as various European nations vied for access and eventually control over the region's many valuable resources, including the valuable gold markets after which it was named.  But the sailors aboard our ships swear instead that it is actually named so because of the golden skin of the beauty they saw on the shore when we discovered this land for ourselves.  Vivid descriptions abound below decks to anyone who would listen of her golden breasts glistening in the coastal sun." 
 cosmo_heirs_events.101.a:0 "We will stake our own claims."  
 cosmo_heirs_events.102.t:0 "The Kayapo"
 cosmo_heirs_events.102.d:0 "Some men took small boats inland where they encountered a friendly tribe.  They traded with these people and took note of their unique customs, they made note to return soon to find out more about them." 
 cosmo_heirs_events.102.a:0 "We will stake our own claims."  
 cosmo_heirs_events.103.t:0 "The Iquitos"
 cosmo_heirs_events.103.d:0 "The Amazonian tribe fascinated our men with their customs of body painting and piercings." 
 cosmo_heirs_events.103.a:0 "What an interesting people."  
 cosmo_heirs_events.104.t:0 "Tahiti"
 cosmo_heirs_events.104.d:0 "An island paradise where many men aboard our ship claim to have romanced one of the beautiful native women we encountered, a few claim to have wives and children on the island though we had only stopped for the few days." 
 cosmo_heirs_events.104.a:0 "It truly was a paradise."  
 cosmo_heirs_events.105.t:0 "The Zulu"
 cosmo_heirs_events.105.d:0 "They call it the cape of storms, and many an unfortunate sailor has found out firsthand why.  Ashore to mend a broken mast some of our men encountered some natives who took them back to their settlement for trade.  Though there were shown many valuable treasures and riches of the chieftan as we set sail again our men speak mostly of the women." 
 cosmo_heirs_events.105.a:0 "A fascinating people."    
 cosmo_heirs_events.106.t:0 "The Skeleton Coast"
 cosmo_heirs_events.106.d:0 "Portuguese sailors refer to it as "The Gates of Hell".  This desert coast seems inhospitable and desolate.  Yet the nomadic pastoralists of the Himba tribe have made their lives here among the otherwordly scenary and multicolored desert mountainscapes.  The men and women cover themselves in very little aside from the red ochre they paint their bodies with. The women weave their hair into intricate hairstyles and adorn themselves in all kinds of jewelry.  Surely there is far more to this land than we first surmised." 
 cosmo_heirs_events.106.a:0 "Breathtaking scenary." 
 cosmo_heirs_events.150.t:0 "True stories of mermaids and other wonders"
 cosmo_heirs_events.150.d:0 "Your son and heir writes passionately of his adventures abroad.  He has traveled to the ends of the earth and there he has seen the mythical beauty of the mermaid women, topless and sunkissed.  He talks at length about the native women of the strange lands he has visited and the wonderous people, resources, and treasures that await our nation overseas." 
 cosmo_heirs_events.150.a:0 "Hopefully he has something to show for all this." 
