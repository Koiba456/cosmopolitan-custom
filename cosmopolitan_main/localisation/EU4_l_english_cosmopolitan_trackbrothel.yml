 cosmo_trackbrothel_events.6533.d:0 "Catalina has arrived in [convertprovince.GetName] and it did not take long for her to acquaint herself with the local brothel's prostitutes and patrons.  The prostitutes practically leapt at the opportunity to abandon a faith which had so harshly condemned them as sinners, and many have become eager missionaries themselves for the faith, whispering into the ears of their satisfied clients."
 cosmo_trackbrothel_events.6533.a:0 "She is an inspiration to us all"
 cosmo_trackbrothel_events.6533.b:0 "She is an inspiration to us all" 
 cosmo_trackbrothel_events.6141.t:0 "Prostitutes in [Root.Capital.GetCapitalName]"
 cosmo_trackbrothel_events.6141.d:0 "From across Europe, these women come from a variety of backgrounds.  Far from your average prostitute servicing drunks and poor students, they have received training from the most renowned madams to service only the finest of clientele.  Here in [Root.Capital.GetCapitalName] they are in high demand as entertainment for the wealthiest and most powerful.  The [Root.GetAdjective] [Root.GovernmentName] sees great value in their use in persuading those in power when other forms of persuasion prove insufficient" 
 cosmo_trackbrothel_events.6141.a:0 "Juliana from Suffolk"
 cosmo_trackbrothel_events.6141.b:0 "Aveline from Kent"
 cosmo_trackbrothel_events.6141.c:0 "Matilda from Bristol"
 cosmo_trackbrothel_events.6141.7:0 "See who else is available" 
 cosmo_trackbrothel_events.6241.t:0 "Juliana of Suffolk"
 cosmo_trackbrothel_events.6241.d:0 "Juliana, originally from Suffolk, is one of the more celebrated courtesans in the capital, and is highly sought after making her a useful ally to the [Root.GovernmentName].\n\n[Root.HeirOrAdvisor3] \n\n[Root.ProstituteReward]"
 cosmo_trackbrothel_events.6241.a:0 "For the good of [Root.CosmoTheName][Root.GetName]"
 cosmo_trackbrothel_events.6241.b:0 "For the good of [Root.CosmoTheName][Root.GetName]"
 cosmo_trackbrothel_events.6341.t:0 "Inspired Devotion"
 cosmo_trackbrothel_events.6341.d:0 "A visit from the [Root.Monarch.GetTitle] was the final push Marguerite needed to convince her to return to the region of her upbringing and help spread the new faith.  She promises [Root.Monarch.GetName] that as soon as she leaves she will contact the church and begin preparations to leave immediately.  She promises she will return to the district, but she must first make a visit to her homeland to tell the people there of [Root.Monarch.GetName]'s great benevolence and of the wisdom and charity that only [Root.Religion.GetName] can offer."
