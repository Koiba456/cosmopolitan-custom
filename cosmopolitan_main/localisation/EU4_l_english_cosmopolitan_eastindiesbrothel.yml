 cosmo_eastindiesbrothel_events.101.t:0 "Attracting new prostitutes to [Root.Capital.GetCapitalName]"
 cosmo_eastindiesbrothel_events.101.d:0 "Prostitutes from the region are becoming quite popular in [Root.GetName].[Root.EastIndiesMadams][Root.MalayaMadams][Root.SumatraMadams][Root.IndonesiaMadams][Root.SouthMoluccasMadams][Root.NorthMoluccas].  For now the clientele in [Root.Capital.GetCapitalName] will have to make due with those already in the city."
