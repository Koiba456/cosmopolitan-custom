l_english:
 cosmo_ookuestate_events.11.t:0 "Arrived in [Root.Capital.GetCapitalName]"
 cosmo_ookuestate_events.11.d:0 "From [consortprovince.GetName], the young Otomo woman possessing unrivaled beauty, and born from a family of considerable wealth and power in the area has been brought to [Root.Capital.GetCapitalName].  Hopefully her presence at court will please [Root.Monarch.GetTitle] [Root.Monarch.GetName]."
 cosmo_ookuestate_events.20.t:0 "[Root.GetName]'s isolation"
 cosmo_ookuestate_events.20.d:0 "As the [Root.Monarch.GetTitle] spends more time in [Root.Monarch.GetHerHis] Ooku their influence on the [Root.GovernmentName] grows.  The question of [Root.GetName]'s isolation from those outside of Japan is a much debated topic topic in [Root.Capital.GetCapitalName], and weighs heavy on [Root.Monarch.GetTitle] [Root.Monarch.GetName]'s mind, as once again [Root.Monarch.GetSheHe] heads for the comfort of [Root.Monarch.GetHerHis] Ooku to ponder [Root.Monarch.GetHerHis] decision."
 cosmo_ookuestate_events.20.a:0 "We should open [Root.GetName]"
 cosmo_ookuestate_events.20.b:0 "[Root.Capital.GetCapitalName] has everything the [Root.Monarch.GetTitle] could want"
 cosmo_ookuestate_events.20.c:0 "A change at this time is unnecessary"
