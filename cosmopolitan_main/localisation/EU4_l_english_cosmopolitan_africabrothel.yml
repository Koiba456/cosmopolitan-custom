 cosmo_africabrothel_events.101.b:0 "See all options again"
 cosmo_africabrothel_events.101.c:0 "Cancel plans"
 cosmo_africabrothel_events.6111.t:0 "Prostitutes in [Root.Capital.GetCapitalName]"
 cosmo_africabrothel_events.6111.d:0 "From across Africa, these women come from a variety of backgrounds.  Far from your average prostitute servicing drunks and poor students, they have received training from the most renowned madams to service only the finest of clientele.  Here in [Root.Capital.GetCapitalName] they are in high demand as entertainment for the wealthiest and most powerful.  The [Root.GetAdjective] [Root.GovernmentName] sees great value in their use in persuading those in power when other forms of persuasion prove insufficient"   
 cosmo_africabrothel_events.6111.a:0 "Zayna from Massina"
 cosmo_africabrothel_events.6111.b:0 "Hadiya from Jomo"
 cosmo_africabrothel_events.6111.c:0 "Farrah from Jenne"
 cosmo_africabrothel_events.6111.7:0 "See who else is available" 
 cosmo_africabrothel_events.6211.t:0 "Zayna of Massina"
 cosmo_africabrothel_events.6211.d:0 "Zayna, originally from Massina, is one of the more celebrated courtesans in the capital, and is highly sought after making her a useful ally to the [Root.GovernmentName].\n\n[Root.HeirOrAdvisor3] \n\n[Root.ProstituteReward]"
 cosmo_thenamethe:0 "the "
 cosmo_thenameno:0 ""
 cosmo_africabrothel_events.6211.a:0 "For the good of [Root.CosmoTheName][Root.GetName]"
 cosmo_africabrothel_events.6211.b:0 "For the good of [Root.CosmoTheName][Root.GetName]"
 cosmo_africabrothel_events.6301.t:0 "Inspired Devotion"
 cosmo_africabrothel_events.6301.d:0 "A visit from the [Root.Monarch.GetTitle] was the final push Zayna needed to convince her to return to the region of her upbringing and help spread the new faith.  She promises [Root.Monarch.GetName] that as soon as she leaves she will contact the church and begin preparations to leave immediately.  She promises she will return to the district, but she must first make a visit to her homeland to tell the people there of [Root.Monarch.GetName]'s great benevolence and of the wisdom and charity that only [Root.Religion.GetName] can offer."
 cosmo_africabrothel_events.6301.a:0 "Wish her luck in her proselytizing"
 cosmo_africabrothel_events.6301.b:0 "Wish her luck in her proselytizing"
 cosmo_africabrothel_events.6501.t:0 "Proselytizing in [convertprovince.GetName]"
 cosmo_africabrothel_events.6501.d:0 "Zayna has arrived in [convertprovince.GetName] and it did not take long for her to acquaint herself with the local brothel's prostitutes and patrons.  The prostitutes practically leapt at the opportunity to abandon a faith which had so harshly condemned them as sinners, and many have become eager missionaries themselves for the faith, whispering into the ears of their satisfied clients."
 cosmo_africabrothel_events.6501.a:0 "She is an inspiration to us all"
 cosmo_africabrothel_events.6501.b:0 "She is an inspiration to us all"
