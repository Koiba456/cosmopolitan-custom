 cosmo_africabrothel_events.6552.d:0 "Gretchen has arrived in [convertprovince.GetName] and it did not take long for her to acquaint herself with the local brothel's prostitutes and patrons.  The prostitutes practically leapt at the opportunity to abandon a faith which had so harshly condemned them as sinners, and many have become eager missionaries themselves for the faith, whispering into the ears of their satisfied clients."
