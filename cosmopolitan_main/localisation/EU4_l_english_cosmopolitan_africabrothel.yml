 cosmo_africabrothel_events.101.t:0 "Attracting new prostitutes to [Root.Capital.GetCapitalName]"
 cosmo_africabrothel_events.101.d:0 "Prostitutes from the region are becoming quite popular in [Root.GetName].[Root.AfricaMadams][Root.WestAfricaMadams][Root.SahelAfricaMadams][Root.SouthAfricaMadams][Root.CongoAfricaMadams][Root.ZanzibarMadams][Root.EthiopiaMadams][Root.GreatLakesMadams][Root.ZembeziMadams][Root.KatsinaMadams].  For now the clientele in [Root.Capital.GetCapitalName] will have to make due with those already in the city."
