 cosmo_eurohpu_events.10237.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon"
 cosmo_eurohpu_events.10237.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  [honeymoonprovince.GetName] is the final stop on the tour with the [Root.Monarch.Dynasty.GetName] benefiting from the experience and new ties in the area."   
 cosmo_eurohpu_events.10237.a:0 "End the honeymoon" 
