 cosmo_eurohpu_events.71031.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon" 
 cosmo_eurohpu_events.71031.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  It is also an opportunity to introduce [Root.GetName] to key diplomats and others who will grow our trade presence and [Root.GetAdjective] knowledge of the region." 
 cosmo_eurohpu_events.71031.a:0 "On to the next stop"  
 cosmo_eurohpu_events.71032.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon" 
 cosmo_eurohpu_events.71032.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  The bride and others also have made it clear the great expectations that are growing about what they hope the alliance with [Root.GetName] can provide for  their nation." 
