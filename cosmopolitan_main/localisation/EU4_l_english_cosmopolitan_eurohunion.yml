 cosmo_eurohpu_events.1301.a:0 "Embark for [honeymoonprovince.GetName]" 
 cosmo_eurohpu_events.13031.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon" 
 cosmo_eurohpu_events.13031.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  It is also an opportunity to introduce [Root.GetName] to key diplomats and others who will grow our trade presence and [Root.GetAdjective] knowledge of the region." 
