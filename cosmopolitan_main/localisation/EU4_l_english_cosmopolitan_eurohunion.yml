 cosmo_eurohpu_events.5101.d:0 "The [Root.GetAdjective] royal couple has embarked on their honeymoon, first stop [honeymoonprovince.GetName] in [honeymoonprovince.GetAreaName].  From there they will tour other provinces in the region.  The trip is an excellent opportunity to boost local ties to the [Root.GovernmentName] as well as for the couple to explore their new relationship." 
 cosmo_eurohpu_events.5101.a:0 "Embark for [honeymoonprovince.GetName]" 
 cosmo_eurohpu_events.5101.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon" 
