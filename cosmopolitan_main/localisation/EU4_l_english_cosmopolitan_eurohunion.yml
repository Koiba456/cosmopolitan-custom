 cosmo_eurohpu_events.91031.a:0 "On to the next stop"  
 cosmo_eurohpu_events.91032.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon" 
 cosmo_eurohpu_events.91032.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  The bride and others also have made it clear the great expectations that are growing about what they hope the alliance with [Root.GetName] can provide for  their nation." 
 cosmo_eurohpu_events.91032.a:0 "On to the next stop" 
 cosmo_eurohpu_events.91033.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon"
 cosmo_eurohpu_events.91033.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  [honeymoonprovince.GetName] is the final stop on the tour with the [Root.Monarch.Dynasty.GetName] benefiting from the experience and new ties in the area."   
 cosmo_eurohpu_events.91033.a:0 "End the honeymoon" 
 cosmo_eurohpu_events.91041.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon"
 cosmo_eurohpu_events.91041.d:0 "The [Root.GetAdjective] royal couple has arrived in [honeymoonprovince.GetName] in [honeymoonprovince.GetAreaName].  The trip is an excellent opportunity to boost local ties to the [Root.GovernmentName] as well as for the couple to explore their new relationship."
