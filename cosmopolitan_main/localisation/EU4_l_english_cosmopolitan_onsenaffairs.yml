 cosmo_onsenaffairs_events.401.t:0 "Advisor from the Ooku"
 cosmo_onsenaffairs_events.401.d:0 "The [Root.Monarch.GetTitle]'s favorite consort has become more than a personal confident for [Root.Monarch.GetHerHim].  [Root.Monarch.GetTitle] [Root.Monarch.GetName] has began to regularly seek her advice on matters of state, and feels that she is more qualified to serve as an advisor than [Root.Monarch.GetHerHis] current advisors."
 cosmo_onsenaffairs_events.401.a:0 "As long as it keeps [Root.Monarch.GetHerHim] happy"
 cosmo_onsenaffairs_events.401.b:0 "The [Root.GovernmentName] is not in need of a new advisor"  