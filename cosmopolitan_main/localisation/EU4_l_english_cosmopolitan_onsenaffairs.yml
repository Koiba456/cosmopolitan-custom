l_english:
 cosmo_onsenaffairs_events.200.t:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] visits [Root.Capital.GetCapitalName]'s onsen"
 cosmo_onsenaffairs_events.200.d:0 "The [Root.Monarch.GetTitle]'s favorite onsen in [Root.Capital.GetCapitalName] has amassed quite the reputation.  Visitors from cities far beyond the [Root.GetAdjective] borders flock to the exclusive and sought after resort.  It helps that [Root.Monarch.GetName]'s favorite inn is always teaming with new and interesting people for the [Root.Monarch.GetTitle] to mingle with.  [Root.Monarch.GetSheHe] always returns refreshed, and espousing the many health benefits of the hot spring."
 cosmo_onsenaffairs_events.200.a:0 "As long as it keeps [Root.Monarch.GetHerHim] happy"
 cosmo_onsenaffairs_events.200.b:0 "These affairs are a hinderance, we should put a stop to them"
