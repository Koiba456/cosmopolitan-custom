 cosmo_rebellious_daughter_colonist_desc:0 "now hopefully catching malaria in the jungle"
 cosmo_pirate_lover:0 "The princess's pirate lover" 
 cosmo_pirate_lover_desc:0 "thankfully the life of a pirate is short and full of danger" 
 cosmo_mercenary_lover:0 "The princess's mercenary captain lover" 
 cosmo_mercenary_lover_desc:0 "thankfully the life of a mercenary is short and full of danger"
 african_women:0 "Women from Africa"
 PRIVATEER_SLAVES:0 "Slaves captured by pirates" 
 cosmo_brothel_train_desc:0 "Runaway servant girls are in need of a proper madam's training to attract better clients."
 cosmo_brothel_train_title:0 "Improve the stock at your brothel" 
 cosmo_brothel_train_desc:0 "Runaway servant girls are in need of a proper madam's training to attract better clients."
 cosmo_daughter_events.1101.t:0 "The [Root.GetAdjective] princess is trouble"
 cosmo_daughter_events.1101.d:0 "Another drunken night of carousing, the court littered with young men and women he doesn't know nor wish to [Root.Monarch.GetTitle] [Root.Monarch.GetName]'s daughter is not the obedient and well mannered girl most monarchs would hope for.  It will be difficult to find a match for her that will not cause problems down the road, but [Root.Monarch.GetTitle] [Root.Monarch.GetName] worries what she will get up to if not wed soon.   She is [Root.Monarch.GetHerHis] own daughter after all."
 cosmo_daughter_events.1101.a:0 "How much trouble could she be, she is a $DYNASTY$"
 cosmo_daughter_events.1101.b:0 "How much trouble could she be, she is a $DYNASTY$"
 cosmo_daughter_events.1201.t:0 "The opportunist and the [Root.GetAdjective] princess"
 cosmo_daughter_events.1201.d:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] was disappointed to learn that his lovely daughter was caught by one of her lady's maids laying indecently with some minor courtier.  Apparently the young lady was quite scarred by the incident, and the angry tongue lashing she received from the daughter of the [Root.Monarch.GetTitle] for her impudence in having entered her chambers uninvited in the first place."
 cosmo_daughter_events.1201.a:0 "Buy off the maid and the courtier"
 cosmo_daughter_events.1201.b:0 "Have the courtier and the maid imprisoned"
 cosmo_daughter_events.1201.c:0 "Have the courtier and the maid imprisoned" 
 cosmo_daughter_events.1201.7:0 "Buy off the maid and the courtier"
 cosmo_daughter_events.1202.t:0 "Word of the [Root.GetAdjective] princess's affair has escaped"
 cosmo_daughter_events.1202.d:0 "[Root.Monarch.GetName] is furious.  His daughter has humiliated the family and now he cannot be seen to punish her or it would only give credence to that horrible woman's slanderous accusations."
 cosmo_daughter_events.1202.a:0 "Where did poor [Root.Monarch.GetName]'s daughter go so wrong"
 cosmo_daughter_events.1202.b:0 "Where did poor [Root.Monarch.GetName]'s daughter go so wrong"
 cosmo_daughter_events.1203.t:0 "No one will hear of the [Root.GetAdjective] princess's private business"
 cosmo_daughter_events.1203.d:0 "[Root.Monarch.GetName] is relieved to hear that the two evil plotters have been safely secured in the palace dungeons where they can no longer harm the good name of $DYNASTY$."
 cosmo_daughter_events.1203.a:0 "The problem is solved, and this is likely just a phase"
 cosmo_daughter_events.1203.b:0 "The problem is solved, and this is likely just a phase" 
 cosmo_daughter_events.1301.t:0 "The [Root.GetAdjective] Princess and the wealthy couple"
 cosmo_daughter_events.1301.d:0 "[Root.Monarch.GetName] has learned that his daughter has been carrying on a scandalous affair with a married man.  The man has recently returned from our colony in  [adventurerprovince.GetName] where he has amassed a great fortune.  He brought back with him an exotic foreign wife who has been the subject of a great deal of gossip in the capital [Root.Capital.GetCapitalName], it is even said she also takes part in their debauchery, with some even claiming that the she and not the husband is the true interest of her royal highness." 
 cosmo_daughter_events.1301.a:0 "Order him to head up a new colony on an island far away"
 cosmo_daughter_events.1301.b:0 "Order him to head up a new colony on an island far away"
 cosmo_daughter_events.1401.t:0 "The [Root.GetAdjective] princess and the pirate captain"
 cosmo_daughter_events.1401.d:0 "[Root.Monarch.GetName] has learned that his daughter has been carrying on a salacious affair with none other than a notorious pirate from [daughterprovince.GetName] in [piratecountry.GetName].  Now the two of them have disappeared, and in her bedchambers our guards found a letter with demands for her ransom."
 cosmo_daughter_events.1401.a:0 "Ask the [piratecountry.GetAdjective] ambassador for aid"
 cosmo_daughter_events.1401.b:0 "Ask the [piratecountry.GetAdjective] ambassador for aid"
 cosmo_daughter_events.1401.c:0 "Pay the ridiculous ransom"
 cosmo_daughter_events.1401.7:0 "Pay the ridiculous ransom" 
 cosmo_daughter_events.1402.t:0 "[From.Monarch.GetTitle] [From.Monarch.GetName] of [From.GetName]'s daughter"
 cosmo_daughter_events.1402.d:0 "It appears that [From.Monarch.GetTitle] [From.Monarch.GetName] of [From.GetName]'s daughter has been kidnapped by one of our privateers.  He would be most appreciative of any help we could give in securing her safe return."
 cosmo_daughter_events.1402.a:0 "We would be glad to help"
 cosmo_daughter_events.1402.b:0 "We would be glad to help" 
 cosmo_daughter_events.1402.c:0 "No, fuck [From.Monarch.GetTitle]"
 cosmo_daughter_events.1402.7:0 "No, fuck [From.Monarch.GetTitle]" 
 cosmo_daughter_events.1403.t:0 "The pirate has been apprehended"
 cosmo_daughter_events.1403.d:0 "The ambassador from [From.GetName] is delighted to tell us that they have captured the notorious pirate who had taken the [Root.GetAdjective] princess.  She is on her way home, safe and her virtue still intact, apparently.  As for the pirate, the man swears he did not know that she was royalty.  He claims they met at a tavern, and that he knew nothing of the ransom demand left in her bedchambers.  It appears that was your daughters' own doing."
 cosmo_daughter_events.1403.a:0 "Offer him his own [Root.GetAdjective] fleet if he sails it far away."
 cosmo_daughter_events.1403.b:0 "Offer him his own [Root.GetAdjective] fleet if he sails it far away." 
 cosmo_daughter_events.1403.c:0 "He's lying, execute this criminal"
 cosmo_daughter_events.1403.7:0 "He's lying, execute this criminal" 
 cosmo_daughter_events.1404.t:0 "A complete failure"
 cosmo_daughter_events.1404.d:0 "The ambassador from [From.GetName] regrets to inform us that unfortunately they cannot intercede on our behalf to reclaim the princess.  They claim they have however managed to convince the pirates to lower their demands and hope this assistance will satisfy [Root.Monarch.GetTitle] [Root.Monarch.GetName]."
 cosmo_daughter_events.1404.a:0 "We have no choice then but to pay"
 cosmo_daughter_events.1404.b:0 "We have no choice then but to pay" 
 cosmo_daughter_events.1404.c:0 "We will not negotiate with pirates"
 cosmo_daughter_events.1404.7:0 "We will not negotiate with pirates"
 cosmo_daughter_events.1501.t:0 "The [Root.GetAdjective] princess and the [mercenarycountry.GetAdjective] mercenary captain"
 cosmo_daughter_events.1501.d:0 "[Root.Monarch.GetName] has learned that his daughter has been carrying on a salacious affair with none other than a notorious mercenary captain from [mercenarycountry.GetName].  The man has amassed quite a reputation on the field of battle and is not easily scared off.  The fool thinks he can convince you to allow him to wed your daughter.  [Root.Monarch.GetTitle] [Root.Monarch.GetName] was displeased to hear that the man is a distant relative of [mercenarycountry.Monarch.GetTitle] [mercenarycountry.Monarch.GetName] and so [Root.Monarch.GetSheHe] could not have him executed."
 cosmo_daughter_events.1501.a:0 "Hire his company and hope he dies on a battlefield somewhere soon"
 cosmo_daughter_events.1501.b:0 "Hire his company and hope he dies on a battlefield somewhere soon" 
 cosmo_daughter_events.1601.t:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] and the stableboy"
 cosmo_daughter_events.1601.d:0 "[Root.Monarch.GetName] has learned that his daughter has been carrying on a lewd affair with one of [Root.Capital.GetCapitalName]'s stableboys.  Something must be done before the $DYNASTY$ name is muddied."
 cosmo_daughter_events.1601.a:0 "We will need a new stableboy"
 cosmo_daughter_events.1601.b:0 "We will need a new stableboy"  