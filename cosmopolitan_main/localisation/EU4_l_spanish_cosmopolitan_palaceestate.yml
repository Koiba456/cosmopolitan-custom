 cosmo_fp_events.11.t:0 "Arrived in [Root.Capital.GetCapitalName]"
 cosmo_fp_events.11.d:0 "From [consortprovince.GetName], the young [consortprovince.Culture.GetName] woman possessing unrivaled beauty, and born from a family of considerable wealth and power in the area has been brought to [Root.Capital.GetCapitalName].  Hopefully her presence at court will please [Root.Monarch.GetTitle] [Root.Monarch.GetName]."
 cosmo_fp_events.11.a:0 "The [Root.Monarch.GetTitle] wants some time alone with [Root.Monarch.GetHerHis] new bride"
 cosmo_fp_events.11.b:0 "The [Root.Monarch.GetTitle] is sure to see her around the palace eventually"
