 cosmo_indochinabrothel_events.6323.t:0 "An introduction to the Amago or Yamana"
 cosmo_indochinabrothel_events.6323.d:0 "Yangchen has relatives back in Japan whom she believes could get word to a low ranking member of the Daimyo if [Root.Monarch.GetName] [Root.Monarch.GetName] desired it.  Such an introduction could allow [Root.GetName] to get a firmer foothold in the area.  Willing partners can always be found when the trade is appealing enough."
 cosmo_indochinabrothel_events.6323.a:0 "See if she really can arrange a meeting"
 cosmo_indochinabrothel_events.6323.b:0 "See if she really can arrange a meeting"
 cosmo_indochinabrothel_events.6523.t:0 "Proselytizing in [convertprovince.GetName]"
 cosmo_indochinabrothel_events.6523.d:0 "Yangchen has arrived in [convertprovince.GetName] and it did not take long for her to acquaint herself with the local brothel's prostitutes and patrons.  The prostitutes practically leapt at the opportunity to abandon a faith which had so harshly condemned them as sinners, and many have become eager missionaries themselves for the faith, whispering into the ears of their satisfied clients."
 cosmo_indochinabrothel_events.6523.a:0 "She is an inspiration to us all"
 cosmo_indochinabrothel_events.6523.b:0 "She is an inspiration to us all" 
 cosmo_indochinabrothel_events.6131.t:0 "Prostitutes in [Root.Capital.GetCapitalName]"
 cosmo_indochinabrothel_events.6131.d:0 "These women would fit in among the elegant Tayu at home in the famed Yoshiwara, Maruyama or Shimabara districts in one of Japan's most renowned establishments.  Here in [Root.Capital.GetCapitalName] they are in high demand as entertainment for the wealthiest and most powerful.  The [Root.GetAdjective] [Root.GovernmentName] sees great value in their use in persuading those in power when other forms of persuasion prove insufficient." 
