 cosmo_japanbrothel_events.101.t:0 "Attracting new prostitutes to [Root.Capital.GetCapitalName]"
 cosmo_japanbrothel_events.101.d:0 "Prostitutes from the region are becoming quite popular in [Root.GetName].[Root.JapaneseMadams][Root.ShikokuMadams][Root.NorthHonshuMadams][Root.KyushuMadams][Root.EastHonshuMadams][Root.SouthHonshuMadams].  For now the clientele in [Root.Capital.GetCapitalName] will have to make due with those already in the city."
