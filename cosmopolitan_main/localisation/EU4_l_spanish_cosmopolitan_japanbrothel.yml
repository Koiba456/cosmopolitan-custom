 cosmo_japanbrothel_events.6323.b:0 "See if she really can arrange a meeting"
 cosmo_japanbrothel_events.6523.t:0 "Proselytizing in [convertprovince.GetName]"
 cosmo_japanbrothel_events.6523.d:0 "Mizuki has arrived in [convertprovince.GetName] and it did not take long for her to acquaint herself with the local brothel's prostitutes and patrons.  The prostitutes practically leapt at the opportunity to abandon a faith which had so harshly condemned them as sinners, and many have become eager missionaries themselves for the faith, whispering into the ears of their satisfied clients."
 cosmo_japanbrothel_events.6523.a:0 "She is an inspiration to us all"
 cosmo_japanbrothel_events.6523.b:0 "She is an inspiration to us all" 
 cosmo_japanbrothel_events.6131.t:0 "Prostitutes in [Root.Capital.GetCapitalName]"
 cosmo_japanbrothel_events.6131.d:0 "These women would fit in among the elegant Tayu at home in the famed Yoshiwara, Maruyama or Shimabara districts in one of Japan's most renowned establishments.  Here in [Root.Capital.GetCapitalName] they are in high demand as entertainment for the wealthiest and most powerful.  The [Root.GetAdjective] [Root.GovernmentName] sees great value in their use in persuading those in power when other forms of persuasion prove insufficient." 
