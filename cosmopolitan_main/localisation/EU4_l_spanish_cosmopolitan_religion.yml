 cosmo_religion_events.1.t:0 "Cosmopolitan"
 cosmo_religion_events.1.d:0 "With [Root.GetAdjective] laying down roots on multiple continents the [Root.Monarch.GetTitle] has called for unity within the empire.  No longer will we see ourselves as [Root.GetAdjective], but as global citizens and together all the peoples under our [Root.GetAdjective] flag will prosper and create a new country."
 cosmo_religion_events.1.a:0 "We will endeavor to embrace all the world's people."
 cosmo_religion_events.3.t:0 "[Root.Monarch.GetName]'s friend the Cardinal"
 cosmo_religion_events.3.d:0 "    As [Root.Monarch.GetSheHe] made his way out of the brothel district [Root.Monarch.GetTitle] [Root.Monarch.GetName] couldn't help but notice a familiar face in the street.  Though normally [Root.Monarch.GetSheHe] would be discrete in [Root.Monarch.GetHerHis] comings and goings from the brothels [Root.Monarch.GetSheHe] couldn't resist calling out to his old friend from [Root.Monarch.GetHerHis] childhood at court.\n   The cardinal is beloved by the [Root.GetAdjective] people.  His particular brand of Catholicism is one of great compassion and speaks to those who live in the cities who flock by the hundreds to his sermons whenever he visits.  [Root.Monarch.GetName] saw that his dear friend, the cardinal was in some type of distress.  When pressed he revealed that he had just been to visit a prostitute, one whom he was quite fond of.  Earlier in the week she had been on the receiving end of a brutal attack from a mob of young men.  The local authorities seem powerless to do anything about it, and due to his position in the church he is discouraged from pressing the issue any further.  He knows that she was attacked in part because of her relations with members of the clergy, as such prostitutes are often considered fair game to attack and little is done to punish those responsible."
 cosmo_religion_events.3.a:0 "Promise your friend a position in court"
 cosmo_religion_events.3.b:0 "Warn him to drop the matter"
 cosmo_religion_events.4.t:0 "$THEOLOGIAN$'s fiery sermon"
 cosmo_religion_events.4.d:0 "    The cardinal, $THEOLOGIAN$ gave a fiery sermon from his pulpit this morning.  In it he condemned the hypocrisy of church officials.  He accused them of ignoring the plight of the poor and vulnerable of [Root.GetName].  He claimed they were quick to condemn the common man or woman to an eternity of damnation for the sins they themselves engage in regularly.  The gospel, he preached was delivered for the common man, clothed or bare with none of the expensive robes of the clergy.\n     $THEOLOGIAN$ stripped off the vestments that marked his position in the church and held them before the cheering crowd.  Then he admitted to his so-called sins, he admitted that he loved a woman and this woman was a prostitute.  But Jesus too loved such a woman in Mary Magdalene.  This was proof he said that God loves all his children, and any church who claimed otherwise had lost the mandate to preach the gospel.  Perhaps worst of all, he accused several top church officials of pederasty, and said their own sexual perversions were to blame for the false indignation by which they seek to punish others."
 cosmo_religion_events.4.a:0 "Stand by your friend, he has the crowd"
 cosmo_religion_events.4.b:0 "Remove $THEOLOGIAN$ immediately!"
 cosmo_religion_events.5.t:0 "$THEOLOGIAN$ the people's cardinal"
 cosmo_religion_events.5.d:0 "Though stripped of the title by Rome the Cardinal has not lost the adoration of the people of [Root.GetName].  Pope [Pap.Monarch.GetName]'s name, not that of Cardinal $THEOLOGIAN$ can be heard being cursed in alleyways and taverns across the nation.  The Cardinal himself has defied the Pope's order to return to Rome.  Though he has vacated his residence and the Cathedral he has moved into the brothel, and not long after began preaching.  Soon he was giving sermons from the rooftop and whipping the crowd into a passionate frenzy as he had often done on Sundays.  For the first time the prostitute at the heart of the controversy could be seen at his side.  Magdalena he calls her, and he announced they have been married."
 cosmo_religion_events.5.a:0 "It is too late to stop them now"
 cosmo_religion_events.6.t:0 "Magdalena the preacher"
 cosmo_religion_events.6.d:0 "Many people are now talking of Magdalena the new wife of Cardinal $THEOLOGIAN$.  While she merely stood behind him at first at his brothel sermons, soon she was speaking to the crowd while the Cardinal would rest his voice.  No shy mouse of a woman, she knew well how to capture the attention of an audience and her wit, passion, and humour made her a rival of even the Cardinal himself.  It is rumoured that she now travels alone, proselytizing in nearby cities.  Always starting at the brothel, among prostitutes like herself and then to others until this new church of theirs had a sizeable presence in several of the surrounding regions."
 cosmo_religion_events.6.a:0 "It seems reform is inevitable now"
 cosmo_religion_events.6.b:0 "The two of them must be stopped from spreading this heresy" 
 cosmo_religion_events.7.t:0 "It seems reform is inevitable now"
 cosmo_religion_events.7.d:0 "Unsurprisingly, the artists and students were the first to flock to the Cardinal's message.   They had always had a libertine outlook on sexual mores, for most it was not their first time in the brothel.  But not a small number of clergy had defected to Cardinal $THEOLOGIAN$'s cause as well and this is what most concerned Pope [PAP.Monarch.GetName]  and the church in Rome.  Many were perhaps more drawn by the promises of newfound freedom in this new congregation than any theological argument, many in the clergy were younger brothers and others who had left quite comfortable lives only to live under the thumb and the threat of rigid ministerial doctrine."
 cosmo_religion_events.7.a:0 "Rome will not take this sitting down"
 cosmo_religion_events.8.t:0 "Holy Treachery"
 cosmo_religion_events.8.d:0 "With victory within reach, freedom from Rome, and converts by the thousands pouring in to hear Cardinal $THEOLOGIAN$'s sermons the church's future appeared bright.  But tragedy struck when the cardinal was poisoned most horribly, as she tells it Magdalena witnessed as $THEOLOGIAN$ blood poured forth from his orifices.  Though he claimed at first to feel no pain, he was soon deceased.  Now she has fled with a number of their followers and there is a great deal of tension in the streets as people wonder what will happen next."
 cosmo_religion_events.8.a:0 "[Root.Monarch.GetName]'s friend lies dead, with him Catholicism as [Root.GetName]'s religion"
 cosmo_religion_events.8.b:0 "$THEOLOGIAN$ lies dead, let the movement die with him"
 
 