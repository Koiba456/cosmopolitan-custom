 kosmo_africanpu_events.1024.t:0 "The nation of Dagbon" 
 kosmo_africanpu_events.1024.d:0 "A dignitary from the recently captured city of [asiapuprovince.GetCapitalName] in [asiapuprovince.GetName] has arrived at the [Root.GetAdjective] capital [Root.Capital.GetCapitalName].  He claims that he and his people owe no allegiance to [asiapuprovince.Owner.Monarch.GetTitle] [asiapuprovince.Owner.Monarch.GetName] or [asiapuprovince.Owner.GetName].  His people are oppressed under [asiapuprovince.Owner.GetAdjective] rule and seek independence from the [asiapuprovince.Owner.GovernmentName].\nHaving heard of the [Root.Monarch.Dynasty.GetName]'s voracious appetite for beautiful women the dignitary also made sure that [Root.Monarch.GetTitle] [Root.Monarch.GetName] and the rest of the royal family had a good view of the beautiful woman accompanying him. Using his connections throughout [asiapuprovince.GetAreaName] he says he will help to quell any further resistance to [Root.GetAdjective] occupation and assemble a great army to assist in our war against the hated [asiapuprovince.Owner.GetAdjective].  In exchange he simply wishes to see his beloved daughter married, and the throne in [asiapuprovince.GetCapitalName] he claims was stolen from his family.  If the [Root.Monarch.GetTitle] agrees he says [Root.GetName] will forever have a loyal ally." 
