 kosmo_africanpu_events.13131.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  It is also an opportunity to introduce [Root.GetName] to key diplomats and others who will grow our trade presence and [Root.GetAdjective] knowledge of the region." 
 kosmo_africanpu_events.13131.a:0 "On to the next stop"  
 kosmo_africanpu_events.13136.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon" 
 kosmo_africanpu_events.13136.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  The bride and others also have made it clear the great expectations that are growing about what they hope the alliance with [Root.GetName] can provide for  their nation." 
 kosmo_africanpu_events.13136.a:0 "On to the next stop" 
 kosmo_africanpu_events.13137.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon"
 kosmo_africanpu_events.13137.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  [honeymoonprovince.GetName] is the final stop on the tour with the [Root.Monarch.Dynasty.GetName] benefiting from the experience and new ties in the area."   
 kosmo_africanpu_events.13137.a:0 "End the honeymoon" 
