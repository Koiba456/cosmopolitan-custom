 kosmo_africanpu_events.13306.t:0 "Economic aid to [personalunion.GetName]" 
 kosmo_africanpu_events.13306.d:0 "The [Root.GetAdjective] [Root.GovernmentName] has proposed send an economic aid mission to our good friends in [personalunion.GetName].  While some in the country may question the sincerity of their new powerful allies, our friends in [personalunion.Capital.GetCapitalName] are eager to share in the benefits of their new friendship.  There is much we can do to improve the [personalunion.GetAdjective] capital." 
 kosmo_africanpu_events.13306.a:0 "Send the [Root.Monarch.GetTitle]'s advisor, [Root.Adm_Advisor.GetName] to boost their administration" 
 kosmo_africanpu_events.13306.b:0 "Send the [Root.Monarch.GetTitle]'s advisor, [Root.Dip_Advisor.GetName] to aid their diplomacy" 
 kosmo_africanpu_events.13306.c:0 "Organize a trade mission to bring [Root.GetAdjective] goods to [personalunion.GetName]" 
 kosmo_africanpu_events.13306.7:0 "Cancel the aid" 
 kosmo_africanpu_events.13360.t:0 "Trade goods to be sent to [personalunion.GetName]" 
 kosmo_africanpu_events.13360.d:0 "The [Root.GetAdjective] [Root.GovernmentName] has many luxurious and exotic goods that are rare or entirely non existent in [personalunion.GetAdjective] markets.1  Organizing a fleet to show the abundance and prosperity of [Root.GetName] will surely demonstrate to the locals and merchants the value of our partnership in trade.  Both [Root.GetName] and [personalunion.GetName] stand to profit from the exchange." 
 kosmo_africanpu_events.13360.a:0 "Choose an export"  
 kosmo_africanpu_events.13361.t:0 "Trade ships arrive in [personalunion.GetName]" 
 kosmo_africanpu_events.13361.d:0 "The [Root.GetAdjective] ships have arrived to the coasts of [personalunion.GetName] and unloaded their goods.1  The port immediately is swamped by [personalunion.GetAdjective] eager to get a piece of the new [Root.GetAdjective] goods.1  While [Root.GetName] will still profit from the venture, the real value is in the lasting trade ties and reputation our merchants will carry in the region having provided exotic and rare items of a quality not often found in [personalunion.GetAdjective] markets.1" 
 kosmo_africanpu_events.13361.a:0 "[Root.GetAdjective] goods are in demand" 
 kosmo_africanpu_events.13314.t:0 "Military aid to [personalunion.GetName]" 
 kosmo_africanpu_events.13314.d:0 "The [Root.GetAdjective] military is the envy of the world.  To offer our assistance to [personalunion.GetName] in training and equipping their armies to the standards of [Root.GetName] herself shows the depth of our commitment to this alliance.  We will transform their forces into the equals of [Root.GetAdjective] legends.1  The [personalunion.GetAdjective] [personalunion.Monarch.GetTitle] will pay handsomely in exchange for our advice as the future of [personalunion.Capital.GetCapitalName] depends largely on [Root.GetAdjective] military support." 
 kosmo_africanpu_events.13314.a:0 "Send the [Root.Monarch.GetTitle]'s advisor, [Root.Mil_Advisor.GetName] to oversee their forces" 
 kosmo_africanpu_events.13314.b:0 "Fortify the capital, [personalunion.Capital.GetCapitalName]" 
 kosmo_africanpu_events.13314.c:0 "Train the [personalunion.GetAdjective] army" 
 kosmo_africanpu_events.13314.7:0 "Build ships for the [personalunion.GetAdjective] navy" 
 kosmo_africanpu_events.13314.8:0 "Cancel the aid" 
 kosmo_africanpu_events.13335.t:0 "The [personalunion.GetAdjective] army arrives in [personalunion.Capital.GetCapitalName]" 
 kosmo_africanpu_events.13335.d:0 "The [personalunion.GetAdjective] army has arrived in [personalunion.Capital.GetCapitalName] to celebrations throughout the capital.  [personalunion.Monarch.GetTitle] [personalunion.Monarch.GetName] marked the occassion promising that together with their [Root.GetAdjective] allies this new mighty [personalunion.GetAdjective] army will crush their enemies and protect [personalunion.GetName] and its people." 
 kosmo_africanpu_events.13335.a:0 "[Root.GetAdjective] advisors are well paid" 
 kosmo_africanpu_events.13334.t:0 "The [Root.GetAdjective] ships arrives in [personalunion.Capital.GetCapitalName]" 
 kosmo_africanpu_events.13334.d:0 "The [Root.GetAdjective] ships have arrived in [personalunion.GetAdjective] waters, and with it we have completed our promise of aid to [personalunion.Capital.GetCapitalName].  [personalunion.Monarch.GetTitle] [personalunion.Monarch.GetName] marked the occassion promising that together with their [Root.GetAdjective] allies this new mighty [personalunion.GetAdjective] ship will crush their enemies and protect [personalunion.GetAdjective] shores and its people as well as enable [personalunion.Monarch.GetHerHis] people to venture out into the world's vast oceans.1" 
 kosmo_africanpu_events.13334.a:0 "[Root.GetAdjective] ships are in demand"  
 kosmo_africanpu_events.13315.t:0 "Rebels spotted in [personalunion.GetAdjective] territory"
 kosmo_africanpu_events.13315.d:0 "It would appear that not everyone in [personalunion.GetName] appreciates our friends in the capital of [personalunion.Capital.GetCapitalName].  A rebel army is currently wreaking havoc in the countryside and even threatens [personalunion.GetAdjective] cities.1  If not dealt with soon it could undermine the [personalunion.Monarch.GetTitle]'s rule and with it the partnership between our two nations.1"
 kosmo_africanpu_events.13315.a:0 "Our ally [personalunion.Monarch.GetTitle] [personalunion.Monarch.GetName] must rule [personalunion.GetName]"
 kosmo_africanpu_events.13316.t:0 "The [personalunion.Culture.GetName] are united"
 kosmo_africanpu_events.13316.d:0 "[Root.GetName] and [personalunion.GetName] have united the homeland and strongholds of the [personalunion.Culture.GetName] people.  Hopefully this will put to rest rumors and insinuations that [personalunion.Monarch.GetTitle] [personalunion.Monarch.GetName] is mere pretenders and puppet.1  Having delivered on the promises they made their people when assuming the throne in [personalunion.Capital.GetCapitalName] they have shown the value of [personalunion.GetName]'s alliance with [Root.GetName], and both the [personalunion.Monarch.GetTitle] and people are grateful."
 kosmo_africanpu_events.13316.a:0 "Good for our friend, [personalunion.Monarch.GetTitle] [personalunion.Monarch.GetName]"   
 kosmo_africanpu_events.13319.t:0 "[Root.GetName]'s [personalunion.GetAdjective] Queen"
 kosmo_africanpu_events.13319.d:0 "Now that [Root.Monarch.GetName] has assumed the throne, [Root.Monarch.GetHerHis] [personalunion.GetAdjective] wife has become [Root.GetName]'s queen.  In [Root.Capital.GetCapitalName] the [Root.GetAdjective] people are entranced by their new exotic queen."
 kosmo_africanpu_events.13319.a:0 "A new queen assumes the throne"
 kosmo_africanpu_events.1410.t:0 "Freedom from [palacecountry.GetName]'s tyranny" 
 kosmo_africanpu_events.1410.d:0 "[palacecountry.Monarch.GetTitle] [palacecountry.Monarch.GetName] is a leech upon the good people of the region.  Not only does [palacecountry.Monarch.GetSheHe] demand tribute from his subjects and other nations, but he also takes from them their unwed daughters to be cruelly wed to the syphilis ridden lecher.  No longer must such a dark fate hang over her people.  A [Root.Monarch.GetWomanMan], more like a mythical hero from ancient legend has not only rescued her from the wretched [palacecountry.Monarch.GetTitle]'s clutches but others as well, and [palacecountry.Monarch.GetSheHe] is this very moment leading a rebellion of all the [palacecountry.Culture.GetGroupName] who can no longer live under the [palacecountry.GovernmentName.GetName]'s heavy yoke.  The [Root.GetAdjective] [Root.Monarch.GetTitle], [Root.Monarch.GetName] is the [Root.Monarch.GetWomanMan] who has selflessly stepped forward to help free her people.  This is the story she will tell to every person who will give her an audience." 
 kosmo_africanpu_events.1410.a:0 "Rally the people to the flag of Yao" 
 kosmo_africanpu_events.1410.b:0 "Rally the people to the flag of Haixi" 
 kosmo_africanpu_events.1410.c:0 "Rally the people to the flag of Khodynt" 
 kosmo_africanpu_events.1410.8:0 "Cancel the plan" 
