 kosmo_africanpu_events.16319.d:0 "Now that [Root.Monarch.GetName] has assumed the throne, [Root.Monarch.GetHerHis] [personalunion.GetAdjective] wife has become [Root.GetName]'s queen.  In [Root.Capital.GetCapitalName] the [Root.GetAdjective] people are entranced by their new exotic queen."
 kosmo_africanpu_events.16319.a:0 "A new queen assumes the throne"  