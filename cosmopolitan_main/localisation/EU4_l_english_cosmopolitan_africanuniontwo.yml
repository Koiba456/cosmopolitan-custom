 kosmo_africanpu_events.12398.t:0 "The Royal Marriage" 
 kosmo_africanpu_events.12303.t:0 "Secure a union with [proposalcountry.GetName]" 
 kosmo_africanpu_events.12303.d:0 "Along with arranging the marriage, [Root.GetName] seeks to offer an alliance to [proposalcountry.GetName] in which [Root.GetName] offers its protection to the weaker country. They will provide a suitable match for the [Root.Dynasty.GetName] dynasty, and the [Root.Monarch.GetTitle] will decide whether to accept their offer or not.  If all goes well [proposalcountry.GetName] could be a key regional ally for [Root.GetName]." 
 kosmo_africanpu_events.12303.a:0 "Wed [Root.Monarch.GetTitle] [Root.Monarch.GetName]" 
 kosmo_africanpu_events.12303.b:0 "Wed [Root.Heir.GetTitle] [Root.Heir.GetName]" 
