 cosmo_harem_events.7.t:0 "Dreams of the Imperial Harem"
 cosmo_harem_events.7.d:0 "The [Root.Monarch.GetTitle] has had many a restless night as of late.  Visions of his time in the Imperial Harem occupy his mind more and more.  Perhaps if he sent his good friend a sufficient gift the Sultan he would once again be allowed a visit."
 cosmo_harem_events.7.a:0 "The Caliph is most generous."
 cosmo_harem_events.700.t:0 "The Emperor's Concubines"
 cosmo_harem_events.700.d:0 "To honor the peace between our two great countries the [Root.Monarch.GetTitle] has been offered the rare invitation to visit the Emperor's own famed concubines.  Hand picked from some of the most beautiful women in his entire empire this is an unprecedented honor."
 cosmo_harem_events.700.a:0 "The [Root.Monarch.GetTitle] graciously accepts."
 cosmo_harem_events.700.b:0 "We will take no part in this heathen's debauchery." 
 cosmo_harem_events.701.t:0 "Dreams of the Emperor's Concubines"
 cosmo_harem_events.701.d:0 "The [Root.Monarch.GetTitle] has had many a restless night as of late.  Visions of his time among the Emperor's concubines occupy his mind more and more.  Perhaps if he sent his good friend a sufficient gift the Emperor would in turn once again allow him a visit."
 cosmo_harem_events.701.a:0 "Who can put a price on such an experience."
