 cosmo_harem_events.1.t:0 "Cosmopolitan"
 cosmo_harem_events.1.d:0 "With [Root.GetAdjective] laying down roots on multiple continents the [Root.Monarch.GetTitle] has called for unity within the empire.  No longer will we see ourselves as [Root.GetAdjective], but as global citizens and together all the peoples under our [Root.GetAdjective] flag will prosper and create a new country."
 cosmo_harem_events.1.a:0 "We will endeavor to embrace all the world's people."
 cosmo_harem_events.2.t:0 "Colony in Need of Women"
 cosmo_harem_events.2.d:0 "A commotion occurred near one of our colonies when one of our men was discovered laying with a native woman.  The soldier swears by all that is holy that she wanted him but nonetheless the scandal has caused tensions with the neighboring peoples to reach a boiling point.  Whatever is done to address the situation the reality is that the men have needs and our colonies long-term prosperity is necessarily dependent on many more such encounters taking place between men such as this and womenfolk, wherever they are sourced."
 cosmo_harem_events.2.a:0 "Intermarry equally with the native population."
 cosmo_harem_events.2.b:0 "Attack the natives and steal their women."
 cosmo_harem_events.2.c:0 "Bring in prostitutes to take advantage of the situation."
 cosmo_harem_events.3.t:0 "Colony Prospering"
 cosmo_harem_events.3.d:0 "A year later your decision has paid dividends."
 cosmo_harem_events.3.a:0 "The colony will survive."
 cosmo_harem_events.4.t:0 "A Gentlewoman has been Enslaved"
 cosmo_harem_events.4.d:0 "The daughter of one of your noblemen was set upon while sailing [Root.GetAdjective] coasts.  The ship belonged to slavers from the Barbary Coast it is feared she will be sold into slavery.  The noble urges you to act."
 cosmo_harem_events.4.a:0 "This is outrageous, we will act."
 cosmo_harem_events.5.t:0 "No Sign of the Noblewoman"
 cosmo_harem_events.5.d:0 "It has been some time, and our agents have been unable to locate the Nobleman's daughter.  It is feared like many others she has been lost forever to the slave markets."
 cosmo_harem_events.5.a:0 "We will pray for her family."
 cosmo_harem_events.6.t:0 "An Invitation to the Harem"
 cosmo_harem_events.6.d:0 "To celebrate the peace between our two countries the [Root.Monarch.GetTitle] has been offered the rare invitation to visit the Sultan's famed harem."
 cosmo_harem_events.6.a:0 "The [Root.Monarch.GetTitle] graciously accepts."
 cosmo_harem_events.6.b:0 "We will take no part in this heathen's debauchery."
