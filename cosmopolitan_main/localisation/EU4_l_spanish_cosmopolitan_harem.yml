 cosmo_harem_events.6100.t:0 "A Visit to the Harem"
 cosmo_harem_events.6100.d:0 "Each day at the Harem begins the same way.  A procession of servants quietly enter [Root.Monarch.GetName]'s room, cleaning the remains of the night before, drawing back the curtains to the balcony and gardens beyond.  His previous night's companion now gone from the bed, a feast fit for a [Root.Monarch.GetTitle] is laid before [Root.Monarch.GetName].  Once finished he emerges from his rooms into the gardens to enjoy the endless parade of servants, entertainers and members of court that make the harem their home as they roam carelessly about the garden's many fountains, pools and exotic flora while the city skyline looms beyond in the dusty [TUR.Capital.GetCapitalName] sun."
 cosmo_harem_events.6100.a:0 "[Root.Monarch.GetName] seeks out a companion for the day"
 cosmo_harem_events.6100.b:0 "[Root.Monarch.GetName] seeks out a companion for the day"
