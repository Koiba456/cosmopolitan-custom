 cosmo_harem_events.8.t:0 "[Root.CosmoNobleDaughterBritishFrench][Root.CosmoNobleDaughterSouthSlavicWestSlavic][Root.CosmoNobleDaughterGerman][Root.CosmoNobleDaughterEastSlavicCarpathianBaltic][Root.CosmoNobleDaughterIberian][Root.CosmoNobleDaughterLatinScandinavian] of house [Root.CosmoNobleDynastyBritishFrench][Root.CosmoNobleDynastySouthSlavicWestSlavic][Root.CosmoNobleDynastyGerman][Root.CosmoNobleDynastyEastSlavicCarpathianBaltic][Root.CosmoNobleDynastyIberian][Root.CosmoNobleDynastyLatinScandinavian] has been kidnapped by pirates!"
 cosmo_harem_events.8.d:0 "In a brazen and outrageous assault on our sovereignty the [Root.GetAdjective] coast was raided by Barbary pirates, among those abducted is the daughter of one of our noblemen.  The ship belonged to slavers from the Barbary Coast it is feared she will be sold into slavery.  [Root.Monarch.GetTitle] [Root.Monarch.GetName]'s son [Root.Heir.GetName] leapt into action, without the [Root.Monarch.GetTitle]'s permission he has commandeered a fast ship and is in hot pursuit."
 cosmo_harem_events.8.a:0 "That reckless fool"
 cosmo_harem_events.801.t:0 "Such Misery"
 cosmo_harem_events.801.d:0 "A message from [Root.Heir.GetName] has arrived at court.  He chased the raiders back to their lair, a lawless and wild city named Algiers. He tells us that no Christian can be found in these lands except those who are slaves.  He fears this fate has befallen the young [Root.GetAdjective] gentlewoman.  Setting an ambush, he managed to kill the party of a wealthy merchant and steal their garments.  Concealing himself and his crew as Muslim buyers he managed to infiltrate one of the slave markets where he hopes to discover what became of our lady."
 cosmo_harem_events.801.a:0 "He is where?!  Tell him to return at once."
 cosmo_harem_events.802.t:0 "No sign of the [Root.GetAdjective] Gentlewoman."
 cosmo_harem_events.802.d:0 "Having searched every Market in the city [Root.Heir.GetName] has nonetheless found no leads.  It appears the woman may have already been sold on, if he wishes to find where he will have to get some answers from a person involved in the trade."
 cosmo_harem_events.802.a:0 "Tales of his bravery are on the lips of every [Root.GetAdjective]." 
 cosmo_harem_events.803.t:0 "Dealing with the slavers"
 cosmo_harem_events.803.d:0 "[Root.Heir.GetName] has returned to us safe.  Ambushing and seizing one of the auctioneers in a back alley he managed to escape back to his ship, the city guards in hot pursuit.  During the voyage under intense questioning the man revealed that the lady had been sold off to an envoy from the Ottoman Empire, he was told she is to become a concubine in the Sultan's Imperial Harem.\nThese actions are unacceptable, [Root.GetName] must take action to stem these attacks on [Root.GetAdjective] in the future."
 cosmo_harem_events.803.a:0 "See if an arrangement can be made"
 cosmo_harem_events.803.b:0 "We will seek our revenge"
