 cosmo_harem_events.1001.t:0 "Lead on the Slavers"
 cosmo_harem_events.1001.d:0 "A message from [Root.Heir.GetName] has arrived at court.  He chased the raiders back to their the wealthy port city Jolo. He tells us that the slave market here is massive with many men and women from different nearby nationalities being auctioned as slaves.  He fears this fate has befallen the young [Root.GetAdjective] gentlewoman.  Setting an ambush, he managed to kill the party of a wealthy merchant and steal their garments.  Concealing himself and his crew as Muslim buyers he managed to infiltrate one of the slave markets where he hopes to discover what became of our lady."
 cosmo_harem_events.1001.a:0 "He is where?!  Tell him to return at once."
 cosmo_harem_events.1002.t:0 "No sign of the [Root.GetAdjective] Gentlewoman."
 cosmo_harem_events.1002.d:0 "Having searched every Market in the city [Root.Heir.GetName] has nonetheless found no leads.  It appears the woman may have already been sold on, if he wishes to find where he will have to get some answers from a person involved in the trade."
 cosmo_harem_events.1002.a:0 "Tales of his bravery are on the lips of every [Root.GetAdjective] citizen." 
 cosmo_harem_events.1003.t:0 "Dealing with the slavers"
 cosmo_harem_events.1003.d:0 "[Root.Heir.GetName] has returned to us safe.  Ambushing and seizing one of the auctioneers in a back alley he managed to escape back to his ship, the city guards in hot pursuit.  During the voyage under intense questioning the man revealed that the lady had been sold off to procurers from the Chinese Emperor, he was told she is to become a concubine in the Forbidden Palace.\nThese actions are unacceptable, [Root.GetName] must take action to stem these attacks on [Root.GetAdjective] in the future."
 cosmo_harem_events.1003.a:0 "We should make an arrangement with these slavers"
 cosmo_harem_events.1003.b:0 "We will seek our revenge"  
 cosmo_harem_events.399.t:0 "Colony Prospering"
 cosmo_harem_events.399.d:0 "A year later your decision has paid dividends."
 cosmo_harem_events.399.a:0 "The colony will survive."