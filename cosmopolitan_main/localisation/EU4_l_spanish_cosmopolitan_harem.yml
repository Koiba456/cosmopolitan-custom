 cosmo_harem_events.6301.t:0 "A Mysterious Woman"
 cosmo_harem_events.6301.d:0 "Not long after [Root.Monarch.GetName] emerges from his rooms he takes notice of a particularly mysterious and seductive.  He follows her until he finds himself alone with her in a room in a part of the harem he had not visited prior.  In private, she confides to him the tale of how she came to be a concubine and asks for his help to escape.  [Root.Monarch.GetName] is unsure of how to proceed as a guest, and even if he wanted the harem grounds are too well guarded for a daring escape.  He tells her he will do what he can if an opportunity arises in the future, and asks if for now she has a message to give to her family.  She declines the offer, but then a change takes shape in her as she begins to talk passionately about her hatred of [TUR.Monarch.GetName] and her desire to make him suffer for the many wrongs he has done to her."
 cosmo_harem_events.6301.a:0 "Ask her to spoil relations with the Sultan's ally" 
 cosmo_harem_events.6301.b:0 "Ask her to dissaude the Sultan from his plans of attack" 
 cosmo_harem_events.6301.c:0 "Sow rumors of rebellion in the hopes they will take form" 
 cosmo_harem_events.6301.7:0 "Assure her you will tell no one" 
 cosmo_harem_events.602.t:0 "A Visit to the Harem"
 cosmo_harem_events.602.d:0 "In honor of the friendship forged between the two men, the [Root.Monarch.GetTitle] has been offered the rare invitation to visit the Sultan's famed harem."
 cosmo_harem_events.602.a:0 "The [Root.Monarch.GetTitle] graciously accepts."
 cosmo_harem_events.602.b:0 "We will take no part in this heathen's debauchery." 
