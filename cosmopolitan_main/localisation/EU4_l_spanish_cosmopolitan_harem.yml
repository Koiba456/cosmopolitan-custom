 cosmo_harem_events.10.d:0 "In a brazen and outrageous assault on our sovereignty the [Root.GetAdjective] coast was attacked by Moro raiders, among those abducted is the daughter of one of our noblemen.  The men were slavers in service of the Sulu Sultanate, it is feared she will be sold to one of the region's markets and never heard from again.  [Root.Monarch.GetTitle] [Root.Monarch.GetName]'s son the [Root.Heir.GetTitle], [Root.Heir.GetName] is said to have leapt into action, without the [Root.Monarch.GetTitle]'s permission he has commandeered a small force of noblemen and is in hot pursuit."
