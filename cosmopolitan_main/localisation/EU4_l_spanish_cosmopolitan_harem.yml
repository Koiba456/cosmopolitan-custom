 cosmo_harem_events.6001.t:0 "[Root.Monarch.GetName]'s much needed vacation"
 cosmo_harem_events.6001.d:0 "[Root.Monarch.GetName] has returned from his trip in exceptional spirits.  His court can hardly recognize him, he is like a new man following his time away in the exclusive gardens and palaces of the Harem of the Ottoman Sultan [TUR.Monarch.GetName]."
