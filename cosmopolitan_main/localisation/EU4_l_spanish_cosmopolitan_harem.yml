 cosmo_harem_events.6101.t:0 "A Visit to the Harem"
 cosmo_harem_events.6101.d:0 "Not long after [Root.Monarch.GetName] retires to one of the Harem's extravagent gardens does a servant approach excorting three women, concubines of the Sultan, to accompany him for the day."
 cosmo_harem_events.6101.a:0 "Sophia" 
 cosmo_harem_events.6101.b:0 "Nadiyya" 
 cosmo_harem_events.6101.c:0 "Constantina" 
 cosmo_harem_events.6101.7:0 "Politely decline, see what else is available" 
 cosmo_harem_events.6201.t:0 "Sophia, of Hungary" 
 cosmo_harem_events.6201.d:0 "The concubine tells [Root.Monarch.GetName] that her name is Sophia, and that she comes from a good family in Hungary.  But she does not have much else to say about her former life, whether she is being elusive or not is soon irrelevant as [Root.Monarch.GetName] quickly forgets about any further probing questions into her past." 
 cosmo_harem_events.6201.a:0 "[Root.Monarch.GetName]'s concerns melt away" 
