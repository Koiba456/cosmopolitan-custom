 cosmo_harem_events.6002.t:0 "[Root.Adm_Advisor.GetName]'s much needed vacation"
 cosmo_harem_events.6002.d:0 "[Root.Adm_Advisor.GetName] has returned from his trip in exceptional spirits.  He seems eager to get back to work, and has been talking the entire way back about his plans for our future.  He appears refreshed, like a new man following his time away in the exclusive gardens and palaces of the Harem of the Ottoman Sultan [TUR.Monarch.GetName]."
