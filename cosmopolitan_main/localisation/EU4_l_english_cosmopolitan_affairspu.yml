 cosmo_asortpu_events.100.d:0 "The [From.Monarch.GetTitle] entrusted our advisor with access to the most intimate decisions affecting [From.GetName].  Through her we can ensure that the proper policies are enacted throughout the [From.GovernmentName].  A busy [From.Monarch.GetWomanMan], [From.Monarch.GetTitle] [From.Monarch.GetName] often works closely with [From.Monarch.GetHerHis] advisors late, sometimes until morning.  This is when [From.Monarch.GetSheHe] is most receptive to their advice. \n\n[From.CosmoAdmAdvisorPresent]  \n\n[From.CosmoDipAdvisorPresent]  \n\n[From.CosmoMilAdvisorPresent]"
