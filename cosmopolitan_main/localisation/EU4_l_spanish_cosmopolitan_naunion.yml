 cosmo_napu_events.61032.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon" 
 cosmo_napu_events.61032.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  The bride and others also have made it clear the great expectations that are growing about what they hope the alliance with [Root.GetName] can provide for  their nation." 
