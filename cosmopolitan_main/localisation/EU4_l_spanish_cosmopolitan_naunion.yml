 cosmo_napu_events.1301.a:0 "Embark for [honeymoonprovince.GetName]" 
 cosmo_napu_events.13031.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon" 
 cosmo_napu_events.13031.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  It is also an opportunity to introduce [Root.GetName] to key diplomats and others who will grow our trade presence and [Root.GetAdjective] knowledge of the region." 
 cosmo_napu_events.13031.a:0 "On to the next stop"  
 cosmo_napu_events.13032.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon" 
 cosmo_napu_events.13032.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  The bride and others also have made it clear the great expectations that are growing about what they hope the alliance with [Root.GetName] can provide for  their nation." 
 cosmo_napu_events.13032.a:0 "On to the next stop" 
 cosmo_napu_events.13033.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon"
 cosmo_napu_events.13033.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  [honeymoonprovince.GetName] is the final stop on the tour with the [Root.Monarch.Dynasty.GetName] benefiting from the experience and new ties in the area."   
 cosmo_napu_events.13033.a:0 "End the honeymoon" 
