 cosmo_napu_events.6201.d:0 "The [Root.GetAdjective] royal couple has embarked on their honeymoon, first stop [honeymoonprovince.GetName] in [honeymoonprovince.GetAreaName].  From there they will tour other provinces in the region.  The trip is an excellent opportunity to boost local ties to the [Root.GovernmentName] as well as for the couple to explore their new relationship." 
 cosmo_napu_events.6201.a:0 "Embark for [honeymoonprovince.GetName]" 
 cosmo_napu_events.62031.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon" 
 cosmo_napu_events.62031.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  It is also an opportunity to introduce [Root.GetName] to key diplomats and others who will grow our trade presence and [Root.GetAdjective] knowledge of the region." 
 cosmo_napu_events.62031.a:0 "On to the next stop"  
 cosmo_napu_events.62032.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon" 
 cosmo_napu_events.62032.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  The bride and others also have made it clear the great expectations that are growing about what they hope the alliance with [Root.GetName] can provide for  their nation." 
 cosmo_napu_events.62032.a:0 "On to the next stop" 
 cosmo_napu_events.62033.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon"
 cosmo_napu_events.62033.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  [honeymoonprovince.GetName] is the final stop on the tour with the [Root.Monarch.Dynasty.GetName] benefiting from the experience and new ties in the area."   
 cosmo_napu_events.62033.a:0 "End the honeymoon" 
