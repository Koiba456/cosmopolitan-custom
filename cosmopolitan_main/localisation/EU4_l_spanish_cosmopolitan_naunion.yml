 cosmo_napu_events.11041.d:0 "The [Root.GetAdjective] royal couple has arrived in [honeymoonprovince.GetName] in [honeymoonprovince.GetAreaName].  The trip is an excellent opportunity to boost local ties to the [Root.GovernmentName] as well as for the couple to explore their new relationship."
