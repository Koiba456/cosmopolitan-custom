 cosmo_napu_events.23013.8:0 "Cancel the aid" 
 cosmo_napu_events.23132.t:0 "The [personalunion.GetAdjective] army arrives in [personalunion.Capital.GetCapitalName]" 
 cosmo_napu_events.23132.d:0 "The [personalunion.GetAdjective] army has arrived in [personalunion.Capital.GetCapitalName] to celebrations throughout the capital.  [personalunion.Monarch.GetTitle] [personalunion.Monarch.GetName] marked the occassion promising that together with their [Root.GetAdjective] allies this new mighty [personalunion.GetAdjective] army will crush their enemies and protect [personalunion.GetName] and its people." 
 cosmo_napu_events.23132.a:0 "[personalunion.GetName] has their new army" 
 cosmo_napu_events.23133.t:0 "The [Root.GetAdjective] ships arrives in [personalunion.Capital.GetCapitalName]" 
 cosmo_napu_events.23133.d:0 "The [Root.GetAdjective] ships have arrived in [personalunion.GetAdjective] waters, and with it we have completed our promise of aid to [personalunion.Capital.GetCapitalName].  [personalunion.Monarch.GetTitle] [personalunion.Monarch.GetName] marked the occassion promising that together with their [Root.GetAdjective] allies this new mighty [personalunion.GetAdjective] ship will crush their enemies and protect [personalunion.GetAdjective] shores and its people as well as enable [personalunion.Monarch.GetHerHis] people to venture out into the world's vast oceans." 
 cosmo_napu_events.23133.a:0 "[Root.GetAdjective] ships are in demand"  
 cosmo_napu_events.23014.t:0 "Rebels spotted in [personalunion.GetAdjective] territory"
 cosmo_napu_events.23014.d:0 "It would appear that not everyone in [personalunion.GetName] appreciates our friends in the capital of [personalunion.Capital.GetCapitalName].  A rebel army is currently wreaking havoc in the countryside and even threatens [personalunion.GetAdjective] cities.  If not dealt with soon it could undermine the [personalunion.Monarch.GetTitle]'s rule and with it the partnership between our two nations."
 cosmo_napu_events.23014.a:0 "Our ally [personalunion.Monarch.GetTitle] [personalunion.Monarch.GetName] must rule [personalunion.GetName]"
 cosmo_napu_events.2316.t:0 "The [personalunion.Culture.GetName] are united"
 cosmo_napu_events.2316.d:0 "[Root.GetName] and [personalunion.GetName] have united the homeland and strongholds of the [personalunion.Culture.GetName] people.  Hopefully this will put to rest rumors and insinuations that [personalunion.Monarch.GetTitle] [personalunion.Monarch.GetName] is mere pretenders and puppet.  Having delivered on the promises they made their people when assuming the throne in [personalunion.Capital.GetCapitalName] they have shown the value of [personalunion.GetName]'s alliance with [Root.GetName], and both the [personalunion.Monarch.GetTitle] and people are grateful."
 cosmo_napu_events.2316.a:0 "Good for our friend, [personalunion.Monarch.GetTitle] [personalunion.Monarch.GetName]"   
 cosmo_napu_events.23019.t:0 "[Root.GetName]'s [personalunion.GetAdjective] Queen"
 cosmo_napu_events.23019.d:0 "Now that [Root.Monarch.GetName] has assumed the throne, [Root.Monarch.GetHerHis] [personalunion.GetAdjective] wife has become [Root.GetName]'s queen.  In [Root.Capital.GetCapitalName] the [Root.GetAdjective] people are entranced by their new exotic queen."
 cosmo_napu_events.23019.a:0 "A new queen assumes the throne" 
 cosmo_napu_events.310.t:0 "Freedom from [palacecountry.GetName]'s tyranny" 
 cosmo_napu_events.310.d:0 "[palacecountry.Monarch.GetTitle] [palacecountry.Monarch.GetName] is a leech upon the good people of the region.  Not only does [palacecountry.Monarch.GetSheHe] demand tribute from his subjects and other nations, but he also takes from them their unwed daughters to be cruelly wed to the syphilis ridden lecher.  No longer must such a dark fate hang over her people.  A [Root.Monarch.GetWomanMan], more like a mythical hero from ancient legend has not only rescued her from the wretched [palacecountry.Monarch.GetTitle]'s clutches but others as well, and [palacecountry.Monarch.GetSheHe] is this very moment leading a rebellion of all the [palacecountry.Culture.GetGroupName] who can no longer live under the [palacecountry.GovernmentName.GetName]'s heavy yoke.  The [Root.GetAdjective] [Root.Monarch.GetTitle], [Root.Monarch.GetName] is the [Root.Monarch.GetWomanMan] who has selflessly stepped forward to help free her people.  This is the story she will tell to every person who will give her an audience." 
 cosmo_napu_events.310.a:0 "Rally the people to the flag of Mahican" 
 cosmo_napu_events.310.c:0 "Rally the people to the flag of Huai" 
 cosmo_napu_events.310.8:0 "Cancel the plan" 
 cosmo_napu_events.3113.t:0 "Unify China" 
 cosmo_napu_events.31001.t:0 "The nation of Mahican" 
 cosmo_napu_events.31001.d:0 "A dignitary from the recently captured city of [asiapuprovince.GetCapitalName] in [asiapuprovince.GetName] has arrived at the [Root.GetAdjective] capital [Root.Capital.GetCapitalName].  He claims that he and his people owe no allegiance to [asiapuprovince.Owner.Monarch.GetTitle] [asiapuprovince.Owner.Monarch.GetName] or [asiapuprovince.Owner.GetName].  His people are oppressed under [asiapuprovince.Owner.GetAdjective] rule and seek independence from the [asiapuprovince.Owner.GovernmentName].\nHaving heard of the [Root.Monarch.Dynasty.GetName]'s voracious appetite for beautiful women the dignitary also made sure that [Root.Monarch.GetTitle] [Root.Monarch.GetName] and the rest of the royal family had a good view of the beautiful woman accompanying him. Using his connections throughout [asiapuprovince.GetAreaName] he says he will help to quell any further resistance to [Root.GetAdjective] occupation and assemble a great army to assist in our war against the hated [asiapuprovince.Owner.GetAdjective].  In exchange he simply wishes to see his beloved daughter married, and the throne in [asiapuprovince.GetCapitalName] he claims was stolen from his family.  If the [Root.Monarch.GetTitle] agrees he says [Root.GetName] will forever have a loyal ally." 
 cosmo_napu_events.31001.a:0 "Wed [Root.Monarch.GetTitle] [Root.Monarch.GetName]" 
 cosmo_napu_events.31001.b:0 "Wed [Root.Heir.GetTitle] [Root.Heir.GetName]" 
 cosmo_napu_events.31001.c:0 "Wed the [Root.Monarch.GetTitle]'s [Root.CosmoUncleSon]" 
 cosmo_napu_events.31001.7:0 "Reject their proposal" 
 cosmo_napu_events.31098.t:0 "The Royal Marriage" 
 cosmo_napu_events.3103.t:0 "Secure a union with [proposalcountry.GetName]" 
 cosmo_napu_events.3103.d:0 "Along with arranging the marriage, [Root.GetName] seeks to offer an alliance to [proposalcountry.GetName] in which [Root.GetName] offers its protection to the weaker country. They will provide a suitable match for the [Root.Dynasty.GetName] dynasty, and the [Root.Monarch.GetTitle] will decide whether to accept their offer or not.  If all goes well [proposalcountry.GetName] could be a key regional ally for [Root.GetName]." 
 cosmo_napu_events.3103.a:0 "Wed [Root.Monarch.GetTitle] [Root.Monarch.GetName]" 
 cosmo_napu_events.3103.b:0 "Wed [Root.Heir.GetTitle] [Root.Heir.GetName]" 
