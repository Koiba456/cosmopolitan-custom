 cosmo_napu_events.52098.t:0 "The Royal Marriage" 
 cosmo_napu_events.5203.t:0 "Secure a union with [proposalcountry.GetName]" 
 cosmo_napu_events.5203.d:0 "Along with arranging the marriage, [Root.GetName] seeks to offer an alliance to [proposalcountry.GetName] in which [Root.GetName] offers its protection to the weaker country. They will provide a suitable match for the [Root.Dynasty.GetName] dynasty, and the [Root.Monarch.GetTitle] will decide whether to accept their offer or not.  If all goes well [proposalcountry.GetName] could be a key regional ally for [Root.GetName]." 
 cosmo_napu_events.5203.a:0 "Wed [Root.Monarch.GetTitle] [Root.Monarch.GetName]" 
