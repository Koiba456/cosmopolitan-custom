 cosmo_napu_events.71001.d:0 "A dignitary from the recently captured city of [asiapuprovince.GetCapitalName] in [asiapuprovince.GetName] has arrived at the [Root.GetAdjective] capital [Root.Capital.GetCapitalName].  He claims that he and his people owe no allegiance to [asiapuprovince.Owner.Monarch.GetTitle] [asiapuprovince.Owner.Monarch.GetName] or [asiapuprovince.Owner.GetName].  His people are oppressed under [asiapuprovince.Owner.GetAdjective] rule and seek independence from the [asiapuprovince.Owner.GovernmentName].\nHaving heard of the [Root.Monarch.Dynasty.GetName]'s voracious appetite for beautiful women the dignitary also made sure that [Root.Monarch.GetTitle] [Root.Monarch.GetName] and the rest of the royal family had a good view of the beautiful woman accompanying him. Using his connections throughout [asiapuprovince.GetAreaName] he says he will help to quell any further resistance to [Root.GetAdjective] occupation and assemble a great army to assist in our war against the hated [asiapuprovince.Owner.GetAdjective].  In exchange he simply wishes to see his beloved daughter married, and the throne in [asiapuprovince.GetCapitalName] he claims was stolen from his family.  If the [Root.Monarch.GetTitle] agrees he says [Root.GetName] will forever have a loyal ally." 
 cosmo_napu_events.71001.a:0 "Wed [Root.Monarch.GetTitle] [Root.Monarch.GetName]" 
 cosmo_napu_events.71001.b:0 "Wed [Root.Heir.GetTitle] [Root.Heir.GetName]" 
 cosmo_napu_events.71001.c:0 "Wed the [Root.Monarch.GetTitle]'s [Root.CosmoUncleSon]" 
 cosmo_napu_events.71001.7:0 "Reject their proposal" 
 cosmo_napu_events.71098.t:0 "The Royal Marriage" 
 cosmo_napu_events.7103.t:0 "Secure a union with [proposalcountry.GetName]" 
 cosmo_napu_events.7103.d:0 "Along with arranging the marriage, [Root.GetName] seeks to offer an alliance to [proposalcountry.GetName] in which [Root.GetName] offers its protection to the weaker country. They will provide a suitable match for the [Root.Dynasty.GetName] dynasty, and the [Root.Monarch.GetTitle] will decide whether to accept their offer or not.  If all goes well [proposalcountry.GetName] could be a key regional ally for [Root.GetName]." 
 cosmo_napu_events.7103.a:0 "Wed [Root.Monarch.GetTitle] [Root.Monarch.GetName]" 
 cosmo_napu_events.7103.b:0 "Wed [Root.Heir.GetTitle] [Root.Heir.GetName]" 
 cosmo_napu_events.7103.c:0 "Wed the [Root.Monarch.GetTitle]'s [Root.CosmoUncleSon]" 
 cosmo_napu_events.7103.7:0 "Call off the marriage" 
 cosmo_napu_events.7101.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon" 
 cosmo_napu_events.7101.d:0 "The [Root.GetAdjective] royal couple has embarked on their honeymoon, first stop [honeymoonprovince.GetName] in [honeymoonprovince.GetAreaName].  From there they will tour other provinces in the region.  The trip is an excellent opportunity to boost local ties to the [Root.GovernmentName] as well as for the couple to explore their new relationship." 
 cosmo_napu_events.7101.a:0 "Embark for [honeymoonprovince.GetName]" 
 cosmo_napu_events.7101.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon" 
 cosmo_napu_events.7101.d:0 "The [Root.GetAdjective] royal couple has embarked on their honeymoon, first stop [honeymoonprovince.GetName] in [honeymoonprovince.GetAreaName].  From there they will tour other provinces in the region.  The trip is an excellent opportunity to boost local ties to the [Root.GovernmentName] as well as for the couple to explore their new relationship." 
 cosmo_napu_events.7101.a:0 "Embark for [honeymoonprovince.GetName]" 
 cosmo_napu_events.71031.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon" 
 cosmo_napu_events.71031.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  It is also an opportunity to introduce [Root.GetName] to key diplomats and others who will grow our trade presence and [Root.GetAdjective] knowledge of the region." 
 cosmo_napu_events.71031.a:0 "On to the next stop"  
 cosmo_napu_events.71032.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon" 
 cosmo_napu_events.71032.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  The bride and others also have made it clear the great expectations that are growing about what they hope the alliance with [Root.GetName] can provide for  their nation." 
 cosmo_napu_events.71032.a:0 "On to the next stop" 
 cosmo_napu_events.71033.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon"
 cosmo_napu_events.71033.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  [honeymoonprovince.GetName] is the final stop on the tour with the [Root.Monarch.Dynasty.GetName] benefiting from the experience and new ties in the area."   
 cosmo_napu_events.71033.a:0 "End the honeymoon" 
