 cosmo_napu_events.1306.t:0 "Economic aid to [personalunion.GetName]" 
 cosmo_napu_events.1306.d:0 "The [Root.GetAdjective] [Root.GovernmentName] has proposed send an economic aid mission to our good friends in [personalunion.GetName].  While some in the country may question the sincerity of their new powerful allies, our friends in [personalunion.Capital.GetCapitalName] are eager to share in the benefits of their new friendship.  There is much we can do to improve the [personalunion.GetAdjective] capital." 
 cosmo_napu_events.1306.a:0 "Send the [Root.Monarch.GetTitle]'s advisor, [Root.Adm_Advisor.GetName] to boost their administration" 
 cosmo_napu_events.1306.b:0 "Send the [Root.Monarch.GetTitle]'s advisor, [Root.Dip_Advisor.GetName] to aid their diplomacy" 
 cosmo_napu_events.1306.c:0 "Organize a trade mission to bring [Root.GetAdjective] goods to [personalunion.GetName]" 
 cosmo_napu_events.1306.7:0 "Cancel the aid" 
 cosmo_napu_events.1360.t:0 "Trade goods to be sent to [personalunion.GetName]" 
 cosmo_napu_events.1360.d:0 "The [Root.GetAdjective] [Root.GovernmentName] has many luxurious and exotic goods that are rare or entirely non existent in [personalunion.GetAdjective] markets.  Organizing a fleet to show the abundance and prosperity of [Root.GetName] will surely demonstrate to the locals and merchants the value of our partnership in trade.  Both [Root.GetName] and [personalunion.GetName] stand to profit from the exchange." 
 cosmo_napu_events.1360.a:0 "Choose an export"  
 cosmo_napu_events.13061.t:0 "Trade ships arrive in [personalunion.GetName]" 
 cosmo_napu_events.13061.d:0 "The [Root.GetAdjective] ships have arrived to the coasts of [personalunion.GetName] and unloaded their goods.  The port immediately is swamped by [personalunion.GetAdjective] eager to get a piece of the new [Root.GetAdjective] goods.  While [Root.GetName] will still profit from the venture, the real value is in the lasting trade ties and reputation our merchants will carry in the region having provided exotic and rare items of a quality not often found in [personalunion.GetAdjective] markets." 
 cosmo_napu_events.13061.a:0 "[Root.GetAdjective] goods are in demand" 
 cosmo_napu_events.13013.t:0 "Military aid to [personalunion.GetName]" 
 cosmo_napu_events.13013.d:0 "The [Root.GetAdjective] military is the envy of the world.  To offer our assistance to [personalunion.GetName] in training and equipping their armies to the standards of [Root.GetName] herself shows the depth of our commitment to this alliance.  We will transform their forces into the equals of [Root.GetAdjective] legends.  The [personalunion.GetAdjective] [personalunion.Monarch.GetTitle] will pay handsomely in exchange for our advice as the future of [personalunion.Capital.GetCapitalName] depends largely on [Root.GetAdjective] military support." 
 cosmo_napu_events.13013.a:0 "Send the [Root.Monarch.GetTitle]'s advisor, [Root.Mil_Advisor.GetName] to oversee their forces" 
 cosmo_napu_events.13013.b:0 "Fortify the capital, [personalunion.Capital.GetCapitalName]" 
 cosmo_napu_events.13013.c:0 "Train the [personalunion.GetAdjective] army" 
