 cosmo_napu_events.4106.t:0 "Economic aid to [personalunion.GetName]" 
 cosmo_napu_events.4106.d:0 "The [Root.GetAdjective] [Root.GovernmentName] has proposed send an economic aid mission to our good friends in [personalunion.GetName].  While some in the country may question the sincerity of their new powerful allies, our friends in [personalunion.Capital.GetCapitalName] are eager to share in the benefits of their new friendship.  There is much we can do to improve the [personalunion.GetAdjective] capital." 
 cosmo_napu_events.4106.a:0 "Send the [Root.Monarch.GetTitle]'s advisor, [Root.Adm_Advisor.GetName] to boost their administration" 
 cosmo_napu_events.4106.b:0 "Send the [Root.Monarch.GetTitle]'s advisor, [Root.Dip_Advisor.GetName] to aid their diplomacy" 
 cosmo_napu_events.4106.c:0 "Organize a trade mission to bring [Root.GetAdjective] goods to [personalunion.GetName]" 
 cosmo_napu_events.4106.7:0 "Cancel the aid" 
 cosmo_napu_events.4160.t:0 "Trade goods to be sent to [personalunion.GetName]" 
 cosmo_napu_events.4160.d:0 "The [Root.GetAdjective] [Root.GovernmentName] has many luxurious and exotic goods that are rare or entirely non existent in [personalunion.GetAdjective] markets.  Organizing a fleet to show the abundance and prosperity of [Root.GetName] will surely demonstrate to the locals and merchants the value of our partnership in trade.  Both [Root.GetName] and [personalunion.GetName] stand to profit from the exchange." 
 cosmo_napu_events.4160.a:0 "Choose an export"  
 cosmo_napu_events.41061.t:0 "Trade ships arrive in [personalunion.GetName]" 
 cosmo_napu_events.41061.d:0 "The [Root.GetAdjective] ships have arrived to the coasts of [personalunion.GetName] and unloaded their goods.  The port immediately is swamped by [personalunion.GetAdjective] eager to get a piece of the new [Root.GetAdjective] goods.  While [Root.GetName] will still profit from the venture, the real value is in the lasting trade ties and reputation our merchants will carry in the region having provided exotic and rare items of a quality not often found in [personalunion.GetAdjective] markets." 
 cosmo_napu_events.41061.a:0 "[Root.GetAdjective] goods are in demand" 
 cosmo_napu_events.41013.t:0 "Military aid to [personalunion.GetName]" 
 cosmo_napu_events.41013.d:0 "The [Root.GetAdjective] military is the envy of the world.  To offer our assistance to [personalunion.GetName] in training and equipping their armies to the standards of [Root.GetName] herself shows the depth of our commitment to this alliance.  We will transform their forces into the equals of [Root.GetAdjective] legends.  The [personalunion.GetAdjective] [personalunion.Monarch.GetTitle] will pay handsomely in exchange for our advice as the future of [personalunion.Capital.GetCapitalName] depends largely on [Root.GetAdjective] military support." 
 cosmo_napu_events.41013.a:0 "Send the [Root.Monarch.GetTitle]'s advisor, [Root.Mil_Advisor.GetName] to oversee their forces" 
 cosmo_napu_events.41013.b:0 "Fortify the capital, [personalunion.Capital.GetCapitalName]" 
 cosmo_napu_events.41013.c:0 "Train the [personalunion.GetAdjective] army" 
 cosmo_napu_events.41013.7:0 "Build ships for the [personalunion.GetAdjective] navy" 
 cosmo_napu_events.41013.8:0 "Cancel the aid" 
 cosmo_napu_events.41132.t:0 "The [personalunion.GetAdjective] army arrives in [personalunion.Capital.GetCapitalName]" 
 cosmo_napu_events.41132.d:0 "The [personalunion.GetAdjective] army has arrived in [personalunion.Capital.GetCapitalName] to celebrations throughout the capital.  [personalunion.Monarch.GetTitle] [personalunion.Monarch.GetName] marked the occassion promising that together with their [Root.GetAdjective] allies this new mighty [personalunion.GetAdjective] army will crush their enemies and protect [personalunion.GetName] and its people." 
 cosmo_napu_events.41132.a:0 "[personalunion.GetName] has their new army" 
 cosmo_napu_events.41133.t:0 "The [Root.GetAdjective] ships arrives in [personalunion.Capital.GetCapitalName]" 
 cosmo_napu_events.41133.d:0 "The [Root.GetAdjective] ships have arrived in [personalunion.GetAdjective] waters, and with it we have completed our promise of aid to [personalunion.Capital.GetCapitalName].  [personalunion.Monarch.GetTitle] [personalunion.Monarch.GetName] marked the occassion promising that together with their [Root.GetAdjective] allies this new mighty [personalunion.GetAdjective] ship will crush their enemies and protect [personalunion.GetAdjective] shores and its people as well as enable [personalunion.Monarch.GetHerHis] people to venture out into the world's vast oceans." 
 cosmo_napu_events.41133.a:0 "[Root.GetAdjective] ships are in demand"  
 cosmo_napu_events.41014.t:0 "Rebels spotted in [personalunion.GetAdjective] territory"
 cosmo_napu_events.41014.d:0 "It would appear that not everyone in [personalunion.GetName] appreciates our friends in the capital of [personalunion.Capital.GetCapitalName].  A rebel army is currently wreaking havoc in the countryside and even threatens [personalunion.GetAdjective] cities.  If not dealt with soon it could undermine the [personalunion.Monarch.GetTitle]'s rule and with it the partnership between our two nations."
 cosmo_napu_events.41014.a:0 "Our ally [personalunion.Monarch.GetTitle] [personalunion.Monarch.GetName] must rule [personalunion.GetName]"
 cosmo_napu_events.4116.t:0 "The [personalunion.Culture.GetName] are united"
 cosmo_napu_events.4116.d:0 "[Root.GetName] and [personalunion.GetName] have united the homeland and strongholds of the [personalunion.Culture.GetName] people.  Hopefully this will put to rest rumors and insinuations that [personalunion.Monarch.GetTitle] [personalunion.Monarch.GetName] is mere pretenders and puppet.  Having delivered on the promises they made their people when assuming the throne in [personalunion.Capital.GetCapitalName] they have shown the value of [personalunion.GetName]'s alliance with [Root.GetName], and both the [personalunion.Monarch.GetTitle] and people are grateful."
 cosmo_napu_events.4116.a:0 "Good for our friend, [personalunion.Monarch.GetTitle] [personalunion.Monarch.GetName]"   
 cosmo_napu_events.41019.t:0 "[Root.GetName]'s [personalunion.GetAdjective] Queen"
 cosmo_napu_events.41019.d:0 "Now that [Root.Monarch.GetName] has assumed the throne, [Root.Monarch.GetHerHis] [personalunion.GetAdjective] wife has become [Root.GetName]'s queen.  In [Root.Capital.GetCapitalName] the [Root.GetAdjective] people are entranced by their new exotic queen."
 cosmo_napu_events.41019.a:0 "A new queen assumes the throne"
 cosmo_napu_events.420.t:0 "Freedom from [palacecountry.GetName]'s tyranny" 
 cosmo_napu_events.420.d:0 "[palacecountry.Monarch.GetTitle] [palacecountry.Monarch.GetName] is a leech upon the good people of the region.  Not only does [palacecountry.Monarch.GetSheHe] demand tribute from his subjects and other nations, but he also takes from them their unwed daughters to be cruelly wed to the syphilis ridden lecher.  No longer must such a dark fate hang over her people.  A [Root.Monarch.GetWomanMan], more like a mythical hero from ancient legend has not only rescued her from the wretched [palacecountry.Monarch.GetTitle]'s clutches but others as well, and [palacecountry.Monarch.GetSheHe] is this very moment leading a rebellion of all the [palacecountry.Culture.GetGroupName] who can no longer live under the [palacecountry.GovernmentName.GetName]'s heavy yoke.  The [Root.GetAdjective] [Root.Monarch.GetTitle], [Root.Monarch.GetName] is the [Root.Monarch.GetWomanMan] who has selflessly stepped forward to help free her people.  This is the story she will tell to every person who will give her an audience." 
 cosmo_napu_events.420.a:0 "Rally the people to the flag of Miami" 
 cosmo_napu_events.420.b:0 "Rally the people to the flag of Chahar" 
 cosmo_napu_events.420.c:0 "Rally the people to the flag of Kara Del" 
 cosmo_napu_events.420.8:0 "Cancel the plan" 
 cosmo_napu_events.4213.t:0 "Unify China" 
