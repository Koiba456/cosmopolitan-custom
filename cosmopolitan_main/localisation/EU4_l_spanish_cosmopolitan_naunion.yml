 cosmo_napu_events.4216.d:0 "[Root.GetName] and [personalunion.GetName] have united the homeland and strongholds of the [personalunion.Culture.GetName] people.  Hopefully this will put to rest rumors and insinuations that [personalunion.Monarch.GetTitle] [personalunion.Monarch.GetName] is mere pretenders and puppet.  Having delivered on the promises they made their people when assuming the throne in [personalunion.Capital.GetCapitalName] they have shown the value of [personalunion.GetName]'s alliance with [Root.GetName], and both the [personalunion.Monarch.GetTitle] and people are grateful."
 cosmo_napu_events.4216.a:0 "Good for our friend, [personalunion.Monarch.GetTitle] [personalunion.Monarch.GetName]"   
 cosmo_napu_events.42019.t:0 "[Root.GetName]'s [personalunion.GetAdjective] Queen"
 cosmo_napu_events.42019.d:0 "Now that [Root.Monarch.GetName] has assumed the throne, [Root.Monarch.GetHerHis] [personalunion.GetAdjective] wife has become [Root.GetName]'s queen.  In [Root.Capital.GetCapitalName] the [Root.GetAdjective] people are entranced by their new exotic queen."
 cosmo_napu_events.42019.a:0 "A new queen assumes the throne" 
 cosmo_napu_events.430.t:0 "Freedom from [palacecountry.GetName]'s tyranny" 
 cosmo_napu_events.430.d:0 "[palacecountry.Monarch.GetTitle] [palacecountry.Monarch.GetName] is a leech upon the good people of the region.  Not only does [palacecountry.Monarch.GetSheHe] demand tribute from his subjects and other nations, but he also takes from them their unwed daughters to be cruelly wed to the syphilis ridden lecher.  No longer must such a dark fate hang over her people.  A [Root.Monarch.GetWomanMan], more like a mythical hero from ancient legend has not only rescued her from the wretched [palacecountry.Monarch.GetTitle]'s clutches but others as well, and [palacecountry.Monarch.GetSheHe] is this very moment leading a rebellion of all the [palacecountry.Culture.GetGroupName] who can no longer live under the [palacecountry.GovernmentName.GetName]'s heavy yoke.  The [Root.GetAdjective] [Root.Monarch.GetTitle], [Root.Monarch.GetName] is the [Root.Monarch.GetWomanMan] who has selflessly stepped forward to help free her people.  This is the story she will tell to every person who will give her an audience." 
 cosmo_napu_events.430.a:0 "Rally the people to the flag of Shawnee" 
 cosmo_napu_events.430.8:0 "Cancel the plan" 
 cosmo_napu_events.4313.t:0 "Unify China" 
 cosmo_napu_events.43001.t:0 "The nation of Shawnee" 
 cosmo_napu_events.43001.d:0 "A dignitary from the recently captured city of [asiapuprovince.GetCapitalName] in [asiapuprovince.GetName] has arrived at the [Root.GetAdjective] capital [Root.Capital.GetCapitalName].  He claims that he and his people owe no allegiance to [asiapuprovince.Owner.Monarch.GetTitle] [asiapuprovince.Owner.Monarch.GetName] or [asiapuprovince.Owner.GetName].  His people are oppressed under [asiapuprovince.Owner.GetAdjective] rule and seek independence from the [asiapuprovince.Owner.GovernmentName].\nHaving heard of the [Root.Monarch.Dynasty.GetName]'s voracious appetite for beautiful women the dignitary also made sure that [Root.Monarch.GetTitle] [Root.Monarch.GetName] and the rest of the royal family had a good view of the beautiful woman accompanying him. Using his connections throughout [asiapuprovince.GetAreaName] he says he will help to quell any further resistance to [Root.GetAdjective] occupation and assemble a great army to assist in our war against the hated [asiapuprovince.Owner.GetAdjective].  In exchange he simply wishes to see his beloved daughter married, and the throne in [asiapuprovince.GetCapitalName] he claims was stolen from his family.  If the [Root.Monarch.GetTitle] agrees he says [Root.GetName] will forever have a loyal ally." 
 cosmo_napu_events.43001.a:0 "Wed [Root.Monarch.GetTitle] [Root.Monarch.GetName]" 
 cosmo_napu_events.43001.b:0 "Wed [Root.Heir.GetTitle] [Root.Heir.GetName]" 
 cosmo_napu_events.43001.c:0 "Wed the [Root.Monarch.GetTitle]'s [Root.CosmoUncleSon]" 
 cosmo_napu_events.43001.7:0 "Reject their proposal" 
 cosmo_napu_events.43098.t:0 "The Royal Marriage" 
 cosmo_napu_events.4303.t:0 "Secure a union with [proposalcountry.GetName]" 
 cosmo_napu_events.4303.d:0 "Along with arranging the marriage, [Root.GetName] seeks to offer an alliance to [proposalcountry.GetName] in which [Root.GetName] offers its protection to the weaker country. They will provide a suitable match for the [Root.Dynasty.GetName] dynasty, and the [Root.Monarch.GetTitle] will decide whether to accept their offer or not.  If all goes well [proposalcountry.GetName] could be a key regional ally for [Root.GetName]." 
 cosmo_napu_events.4303.a:0 "Wed [Root.Monarch.GetTitle] [Root.Monarch.GetName]" 
 cosmo_napu_events.4303.b:0 "Wed [Root.Heir.GetTitle] [Root.Heir.GetName]" 
 cosmo_napu_events.4303.c:0 "Wed the [Root.Monarch.GetTitle]'s [Root.CosmoUncleSon]" 
 cosmo_napu_events.4303.7:0 "Call off the marriage" 
 cosmo_napu_events.4301.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon" 
 cosmo_napu_events.4301.d:0 "The [Root.GetAdjective] royal couple has embarked on their honeymoon, first stop [honeymoonprovince.GetName] in [honeymoonprovince.GetAreaName].  From there they will tour other provinces in the region.  The trip is an excellent opportunity to boost local ties to the [Root.GovernmentName] as well as for the couple to explore their new relationship." 
 cosmo_napu_events.4301.a:0 "Embark for [honeymoonprovince.GetName]" 
 cosmo_napu_events.4301.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon" 
 cosmo_napu_events.4301.d:0 "The [Root.GetAdjective] royal couple has embarked on their honeymoon, first stop [honeymoonprovince.GetName] in [honeymoonprovince.GetAreaName].  From there they will tour other provinces in the region.  The trip is an excellent opportunity to boost local ties to the [Root.GovernmentName] as well as for the couple to explore their new relationship." 
 cosmo_napu_events.4301.a:0 "Embark for [honeymoonprovince.GetName]" 
 cosmo_napu_events.43031.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon" 
 cosmo_napu_events.43031.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  It is also an opportunity to introduce [Root.GetName] to key diplomats and others who will grow our trade presence and [Root.GetAdjective] knowledge of the region." 
 cosmo_napu_events.43031.a:0 "On to the next stop"  
 cosmo_napu_events.43032.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon" 
 cosmo_napu_events.43032.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  The bride and others also have made it clear the great expectations that are growing about what they hope the alliance with [Root.GetName] can provide for  their nation." 
 cosmo_napu_events.43032.a:0 "On to the next stop" 
 cosmo_napu_events.43033.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon"
 cosmo_napu_events.43033.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  [honeymoonprovince.GetName] is the final stop on the tour with the [Root.Monarch.Dynasty.GetName] benefiting from the experience and new ties in the area."   
 cosmo_napu_events.43033.a:0 "End the honeymoon" 
