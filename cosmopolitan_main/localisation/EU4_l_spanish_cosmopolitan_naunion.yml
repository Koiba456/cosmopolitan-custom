 cosmo_napu_events.22031.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon" 
 cosmo_napu_events.22031.d:0 "Arriving in [honeymoonprovince.GetName] the couple is busy being entertained by local nobility in celebration of the new marriage.  It is also an opportunity to introduce [Root.GetName] to key diplomats and others who will grow our trade presence and [Root.GetAdjective] knowledge of the region." 
 cosmo_napu_events.22031.a:0 "On to the next stop"  
