l_spanish:
 cosmo_chinamarriage_events.3.t:0 "A Royal Proposal"
 cosmo_chinamarriage_events.3.d:0 "[proposalcountry.GetName] appears to be agreeable to the union between our two great countries.  They will provide a suitable match from the [proposalcountry.Monarch.Dynasty.GetName] dynasty, and the [Root.Monarch.GetTitle] will decide whether to accept their offer or not.  If all goes well this could be the beginning of closer ties between [Root.GetName] and [proposalcountry.GetName]."
 cosmo_chinamarriage_events.3.a:0 "Seek a marriage for [Root.Monarch.GetTitle] [Root.Monarch.GetName]"
 cosmo_chinamarriage_events.3.b:0 "Seek a marriage for [Root.Heir.GetTitle] [Root.Heir.GetName]"
 cosmo_chinamarriage_events.3.c:0 "Offer [Root.GetName]'s protection along with the union"
 cosmo_chinamarriage_events.3.7:0 "They would not accept [Root.GetName]'s protection along with the union"
 cosmo_chinamarriage_events.20.t:0 "Choose honeymoon location"
 cosmo_chinamarriage_events.30.t:0 "Choose honeymoon location" 
 cosmo_chinamarriage_events.30.d:0 " "  
 cosmo_chinamarriage_events.30.a:0 "Europe"  
 cosmo_chinamarriage_events.30.b:0 "Africa"  
 cosmo_chinamarriage_events.30.c:0 "Asia"  
 cosmo_chinamarriage_events.30.7:0 "The Americas"  
 cosmo_chinamarriage_events.301.t:0 "A Royal Proposal"
 cosmo_chinamarriage_events.30101.t:0 "The [From.Monarch.GetTitle]'s daughter"
 cosmo_chinamarriage_events.30101.d:0 "[From.Monarch.GetTitle] [From.Monarch.GetName] has offered the hand of a member of the [From.GetAdjective] royal family in marriage to [Root.GetName].   Newly arrived in [Root.Capital.GetCapitalName] the [From.GetAdjective] princess has made quite the impression on her would-be betrothed."
 cosmo_chinamarriage_events.30101.a:0 "Accept the Marriage proposal"
 cosmo_chinamarriage_events.30101.b:0 "Accept the Marriage proposal"
 cosmo_chinamarriage_events.30101.c:0 "Decline the match" 
 cosmo_chinamarriage_events.30901.t:0 "A Royal Proposal"
 cosmo_chinamarriage_events.30801.t:0 "A new Queen assumes the throne"
 cosmo_chinamarriage_events.30801.d:0 "[Root.GetName]'s new [From.Culture.GetName] queen has taken her place on the throne beside [Root.Monarch.GetTitle] [Root.Monarch.GetName].  We will see if [Root.GetName] will come to accept her as one of their own or if the new queen from [From.GetName]'s origins may be a point of division for the people or our relations with other countries.  For now all of [Root.Capital.GetCapitalName] rejoices at the sight of their beautiful new queen.  The new couple will be eager to tour the [Root.GovernmentName] in celebration of their long awaited assuming the throne."
 cosmo_chinamarriage_events.30801.a:0 "Start the honeymoon"
 cosmo_chinamarriage_events.30801.b:0 "Postpone the honeymoon"
 cosmo_chinamarriage_events.101.t:0 "Celebrating [Root.Monarch.GetTitle] [Root.Monarch.GetName]'s new marriage"
 cosmo_chinamarriage_events.101.d:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] has gotten married, and [Root.Monarch.GetHerHis] new wife is eager to spend some time alone together.  All of [Root.GetName] would be honored to receive the royal couple, wherever they visit they are certain to mobilize the entire province to make a good impression."
 cosmo_chinamarriage_events.101.a:0 "Start the honeymoon"
 cosmo_chinamarriage_events.101.b:0 "Postpone the honeymoon"
 cosmo_chinamarriage_events.107.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon"
 cosmo_chinamarriage_events.107.d:0 "The [Root.GetAdjective] royal couple has embarked on their honeymoon, first stop [honeymoonprovince.GetName] in [honeymoonprovince.GetAreaName].  From there they will tour other provinces in the region.  The trip is an excellent opportunity to boost local ties to the [Root.GovernmentName] as well as for the couple to explore their new relationship."
 cosmo_chinamarriage_events.107.a:0 "Embark for [honeymoonprovince.GetName]"
 cosmo_chinamarriage_events.1001.t:0 "The [Root.Monarch.Dynasty.GetName] Honeymoon"
 cosmo_chinamarriage_events.1001.d:0 "The [Root.GetAdjective] royal couple has arrived in [honeymoonprovince.GetName] in [honeymoonprovince.GetAreaName].  The trip is an excellent opportunity to boost local ties to the [Root.GovernmentName] as well as for the couple to explore their new relationship."
