 cosmo_trade_events.1.t:0 "Supplying the [Root.GetAdjective] trade fleet"
 cosmo_trade_events.1.d:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] has entrusted  [Root.Monarch.GetHerHis] heir [Root.Heir.GetName] with overseeing a suitable trade offering highlighting [Root.GetAdjective] wealth.  Fortunately, [Root.GetName] and its subjects are rich in gold.  We can divert resources from one of our provinces to supply the trade mission at no additional cost." 
