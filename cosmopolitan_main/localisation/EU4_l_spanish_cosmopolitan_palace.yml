l_spanish:
 qosmo_palace_events.30.t:0 "The [palacecountry.Monarch.GetTitle]'s Palace"
 qosmo_palace_events.30.d:0 "[palacecountry.Monarch.GetTitle]'s forbidden palace is naturally forbidden for anyone who is not the [palacecountry.Monarch.GetTitle].  So for [Root.GetName] to gain entry represents a  rare opportunity.  It would be easy to become lost in the intoxicating pleasures and perfumed sheets of this haven for the [palacecountry.Monarch.GetTitle]'s most extraordinary fantasies.  Perhaps more could be accomplished."
 qosmo_palace_events.30.a:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] wants to enjoy [Root.Monarch.GetHerHim]self"
 qosmo_palace_events.30.b:0 "Plot against the [palacecountry.GetAdjective] [palacecountry.Monarch.GetTitle]"
 qosmo_palace_events.30.c:0 "Leave the Palace"
 qosmo_palace_events.31.t:0 "Escape from the [palacecountry.Monarch.GetTitle]'s Palace"
 qosmo_palace_events.31.d:0 "The [Root.GetAdjective] mission was a resounding success.  Not only did all our operatives escape with their lives, but they were able to help all that were promised to escape.   Once outside the reach of the [palacecountry.Monarch.GetTitle]'s guards the freed women broke down in tears thanking their rescuers.  On their return to [Root.Capital.GetCapitalName] there was a great celebration in their honor before the work began coaching them on what would come next.  It is imperative that they impress upon their people the generosity and fearlessness of [Root.Monarch.GetTitle] [Root.Monarch.GetName] to undertake such risks on their behalf.  Certainly [Root.GetName] is a true friend who should be trusted and worth fighting under."
 qosmo_palace_events.31.a:0 "Return the consort to her people with a message"
