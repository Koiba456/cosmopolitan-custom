 cosmo_brotheldignitary_events.20.t:0 "The International District"
 cosmo_brotheldignitary_events.20.d:0 "We are now a world port, and from all corners of the world people flow into our harbor.  A growing number of foreigners to our lands have began to set up shop in the area, and in the pleasure district as well.  These new establishments offer women from the furthest reaches of our influence.  To which area should we direct the evening's entertainment?"
 cosmo_brotheldignitary_events.20.a:0 "The Street of the Americas."
 cosmo_brotheldignitary_events.20.b:0 "The African District"
 cosmo_brotheldignitary_events.20.c:0 "The East" 
 cosmo_brotheldignitary_events.200.t:0 "Entertaining the Dignitary from [dignitarycountry.GetName]"
 cosmo_brotheldignitary_events.200.d:0 "Back in [dignitarycountry.Capital.GetCapitalName], [dignitarycountry.GetName]'s opinion of [Root.GetName] has somewhat improved thanks in part to the dignitary's new friend.  She believes them to be particularly amenable to any request the [Root.Monarch.GetTitle] might make at the moment.\n\n[Root.HeirOrAdvisor]"
 cosmo_brotheldignitary_events.200.a:0 "Entice [dignitarycountry.GetName] to join the empire"
 cosmo_brotheldignitary_events.200.b:0 "Entice the emperor to allow [Root.GetName] to join the empire"
 cosmo_brotheldignitary_events.200.c:0 "Convince the [dignitarycountry.Monarch.GetTitle] to trust [Root.GetName]"
 cosmo_brotheldignitary_events.200.7:0 "Explain the benefits of [dignitarycountry.Monarch.GetTitle] being a subject of [Root.GetName]"
 cosmo_brotheldignitary_events.200.8:0 "Convince the [dignitarycountry.Monarch.GetTitle] to embrace higher tariffs"
 cosmo_brotheldignitary_events.200.9:0 "Convince [dignitarycountry.GetAdjective] mercenaries to fight for [Root.GetName]"
 cosmo_brotheldignitary_events.200.10:0 "Improve the relationship between [Root.GetName] and [dignitarycountry.GetName]"
 cosmo_brotheldignitary_events.200.11:0 "Exploit connections in [dignitarycountry.Capital.GetCapitalName]" 
 cosmo_brotheldignitary_events.200.20:0 "Curry Favors in [dignitarycountry.Capital.GetCapitalName]" 
 cosmo_brotheldignitary_events.200.13:0 "Free [dignitarycountry.GetName] from their overlords, and offer them a union" 
 cosmo_brotheldignitary_events.200.14:0 "Attempt to free [dignitarycountry.GetName] from their overlords, and offer them a union" 
 cosmo_brotheldignitary_events.200.15:0 "Resume regular orders to our woman in [dignitarycountry.Capital.GetCapitalName]" 
 cosmo_brotheldignitary_events.200.12:0 "Cancel our plans" 
 cosmo_psort_events.40.t:0 "The Dignitary's Mistress" 
 cosmo_brotheldignitary_events.2001.t:0 "Entertaining the Dignitary from [dignitarycountry.GetName]"
 cosmo_brotheldignitary_events.2001.d:0 "[Root.HeirOrAdvisor] \n\nIf we were to provide them with the right companion, perhaps she could travel back with the delegation to [dignitarycountry.Capital.GetCapitalName] where she could be a voice of influence for [Root.GetName] in the [dignitarycountry.GetAdjective] court."
