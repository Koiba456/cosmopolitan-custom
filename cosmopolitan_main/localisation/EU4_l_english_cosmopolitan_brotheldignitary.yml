 cosmo_brotheldignitary_events.20.t:0 "Entertain a dignitary in [Root.Capital.GetCapitalName]"
 cosmo_brotheldignitary_events.20.d:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName]'s court in [Root.Capital.GetCapitalName] hosts many respected foreign dignitaries from all over the world.  While in [Root.GetName] one must at least sample the world renown [Root.GetAdjective] brothels.   Owing to the [Root.Monarch.GetTitle]'s generous reputation among [Root.GetName]'s madams we are ensured that any services provided to these guests of the [Root.Monarch.GetTitle] will receive with it a lasting impression courtesy of the finest [Root.GetName] has to offer."
