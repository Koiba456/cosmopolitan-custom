 cosmo_colonial_events.612.t:0 "[enslavedprovince.Owner.GetAdjective] Slaves captured in [enslavedprovince.GetName]"
 cosmo_colonial_events.612.d:0 "The horrors of war spare no one, and many of our enemy's civilians have been swept up in the conflict.  As we have devastated their lands many have fallen victim to mauraders and slavers.  These innocent victims of the war may soon find themselves being sold in a slave market in the Barbary Coast or perhaps worse sent to an overseas colony to serve as an indentured servant."
 cosmo_colonial_events.612.a:0 "Send them to our slave markets."
 cosmo_colonial_events.612.b:0 "Sell them to the barbary markets."
 cosmo_colonial_events.612.c:0 "Send them to our slave markets."
 cosmo_colonial_events.612.7:0 "Reject the offer."
 cosmo_colonial_events.612.8:0 "Sell them to the Barbary slave markets." 
 cosmo_colonial_events.613.t:0 "Slaves captured by pirates in [enslavedprovince.GetName]"
 cosmo_colonial_events.613.d:0 "[enslavedprovince.Owner.GetAdjective] ships from [enslavedprovince.GetName] have been seized by privateers working for [Root.GetName].  The pirates have captured not only ships' goods but their crews and passengers as well.  Unscrupulous men they have no qualms about making a profit from all they seize, including innocent civilians.  We of course should take our cut as well"
 cosmo_colonial_events.613.a:0 "[Root.GetName] is not directly implicated"
 cosmo_colonial_events.613.7:0 "Reject the offer." 
 cosmo_colonial_events.614.t:0 "[enslavedprovince.Owner.GetAdjective] Slaves captured in [enslavedprovince.GetName]"
 cosmo_colonial_events.614.d:0 "The horrors of war spare no one, and many of [enslavedprovince.Owner.GetName]'s civilians have been swept up in the conflict.  As we have devastated their lands many have fallen victim to marauders and slavers.  These innocent casualties of the war may soon find themselves being sold in a slave market in the Barbary Coast or sent to one of [Root.GetName]'s own colonies."
 cosmo_colonial_events.614.a:0 "Send them to our slave markets."
 cosmo_colonial_events.614.b:0 "Sell them to the barbary markets."
 cosmo_colonial_events.614.c:0 "Send them to our slave markets."
 cosmo_colonial_events.614.7:0 "Reject the offer."
 cosmo_colonial_events.614.8:0 "Sell them to the Barbary slave markets." 
 cosmo_colonial_events.615.t:0 "Slaves captured by pirates in the [enslavedprovince.GetName]"
 cosmo_colonial_events.615.d:0 "Ships and coastal settlements on the coasts of the [enslavedprovince.GetName] have been raided by privateers working for [Root.GetName].  The pirates have captured not only material wealth, but have kidnapped any persons unfortunate enough to cross their paths and seized them as slaves to be sold."
 cosmo_colonial_events.615.a:0 "Send them to our slave markets."
 cosmo_colonial_events.615.b:0 "Sell them to the barbary markets."
 cosmo_colonial_events.615.7:0 "[Root.GetName] will not involve itself" 
