 cosmo_colonial_events.811.b:0 "She can make do with what she has already"  
 cosmo_colonial_events.802.t:0 "Servant girls run away to become prostitutes"
 cosmo_colonial_events.802.d:0 "The life of a prostitute is not easy, but life as an indentured servant is often much worse.  It is therefore no suprise that we find many young women arriving at our brothels escaping what they call abusive conditions from their owners.  Should we allow these women to escape their bonds of servitude so long as they are willing to find useful employment elsewhere?"
 cosmo_colonial_events.802.a:0 "Let them choose this life if they want." 
 cosmo_colonial_events.812.t:0 "Slaves offered as Prostitutes"
 cosmo_colonial_events.812.d:0 "The life of a prostitute is not always an easy one, but life as a slave is much worse.  Slave traders sailing into our port have offered to sell some of the young women they hold captive to us for us to make into prostitutes.  Should we allow this?"
 cosmo_colonial_events.812.a:0 "Yes, these exotic women will be a draw"  
 cosmo_colonial_events.812.b:0 "Yes, these exotic women will be a draw"  
 cosmo_colonial_events.812.c:0 "No, they can keep their slaves"  
 cosmo_colonial_events.812.7:0 "Perhaps another brothel is more suited"   
 cosmo_colonial_events.803.t:0 "Hire a new madam"
 cosmo_colonial_events.803.d:0 "There is no doubt the brothel in our province is profitable.  But it is rather poorly ran.  The women are simply not cut from the same cloth as those in the finer establishment back home.  While the common sailor may not complain many of the higher class refuse their services for fear of disease or disgust."
 cosmo_colonial_events.803.a:0 "Hire her." 
 cosmo_colonial_events.803.b:0 "Not now, perhaps another time.."  
 cosmo_colonial_events.804.t:0 "The madam's training is complete"
 cosmo_colonial_events.804.d:0 "After all our hard work the results are clear.  You would never know the origin of these fine ladies, they are fit for a king."
 cosmo_colonial_events.804.a:0 "Excellent news." 
 cosmo_colonial_events.814.t:0 "The madam's training is complete"
 cosmo_colonial_events.814.d:0 "The madam has transformed these women into true courtesans worthy of men of any station.  They will be able to attract clientele among some of the wealthiest men at port, and would be welcome even in finest brothels back home."
 cosmo_colonial_events.814.a:0 "Excellent news."   cosmo_colonial_events.803.t:0 "Hire a new madam"
