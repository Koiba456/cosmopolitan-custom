 cosmo_colonial_events.7.t:0 "the Port of Pleasure"
 cosmo_colonial_events.7.d:0 "The colony is floundering, it hasn't much in the way of valuable resources and quite frankly it is difficult to convince new colonists to make the journey.  The daughter of a merchant who had taken over her father's shipping business following his untimely death has suggested we attempt to attract the business of ships passing-by by offering certain services to the men aboard.  She believes women are the key to making the colony an essential resupply point for the areas many shipping concerns and of course promises to service our own naval forces at a discount."
 cosmo_colonial_events.7.a:0 "An excellent idea to turn this wasteland into profits."
 cosmo_colonial_events.7.b:0 "Fish, and water, and sheep are perfectly fine bases for a colony." 
