 cosmo_colonial_events.201.t:0 "Colony Prospering"
 cosmo_colonial_events.201.d:0 "Three years later the amicable relationship between the natives and the colonists has more or less remained intact despite their many differences and disagreements.  Many see it as a model to be replicated in the [Root.GovernmentName]'s other colonies."
 cosmo_colonial_events.201.a:0 "Encourage investment in the province."
 cosmo_colonial_events.201.b:0 "Promote a local officer."
 cosmo_colonial_events.201.c:0 "Promote a local captain."
 cosmo_colonial_events.202.t:0 "Hostile Natives in [colonyprovince.GetName]"
 cosmo_colonial_events.202.d:0 "Three years later our actions have caused a great deal of unrest among the local natives in [colonyprovince.GetName].  Fortunately our colony has survived and even thrived in spite of the hostilities with local peoples.  Many credit the colony's military leadership and believe the "Wars with the Natives" will ultimately bolster [Root.GetName]'s reputation among prospective colonists and any colonial rivals in the region."
 cosmo_colonial_events.202.a:0 "Others could learn from [colonyprovince.GetName]." 
 cosmo_colonial_events.202.b:0 "Promote an officer from the colony."
 cosmo_colonial_events.202.c:0 "Promote a captain from the colony."  
 cosmo_colonial_events.203.t:0 "A Prospering Brothel"
 cosmo_colonial_events.203.d:0 "Three years later the amicable relationship between the natives and the colonists has more or less remained intact despite their many differences and disagreements.  Many see it as a model to be replicated in the [Root.GovernmentName]'s other colonies."
 cosmo_colonial_events.203.a:0 "Install a local woman as madam and encourage local trade."
 cosmo_colonial_events.203.b:0 "These exotic women will fetch a higher price back home."
 cosmo_colonial_events.204.t:0 "Women from Africa Arrive at our Port"
 cosmo_colonial_events.204.d:0 "Their skin mesmerizing shades of umber, caramel, and golden brown unlike anything found in [Root.GetAdjective] lands.  The women from Africa are an instant hit at the brothels back home.  Lines of curious patrons form into the streets, though some were forced into service a few of these women have managed to purchase their freedom with their earnings.  A few talk of opening brothels of their own to capitilize on the wave of enthusiasm."
 cosmo_colonial_events.204.a:0 "Whatever keeps our trade prosperous."
 cosmo_colonial_events.210.t:0 "The [Root.GetAdjective] Colony in [colonyprovince.GetName]"
 cosmo_colonial_events.210.d:0 "[Root.GetName]'s colony in [colonyprovince.GetName] has managed to get a foothold in the area, but morale in the colony is low.  A number of young unmarried men have arrived to the colony but the number of unwed [Root.GetAdjective] women making the journey is far from enough to sustain a colony long term.  We will continue to encourage young families and married couples to move to the colony and with the hardest work behind us more will seize the opportunity.  Still some in [Root.Capital.GetCapitalName] have suggested we intervene immediately to discourage any of our current colonists from abandoning the settlement.  We could approach those natives in [colonyprovince.GetName] that are friendly to [Root.GetName] and offer to take steps to integrate them into our new colony.  Or we could simply attack the natives and attempt to seize what we need while removing them as a possible threat."
 cosmo_colonial_events.210.a:0 "Integrate with the native population."
 cosmo_colonial_events.210.b:0 "Use force on the natives."
 cosmo_colonial_events.210.c:0 "Send former prostitutes and widows."
 cosmo_colonial_events.210.7:0 "There is nothing we can do."
 cosmo_colonial_events.211.t:0 "Colony in [colonyprovince.GetName] Prospering"
 cosmo_colonial_events.211.d:0 "Three years later the amicable relationship between the natives and the colonists has more or less remained intact despite their many differences and disagreements.  Many see it as a model to be replicated in the [Root.GovernmentName]'s other colonies."
