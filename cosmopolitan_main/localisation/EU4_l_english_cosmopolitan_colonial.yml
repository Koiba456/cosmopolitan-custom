 cosmo_colonial_events.2.t:0 "Our colony in [colonyprovince.GetName] needs women"
 cosmo_colonial_events.2.d:0 "[Root.GetName]'s colony in [colonyprovince.GetName] has managed to get a foothold in the area, but morale in the colony is low.  A number of young unmarried men have arrived to the colony but the number of unwed [Root.GetAdjective] women making the journey is far from enough to sustain a colony long term.  We will continue to encourage young families and married couples to move to the colony and with the hardest work behind us more will seize the opportunity.  Still some in [Root.Capital.GetCapitalName] have suggested we intervene immediately to discourage any of our current colonists from abandoning the settlement.  We could approach those among the [colonyprovince.Culture.GetName] in [colonyprovince.GetName] who are friendly to [Root.GetName] and offer to take steps to integrate them into our new colony.  Or we could simply attack the [colonyprovince.Culture.GetName] and attempt to seize what we need while removing them as a possible threat."
 cosmo_colonial_events.2.a:0 "Integrate with the [colonyprovince.Culture.GetName]."
 cosmo_colonial_events.2.b:0 "Use force on the native [colonyprovince.Culture.GetName]."
 cosmo_colonial_events.2.c:0 "Send former prostitutes and widows."
 cosmo_colonial_events.2.7:0 "There is nothing we can do."
 cosmo_colonial_events.200.t:0 "Send slaves to colony"
 cosmo_colonial_events.200.d:0 "As the colony begins to take hold there is a great deal of work to be done under some very harsh conditions.  It has been suggested by our colonist that we send slaves from our other overseas provinces to help build and work the colony."
 cosmo_colonial_events.200.a:0 "The colony will grow, whatever it takes"
 cosmo_colonial_events.200.b:0 "We will be patient, workers will come" 
