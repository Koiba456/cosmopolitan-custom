 cosmo_colonial_events.8.t:0 "Indentured Servitude"
 cosmo_colonial_events.8.d:0 "There are many in our country who live in poverty or find themselves on the wrong side of the law, or the crown.  Many are executed outright while others rot in prison.  It has been suggested that we put them to use in the colonies instead, though this not without controversy at home.  These unfortunate souls will be forced into servitude as punishment for their crimes, and will remain enslaved and the property of their new owners in our colonies until it is decided they have served out their sentence."
 cosmo_colonial_events.8.a:0 "We need people in our colonies, even if we have to force them."
 cosmo_colonial_events.8.b:0 "We will not force people into servitude, ban this practice."  
 cosmo_colonial_events.801.t:0 "Professionals"
 cosmo_colonial_events.801.d:0 "Newly arrived prostitutes at the port are untrained and ill-mannered.  While they will do for the riff-raff they are not properly suited to service the kind of upper scale clientele that draw in the largest profits.  The madam has requested financial assistance to lodge these women and support them until they can be properly trained in the arts of the brothel."
 cosmo_colonial_events.801.a:0 "Give her what she needs"
 cosmo_colonial_events.801.b:0 "She can make do with what she has already" 
 cosmo_colonial_events.811.t:0 "Professionals"
