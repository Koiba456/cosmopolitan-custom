 cosmo_colonial_events.707.t:0 "English ships in port"
 cosmo_colonial_events.707.d:0 "Allowing English ships to make full use of our island would greatly improve the local economy, though some caution against giving our rivals an entry to the area."
 cosmo_colonial_events.707.a:0 "More profit for us"
 cosmo_colonial_events.707.b:0 "They can harbor their ships elsewhere"
