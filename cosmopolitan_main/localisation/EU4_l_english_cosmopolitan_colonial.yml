 cosmo_colonial_events.242.d:0 "Three years later our actions have caused a great deal of unrest among the local natives in [colonyprovince.GetName].  Fortunately our colony has survived and even thrived in spite of the hostilities with local peoples.  Many credit the colony's military leadership and believe the "Wars with the Natives" will ultimately bolster [Root.GetName]'s reputation among prospective colonists and any colonial rivals in the region."
 cosmo_colonial_events.242.a:0 "Others could learn from [colonyprovince.GetName]." 
 cosmo_colonial_events.242.b:0 "Promote an officer from the colony."
 cosmo_colonial_events.242.c:0 "Promote a captain from the colony." 
 cosmo_colonial_events.3.t:0 "Colony Prospering"
 cosmo_colonial_events.3.d:0 "A year later our decision has paid dividends."
 cosmo_colonial_events.3.a:0 "The colony will survive."
 cosmo_colonial_events.399.t:0 "Colony Prospering"
 cosmo_colonial_events.399.d:0 "A year later our decision has paid dividends."
 cosmo_colonial_events.399.a:0 "The colony will survive."
 cosmo_colonial_events.5.t:0 "Prostitutes in Port"
 cosmo_colonial_events.5.d:0 "[Root.GetAdjective] brothels have amassed quite a reputation among satisfied patrons.  The bustling port supplies them with a steady stream of customers and a sizeable brothel district is now noticeably present near the heart of the trade district.  Many in the nobility and even the church have argued though sinful that prostitution allows for a necessary outlet for the desires of men, many long at sea.  Taking this outlet away could cause unrest and even dissuade some future trade.  The legal status of prostitution is murky, but both legal and clandestine prostitution appears in nearly every major city in Europe and throughout the world.  Instead of closing these brothels perhaps we should step in to help regulate them.  We do not want to encourage this behavior but we could improve the reality."
 cosmo_colonial_events.5.a:0 "We should encourage it"
 cosmo_colonial_events.5.b:0 "We should allow it but focus elsewhere" 
 cosmo_colonial_events.5.c:0 "We must shutter the brothels" 
 cosmo_colonial_events.503.t:0 "A request from the Brothel"
 cosmo_colonial_events.503.d:0 "Before our agent could seek her out he recieved a message from this madam.  She has a laundry list of requests for the crown, things she says should be only a minor inconvenience to us but are drastically needed to keep the business so profitable.  One of her brothels has been practically empty for weeks following a rash of incidents involving a young officer in our army.  He was seen dragging men out of rooms by the skin of their necks and swearing to do the same to any military man found on the premises, the madam requests someone have a talk with the man about the men's need for some rest and relaxation every now and then.  The madam also complains of certain tax collectors whose behavior has become quite abusive, she claims many women are being extorted by this taxmen and it is driving a great deal of business underground.  She wants us to reign in these men so that all trade returns to the proper recognized establishments.  Finally, there was an incident with a young man of noble birth.  I will spare you the details but justice in this case would be appreciated regardless of who the man's father is.  Which of her complaints if any should we address first?"
 cosmo_colonial_events.503.a:0 "Abusive tax collectors disrupting business"
 cosmo_colonial_events.503.b:0 "The overzealous officer"  
 cosmo_colonial_events.503.c:0 "The highborn troublemaker"  
 cosmo_colonial_events.501.t:0 "An Arrangement"
 cosmo_colonial_events.501.d:0 "A prominent madam from the local pleasure distract has made quite the name for herself and amassed somewhat of an empire of her own.  She has considerable influence not only in the brothel trade but practically all business that comes into the busy port.  Some noble merchants in court have complained of her intrusion into their affairs but she has also reached out to us through an agent of ours.  She claims she is the [Root.Monarch.GetTitle]'s most loyal supporter and only wishes to aid the throne in any way she can.  She suggests that beyond her wealth her position and reputation for discretion has made her privy to many men's secrets.  Secrets which could and should aid the [Root.Monarch.GetTitle]."
 cosmo_colonial_events.501.a:0 "Her offer sounds promising"
 cosmo_colonial_events.501.b:0 "We should side with the traditional brokers"
 cosmo_colonial_events.502.t:0 "A report from the brothel"
 cosmo_colonial_events.502.d:0 "Our agent has finally has his meeting with the local madam who is quite pleased with our recent actions on her behalf.  She says that she is at our service.  She has prepared our cut of the profits, unless there is something else you would want from her."
 cosmo_colonial_events.502.a:0 "Our share of the profits"
 cosmo_colonial_events.502.b:0 "Keep an ear out for any sensitive information"   
 cosmo_colonial_events.502.c:0 "Discounts for our brave men-at-arms." 
 cosmo_colonial_events.502.7:0 "Awful rumors about the church" 
 cosmo_colonial_events.502.8:0 "We should share our prosperity with the merchants" 
 cosmo_colonial_events.510.t:0 "Women from around the world" 
 cosmo_colonial_events.510.d:0 "As trade pours in from all areas of the world and our men sail distant oceans, curiosity abounds about all the various peoples our ships have encountered.  Some of our men having visited brothels abroad tell stories of their exotic and seductive women.  Whether the tales are true or not the merchants in [brothelprovince.GetName] has recognized an opportunity to expand the brothel district and attempt to entice a more varied offering of establishments to capture clients' attentions.  They have requested permission and [Root.GetAdjective] assistance in arranging for the transport and establishment of these new brothels in [brothelprovince.GetName], [Root.GetAdjective] port to the world."
 cosmo_colonial_events.510.a:0 "An excellent idea." 
 cosmo_colonial_events.6.t:0 "Indentured Servants"
 cosmo_colonial_events.6.d:0 "[Root.GetAdjective] lands are full of miscreants and those who would rebel against the [Root.Monarch.GetTitle].  It has been suggested that we empty some of our prisons of unruly and disloyal subjects and send them where they can be of use to us, and unable to cause trouble in our borders.  They will be forced into servitude as punishment for their crimes, and will remain enslaved and the property of their new owners in our colonies until it is decided they have served out their sentence."
 cosmo_colonial_events.6.a:0 "We need people in our colony, even if we have to force them."
 cosmo_colonial_events.6.b:0 "We will not force people into servitude, we will wait for willing colonists." 
 cosmo_colonial_events.601.t:0 "Treatment of Rebels"
 cosmo_colonial_events.601.d:0 "There is some debate among our advisors about how to treat the rebels and their supporters following the recent revolt.  Some have suggested they recieve no quarter, and all who take up arms against the rightful ruler should be hanged or shot as traitors.  Others suggest that these disloyal subjects be sent where they can be of use to us, and unable to cause trouble so close to home.  They propose forcing them into servitude as punishment for their crimes and made the property of owners in our colonies until it is decided they have served out their sentence.  Still others suggest mercy and reconciliation with our troublesome countrymen."
 cosmo_colonial_events.601.a:0 "They deserve labor in the colonies or the gallows"
 cosmo_colonial_events.601.b:0 "We will not force people into servitude nor seek retribution" 
 cosmo_colonial_events.602.t:0 "Defeated Rebels"
 cosmo_colonial_events.602.d:0 "[Root.GetAdjective] armies are victorious and have restored order to our lands.  The rebels are defeated, and their supporters have been rounded up.  What shall be done with them?"
 cosmo_colonial_events.602.a:0 "We need people in our colony, no matter their disloyalty."
 cosmo_colonial_events.602.b:0 "Make an example of them, give no quarter" 
 cosmo_colonial_events.610.t:0 "Slave Market"
 cosmo_colonial_events.610.d:0 "The local slavemarket is a valuable resource.  Should we exploit it further?"
 cosmo_colonial_events.610.a:0 "This could be just what we need to grow our colonies"
 cosmo_colonial_events.610.b:0 "We don't want to get involved here"  
