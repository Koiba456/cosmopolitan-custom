 cosmo_colonial_events.12.t:0 "[exportprovince.Culture.GetName] Colonists Arriving in [importprovince.GetName]" 
 cosmo_colonial_events.12.d:0 "[exportprovince.Culture.GetName] colonists arriving in [importprovince.GetName] have begun to amass considerable influence in our fledgling colony.  Initially some of the most enthusiastic colonists, they now have began to insist on greater autonomy and control over local affairs.  The [importprovince.Culture.GetName] populace is hesitant to share their ower with the newcomers, but as more and more arrive every day they may not have a choice." 
 cosmo_colonial_events.12.a:0 "Recognize the [exportprovince.Culture.GetName] Colonists" 
 cosmo_colonial_events.12.b:0 "Keep things as they are" 
