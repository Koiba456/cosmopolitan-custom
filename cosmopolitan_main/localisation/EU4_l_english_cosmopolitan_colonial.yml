 cosmo_colonial_events.627.a:0 "Send them to our slave markets."
 cosmo_colonial_events.627.b:0 "Sell them to the barbary markets."
 cosmo_colonial_events.627.7:0 "[Root.GetName] will not involve itself" 
 cosmo_colonial_events.628.t:0 "[enslavedprovince.Owner.GetAdjective] Slaves captured in [enslavedprovince.GetName]"
 cosmo_colonial_events.628.d:0 "The horrors of war spare no one, and many of [enslavedprovince.Owner.GetName]'s civilians have been swept up in the conflict.  As we have devastated their lands many have fallen victim to marauders and slavers.  These innocent casualties of the war may soon find themselves being sold in a slave market in the Sulu Coast or sent to one of [Root.GetName]'s own colonies."
