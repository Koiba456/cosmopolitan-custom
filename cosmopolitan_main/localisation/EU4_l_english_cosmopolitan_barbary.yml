 cosmo_barbary_events.1.t:0 "Purchase Slaves from [exportprovince.GetName]"
 cosmo_barbary_events.1.d:0 "Thanks to our good relations with [exportprovince.Owner.Monarch.GetTitle] [exportprovince.Owner.Monarch.GetName] of [exportprovince.Owner.GetName] we can purchase slaves from the great market in [exportprovince.GetName]."
 cosmo_barbary_events.1.a:0 "Seek to purchase slaves from [exportprovince.GetName]"
 cosmo_barbary_events.2.t:0 "Provinces Devastated"
 cosmo_barbary_events.2.d:0 "A commotion occurred near one of our colonies when one of our men was discovered laying with a native woman.  The soldier swears by all that is holy that she wanted him but nonetheless the scandal has caused tensions with the neighboring peoples to reach a boiling point.  Whatever is done to address the situation the reality is that the men have needs and our colonies long-term prosperity is necessarily dependent on many more such encounters taking place between men such as this and womenfolk, wherever they are sourced."
 cosmo_barbary_events.2.a:0 "Intermarry equally with the native population."
 cosmo_barbary_events.2.b:0 "Attack the natives and steal their women."
 cosmo_barbary_events.2.c:0 "Bring in prostitutes to take advantage of the situation."
 cosmo_barbary_events.201.t:0 "Yearly Devastation Check"
 cosmo_barbary_events.201.d:0 "Five years later your decision has paid dividends."
 cosmo_barbary_events.201.a:0 "The colony grows."
 cosmo_barbary_events.201.b:0 "A new leader."
 cosmo_barbary_events.201.c:0 "A new captain."
 cosmo_barbary_events.202.t:0 "Devastation of War"
 cosmo_barbary_events.202.d:0 "Five years later your decision has caused anger among the local natives."
 cosmo_barbary_events.202.a:0 "We will beat them back."
 cosmo_barbary_events.203.t:0 "The War is Over"
 cosmo_barbary_events.203.d:0 "Five years later your decision has paid dividends."
 cosmo_barbary_events.203.a:0 "Install a local woman as madam and encourage local trade."
 cosmo_barbary_events.203.b:0 "These exotic women will fetch a higher price back home."
 cosmo_barbary_events.204.t:0 "Enemies Sold into Slavery"
 cosmo_barbary_events.204.d:0 "Their skin mesmerizing shades of umber, caramel, and golden brown unlike anything found in [Root.GetAdjective] lands.  The women from Africa are an instant hit at the brothels back home.  Lines of curious patrons form into the streets, though some were forced into service a few of these women have managed to purchase their freedom with their earnings.  A few talk of opening brothels of their own to capitilize on the wave of enthusiasm."
 cosmo_barbary_events.204.a:0 "Whatever keeps our trade prosperous."
 cosmo_barbary_events.210.t:0 "[enslavedprovince.Owner.GetAdjective] Slaves captured in [enslavedprovince.GetName]"
 cosmo_barbary_events.210.d:0 "The horrors of war spare no one, and many of our enemy's civilians have been swept up in the conflict.  As we have devastated their lands many have fallen victim to mauraders and slavers.  These innocent victims of the war may soon find themselves being sold in a slave market in the Barbary Coast."
 cosmo_barbary_events.210.a:0 "Sell them to the Barbary Markets."
 cosmo_barbary_events.210.b:0 "Sell them to the Barbary Markets."
 cosmo_barbary_events.210.c:0 "Sell them to the Barbary Markets."
 cosmo_barbary_events.210.7:0 "These people will not be slaves." 
 cosmo_barbary_events.211.t:0 "Open the Slave Market"
 cosmo_barbary_events.211.d:0 "Despite our agents best efforts for every market in the city we have shuttered we discover a new one has started in the desert outskirts.  For centuries the slave markets in the city of Algiers, the largest on the Barbary Coast flourished with the slave trade.  Unsuspecting victims at sea captured by pirates and those living in coastal communities vulnerable to raids could find themselves chattel to be bought and sold.  Though it was forbidden to enslave their fellow Muslims the Barbary states would prosper with the trade.  Though sailors made up the largest group of the enslaved women captured could sometimes find themselves forced into prostitution or to serve as concubines for the wealthy and powerful."
 cosmo_barbary_events.211.a:0 "We will open the markets."
 cosmo_barbary_events.211.b:0 "We have abolished the despicable slave trade here."
 cosmo_barbary_events.310.t:0 "[enslavedprovince.Owner.GetAdjective] Slaves captured in [enslavedprovince.GetName]"
 cosmo_barbary_events.310.d:0 "The horrors of war spare no one, and many of our enemy's civilians have been swept up in the conflict.  As we have devastated their lands many have fallen victim to mauraders and slavers.  These innocent victims of the war may soon find themselves being sold in a slave market in the Barbary Coast."
 cosmo_barbary_events.310.a:0 "Sell them to the Khanate's Markets."
 cosmo_barbary_events.310.b:0 "Sell them to the Barbary Markets."
 cosmo_barbary_events.310.c:0 "Sell them to the Barbary Markets."
 cosmo_barbary_events.310.7:0 "These people will not be slaves." 
 cosmo_barbary_events.911.t:0 "Bribe the slavers in [slavercountry.GetName]"
 cosmo_barbary_events.911.d:0 "We have negotiated an arrangement with the slavers in [slavercountry.GetName] to protect our lands and ships from their raid, and also to open their markets to us."
 cosmo_barbary_events.911.a:0 "Bribe the [slavercountry.GetAdjective]"
 cosmo_barbary_events.911.b:0 "Don't bribe the [slavercountry.GetAdjective]"
 cosmo_barbary_events.311.t:0 "Open the Slave Market in [enslavedprovince.GetCapitalName]"
 cosmo_barbary_events.311.d:0 "The slave market in [enslavedprovince.GetCapitalName] remains extremely busy.  Unfortunate victims captured by Tatar raiders could find themselves chattel to be bought and sold.  Throughout the black sea and beyond buyers come to the cities market looking to make a purchase.  Though it was forbidden to enslave their fellow Muslims the Tatar raiders would prosper with the trade.  Some of the enslaved women captured could sometimes find themselves forced into prostitution or to serve as concubines for the wealthy and powerful, some even finding their way into the service of the Ottoman sultan himself.  It is a source of great wealth, but [Root.GetName] may not wish to associate itself with such a trade."
 cosmo_barbary_events.311.a:0 "We will open the markets."
 cosmo_barbary_events.311.b:0 "We have abolished the despicable slave trade here."
 cosmo_barbary_events.511.t:0 "Open the Slave Market in [enslavedprovince.GetCapitalName]"
 cosmo_barbary_events.511.d:0 "The slave market in [enslavedprovince.GetCapitalName] has for century served as a source of export for slaves to through the Arabian Penninsula or the Indian Ocean.  Though it was forbidden to enslave their fellow Muslims, or Christians depending on who was ruling the city at the time both prospered with the trade.  Some of the enslaved women captured or brought to the market could sometimes find themselves serving as concubines for the wealthy and powerful, some even finding their way into the service of the Ottoman sultan or other great powers.  It is a source of great wealth, but [Root.GetName] may not wish to associate itself with such a trade."
 cosmo_barbary_events.511.a:0 "We will open the markets."
 cosmo_barbary_events.511.b:0 "We have abolished the despicable slave trade here." 
 cosmo_barbary_events.411.t:0 "Open the Slave Market"
 cosmo_barbary_events.411.d:0 "Despite our agents best efforts for every market in the city we have shuttered we discover a new one has started in the outskirts.  For centuries the slave markets in the city of Jolo, the largest in the region flourished with the slave trade.  Unfortunate victims captured by Sulu raiders could find themselves chattel to be bought and sold.  Though it was forbidden to enslave their fellow Muslims the Sulu raiders would prosper with the trade.  Some of the enslaved women captured could sometimes find themselves forced into prostitution or to serve as concubines for the wealthy and powerful, some even finding their way into the service of the Chinese emperor.  It is a source of great wealth, but [Root.GetName] may not wish to associate itself with such a trade"
 cosmo_barbary_events.411.a:0 "We will take advantage of the markets."
 cosmo_barbary_events.411.b:0 "We have abolished the despicable slave trade here." 
 cosmo_barbary_events.415.t:0 "Jolo slave market overflowing"
 cosmo_barbary_events.415.d:0 "The recent influx of slaves from [Root.GetName] has stretched the limits of the slave market in the Crimea Khanate to its limit.  The traders have began slashing their prices in an effort to clear the stocks.  They have sent us a cut of the remaining profits, it may take some time for the market to regain its former profitability."
 cosmo_barbary_events.415.a:0 "Demand will return"
 cosmo_barbary_events.415.b:0 "It is time to cut ties with these slavers"  
 cosmo_barbary_events.212.t:0 "Pirates capture slaves near [enslavedprovince.GetName]"
 cosmo_barbary_events.212.d:0 "Our privateers regularly capture not only a ship's goods but many of their crew and passengers as well.  Some are pressed into service aboard the pirate ships, while others are sold to slave markets.  Unscrupulous men they have no qualms about how they make their profits.  We of course should take our cut as well, but even a suspicion of our involvement could damage relations."
 cosmo_barbary_events.212.a:0 "[Root.GetName] is not directly implicated"
 cosmo_barbary_events.212.b:0 "[enslavedprovince.Owner.GetName] may be suspicious"
 cosmo_barbary_events.213.t:0 "A Prospering Brothel"
 cosmo_barbary_events.213.d:0 "Five years later your decision has paid dividends."
 cosmo_barbary_events.213.a:0 "Install a local woman as madam and encourage local trade."
 cosmo_barbary_events.213.b:0 "These exotic women will fetch a higher price back home." 
 cosmo_barbary_events.214.t:0 "The Barbary Market Thrives"
 cosmo_barbary_events.214.d:0 "Raiding coasts and ships thousands upon thousands of slaves pour through these markets, and thanks to our partnership with these slavers we stand to benefit from this deplorable trade.  Now the largest of the slave cities, Algiers has come to the attention of buyers throughout the Muslim world including procurers from the Ottoman empire and its famous harem.  We are told that any future concubines we aquire will fetch a high price, of which we will of course get our cut of the profits."
 cosmo_barbary_events.214.a:0 "We will use these ill-gotten gains for good"
 cosmo_barbary_events.214.b:0 "This business is distasteful we want no more" 
 cosmo_barbary_events.2151.t:0 "[Root.GetName]'s slave market overflowing"
 cosmo_barbary_events.2151.d:0 "The recent influx of slaves from [Root.GetName] has stretched the limits of the slave market in [enslavedprovince.GetName] to its limit.  The traders have began slashing their prices in an effort to clear the stocks.  They have sent us a cut of the remaining profits, it may take some time for the market to regain its former profitability."
 cosmo_barbary_events.2151.a:0 "Demand will return"
 cosmo_barbary_events.2151.b:0 "It is time to cut ties with these slavers"   
