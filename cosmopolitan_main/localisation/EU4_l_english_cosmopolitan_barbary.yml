 cosmo_barbary_events.215.a:0 "Demand will return"
 cosmo_barbary_events.215.b:0 "It is time to cut ties with these slavers"  
 cosmo_barbary_events.216.t:0 "Algiers wants [enslavedprovince.GetName]"
 cosmo_barbary_events.216.d:0 "[ALG.Monarch.GetTitle] [ALG.Monarch.GetName] of [ALG.GetName] has targeted the province of [enslavedprovince.GetName] for purchase.  Should [Root.GetName] be willing to part with the area the [ALG.Monarch.GetTitle] says he will make it worth their while."
 cosmo_barbary_events.216.a:0 "Accept their offer"
 cosmo_barbary_events.216.b:0 "This land is now [Root.GetAdjective]"
 cosmo_barbary_events.217.t:0 "Sulu wants [enslavedprovince.GetName]"
 cosmo_barbary_events.217.d:0 "[SUL.Monarch.GetTitle] [SUL.Monarch.GetName] of [SUL.GetName] has targeted the province of [enslavedprovince.GetName] for purchase.  Should [Root.GetName] be willing to part with the area the [SUL.Monarch.GetTitle] says he will make it worth their while."
 cosmo_barbary_events.217.a:0 "Accept their offer"
 cosmo_barbary_events.217.b:0 "This land is now [Root.GetAdjective]" 
 cosmo_barbary_events.218.t:0 "Ending the trade in [enslavedprovince.GetName]"
 cosmo_barbary_events.218.d:0 "[enslavedprovince.GetName]'s slave markets are no longer open to [Root.GetName]."
 cosmo_barbary_events.218.a:0 "We don't need them"
 cosmo_barbary_events.315.t:0 "Kaffa slave market overflowing"
 cosmo_barbary_events.315.d:0 "The recent influx of slaves from [Root.GetName] has stretched the limits of the slave market in the Crimea Khanate to its limit.  The traders have began slashing their prices in an effort to clear the stocks.  They have sent us a cut of the remaining profits, it may take some time for the market to regain its former profitability."
 cosmo_barbary_events.315.a:0 "Demand will return"
 cosmo_barbary_events.315.b:0 "It is time to cut ties with these slavers"  
 cosmo_barbary_events.316.t:0 "Crimea wants [enslavedprovince.GetName]"
 cosmo_barbary_events.316.d:0 "[CRI.Monarch.GetTitle] [CRI.Monarch.GetName] of [CRI.GetName] has targeted the province of [enslavedprovince.GetName] for purchase.  Should [Root.GetName] be willing to part with the area the [CRI.Monarch.GetTitle] says he will make it worth their while."
 cosmo_barbary_events.316.a:0 "Accept their offer"
 cosmo_barbary_events.316.b:0 "This land is now [Root.GetAdjective]"
 cosmo_barbary_events.220.t:0 "Concubine fetches a high price"
 cosmo_barbary_events.220.d:0 "Among the slaves delivered to the Barbary markets was an especially beautiful woman.  Spared the treatment of most of her fellow captives she was quickly recognized as a valuable asset.  She is to be sold as a concubine to a wealthy merchant, local ruler, or perhaps even the Ottoman sultan's own harem.  Still enslaved she will not have freedom, but her conditions are markedly better than many of the others sold in the market.  We have recieved a cut of the profits from her sale, nearly the price of the dozens of others sold put together."
 cosmo_barbary_events.220.a:0 "Our payment"
 cosmo_barbary_events.2200.t:0 "Concubines sold"
 cosmo_barbary_events.2200.d:0 "A buyer at the Barbary slave market has inquired about acquiring one more concubines from our recently captured slaves."
 cosmo_barbary_events.2200.a:0 "Select one among the slaves from Africa"
 cosmo_barbary_events.2200.b:0 "Select one among the slaves from Europe"
 cosmo_barbary_events.2200.c:0 "Exit"
 cosmo_barbary_events.2201.t:0 "Concubines from Africa"
 cosmo_barbary_events.2201.d:0 "A buyer at the Barbary slave market has inquired about acquiring one more concubines from our recently captured slaves."
 cosmo_barbary_events.2201.a:0 "Select one among the slaves from West Africa" 
 cosmo_barbary_events.2202.t:0 "Concubines from West Africa"
 cosmo_barbary_events.2202.d:0 "A beautiful woman from somewhere on the western coast of Africa.  She has not been at the Barbary slave market for long, and she immediately caught the eye of the Ottoman procurer."
 cosmo_barbary_events.2202.a:0 "Get our cut of the sale"
 cosmo_barbary_events.2202.b:0 "Get our cut of the sale"
 cosmo_barbary_events.2202.c:0 "Give her special instruction first" 
 cosmo_barbary_events.2202.7:0 "Give her special instruction first"
 cosmo_barbary_events.2202.8:0 "Show him some other women"
 cosmo_barbary_events.2203.t:0 "Special Instructions"
 cosmo_barbary_events.2203.d:0 "Before she joins the Imperial Harem your agent has a word with her.  Though her lot in life may appear bleak, he promises her a great reward and freedom from her captivity in the near future should she happen to be successful in persuading the Sultan to our line of thinking.  To aid her in this task, we shall give her our own instruction on how best to persuade any man."
 cosmo_barbary_events.2203.a:0 "Have her sow discord among their alliances"
 cosmo_barbary_events.2203.b:0 "Perhaps she can dissuade him of his plans to attack"
 cosmo_barbary_events.2203.c:0 "I've changed my mind"
