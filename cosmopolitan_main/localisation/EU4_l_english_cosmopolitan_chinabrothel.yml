 cosmo_chinabrothel_events.6131.t:0 "Prostitutes in [Root.Capital.GetCapitalName]"
 cosmo_chinabrothel_events.6131.d:0 "From across China, these women come from a variety of backgrounds.  Far from your average prostitute servicing drunks and poor students, they have received training from the most renowned madams to service only the finest of clientele.  Here in [Root.Capital.GetCapitalName] they are in high demand as entertainment for the wealthiest and most powerful.  The [Root.GetAdjective] [Root.GovernmentName] sees great value in their use in persuading those in power when other forms of persuasion prove insufficient" 
