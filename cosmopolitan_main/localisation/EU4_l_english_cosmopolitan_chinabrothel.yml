 cosmo_chinabrothel_events.6322.b:0 "Wish her luck in her proselytizing"
 cosmo_chinabrothel_events.6522.t:0 "Proselytizing in [convertprovince.GetName]"
 cosmo_chinabrothel_events.6522.d:0 "Julienne has arrived in [convertprovince.GetName] and it did not take long for her to acquaint herself with the local brothel's prostitutes and patrons.  The prostitutes practically leapt at the opportunity to abandon a faith which had so harshly condemned them as sinners, and many have become eager missionaries themselves for the faith, whispering into the ears of their satisfied clients."
 cosmo_chinabrothel_events.6522.a:0 "She is an inspiration to us all"
 cosmo_chinabrothel_events.6522.b:0 "She is an inspiration to us all" 
