 cosmo_events.5.d:0 "After every new marriage you should get a decision allowing you to have a honeymoon.  This will last 6 months during which time you will visit 3 provinces, though you can visit the same province twice.  Once visited the province gets a significant two month boost to development and other things as a province modifier"
 cosmo_events.5.a:0 "Done."
 cosmo_events.5.b:0 "Return to menu." 
 cosmo_events.6.t:0 "Libertinism"
 cosmo_events.6.d:0 "Libertinism is counted whenever your ruler takes an action that is considered sinful.  This includes affairs, brothel visits, and certain highlighted event decisions.  While some decisions and events will be available from the start, others will only be unlocked as a ruler becomes more degenerate."
 cosmo_events.6.a:0 "Prostitutes and Brothels."
 cosmo_events.6.b:0 "Barbary Pirate Slave Raids and Trade." 
 cosmo_events.6.c:0 "Harems and Concubines."  
 cosmo_events.6.7:0 "Affairs."  
 cosmo_events.601.t:0 "Prostitutes and Brothels"
 cosmo_events.601.d:0 "Prostitutes are a low value trade good which can become valauble if you take advantage of province modifiers.  There are two forms of provinces that can have the trade good prostitutes, they are: Ports of Pleasure and Brothels in home ports."
 cosmo_events.601.a:0 "Ports of Pleasure"
 cosmo_events.601.b:0 "Home Port brothels"
 cosmo_events.601.c:0 "Return to Menu."
 cosmo_events.611.t:0 "Ports of Pleasure"
 cosmo_events.611.d:0 "Can be built through events in overseas regions including the Canary Islands, Africa, North America, South America, Central America, and the East Indies.  Only available while constructing a colony in a less desirable provinces with low native population such as an island.  Once built through an event, they can be upgraded by increasing their base production to 5.  Upgraded once they can train prostitutes including former slaves to remove their negative effects, and make them accessible to brothels elsewhere with an international district."
 cosmo_events.611.a:0 "Done."
 cosmo_events.611.b:0 "Return to Menu."
 cosmo_events.612.t:0 "Home Port brothels"
 cosmo_events.612.d:0 "Available to be built in a home port through events by rulers with a degeneracy of at least 100 and a center of trade of level 2 or greater.  Once built through events the brothel district can be visited by a monarch once every 6 months.  Building a World Port in the province will unlock the international district allowing you to hire any trained prostitutes from your port of pleasures to your home ports.  It will also allow you to recieve part of the brothel district's income or payment in other forms.  Both visiting the brothel and recieving reports are done through the decision window."
 cosmo_events.612.a:0 "Done."
 cosmo_events.612.b:0 "Return to Menu." 
 cosmo_events.602.t:0 "Barbary Pirate Slave Raids and Trade"
 cosmo_events.602.d:0 "If you have control over the Barbary Coast province of Mitidja, and a degenerate ruler you will get the option to re-open the slave market.  After this point you will be able to sell captured people into slavery through devastating a province to level 20 in wartime, or privateering in a trade node during peacetime with pirates controling 15% or more of the trade power.  Sending slaves to the Barbary market gives you ducats and increases the production of the province.  At different levels this will upgrade the slave market.  The first upgrade gives you access to the concubine trade wherein you can send a woman from the captured slave population present in the market to the Imperial Harem or other wealthy suitors.  Upgrading it a final time will allow you to build a secretive private harem in an overseas Muslim province such as in the East Indies.  You can then send concubines to this harem from captured peoples and prostitutes and visit it, though the journey takes some time and your country will be negatively affected should you suffer a stability drop or war while absent.  To build your own harem you must have first been invited to either the Ottoman Imperial Harem or to visit the Chinese Emperor's concubines."
 cosmo_events.602.a:0 "Done."
 cosmo_events.602.b:0 "Return to Menu."
 cosmo_events.603.t:0 "Harems and Concubines"
 cosmo_events.603.d:0 "Following a truce with the Ottoman empire in which you have equal to or greater prestige than the Ottomans you can get an invite to the Imperial Harem.   Should you accept every three years you will have a dream about the harem, after this point you can Send a maxed +25 Gift to the Ottomans through the diplomacy window to get another invitation.  You can also do this with Ming to access the Emperor's concubines.  An invitation also grants significant bonuses to these countries and leads to long term development of their capital as well as trade bonuses and mercenary benefits."
 cosmo_events.603.a:0 "Done."
 cosmo_events.603.b:0 "Return to Menu."
 cosmo_events.604.t:0 "Affairs"
 cosmo_events.604.d:0 "A decision available for rulers over the age of 25. Multiple options for affairs including will exist but for now there is only the mistress.  She will grant only bonuses at the start with no risk for declining her, after she starts demanding things refusing her will have penalties but so will continuing the affair.  It will also have bonuses so it may be worth it, it only negatively affects legitimacy right now."
 cosmo_events.604.a:0 "Done."
 cosmo_events.604.b:0 "Return to Menu." 
 cosmo_events.7.t:0 "Chivalry"
 cosmo_events.7.d:0 "By making your heir an explorer or conquistador through the event at age 18 you are able to earn chivalry towards certain traits, special events tied to the heir also can unlock personal unions and other possibly nation changing decisions."
 cosmo_events.7.a:0 "Exploration"
 cosmo_events.7.b:0 "Women in History"
 cosmo_events.7.c:0 "Return to Menu"
 cosmo_events.701.t:0 "Exploration"
 cosmo_events.701.d:0 "Various points of interest around the world can be discovered by your heir.  Though he does not have to be the one to discover them for your map sailing him or marching him near the provinces will trigger them.  They can only be triggered once per campaign, and discovering one or multiple places will unlock boosts to your heir's monarch points and a modifier increasing your effective colonial and trade range."
 cosmo_events.701.a:0 "Done."
 cosmo_events.701.b:0 "Return to Menu"
 cosmo_events.702.t:0 "Women in History"
 cosmo_events.702.d:0 "Similar to exploration events your heir being present by ship as an explorer or attached to a land unit as a conquistador can launch events involving certain famous women throughout history, and some fictional ones as well."
 cosmo_events.702.a:0 "Anacaona"
 cosmo_events.702.b:0 "Done."
 cosmo_events.702.c:0 "Return to Menu"
 cosmo_events.703.t:0 "Anacaona"
 cosmo_events.703.d:0 "Anacaona can be rescued by your heir in an owned, or subject owned province in the Caribbean prior to 1503.  Your heir must be an event created explorer or conquistador attached to at least one light ship or infantry unit.  If you choose to allow your son to marry Anacaona soon after she will be taken back to the mainland where you will have to send your heir in pursuit.  Your heir will become a conquistador at this point if originally an explorer.  Travel to the Arawak capital, and defeat any rebels you might encounter to gain a personal union with Arawak." 
 cosmo_events.703.a:0 "Arawak personal union"
 cosmo_events.703.b:0 "Done." 
 cosmo_events.703.c:0 "Return to Menu"
 cosmo_events.704.t:0 "Aiding the Arawak"
 cosmo_events.704.d:0 "Assist the Arawak by developing one of their provinces to a total of 10 or more development and you can reform them into a kingdom gaining cores on other Amazon areas and receiving a significant boost to income and technology." 
 cosmo_events.704.a:0 "Done."
 cosmo_events.704.b:0 "Return to Menu"  
 cosmo_events.8.t:0 "Colonization"
 cosmo_events.8.d:0 "Indentured Servants"
 cosmo_events.8.a:0 "Indentured Servants"
 cosmo_events.8.b:0 "Slavery"
 cosmo_events.8.c:0 "Native assimilation"
 cosmo_events.8.7:0 "Ports of Pleasure"
 cosmo_events.8.8:0 "Return to Menu"
 cosmo_events.801.t:0 "Indentured Servants"
 cosmo_events.801.d:0 "Unruly provinces with unrest of 5 or greater have a chance to spawn an event giving you the option to send Indentured Servants to your colonies.  You must have at least one colony being built.  You can also opt to force defeated rebels to become indentured servants in your colonies, and this can stack with the bonus to colonist chance from the indentured servants taken from provinces with unrest.  While choosing to make rebels indentured servants can cause another rebellion in the short term it will reduce unrest significantly into the future."
 cosmo_events.801.a:0 "Done."
 cosmo_events.801.b:0 "Return to Menu"
 cosmo_events.802.t:0 "Slavery"
 cosmo_events.802.d:0 "Provinces with Slaves and a center of trade now act as slave markets.  This will allow you to capture slaves in war, by devastating provinces, or at sea privateering a trade node to 15% or greater.  Captured slaves increase the production of the province, and can be sent to colonial provinces increasing their settler chance and future trade good production.  At level 5 production you can upgrade the market through an event so that you no longer have to actively capture slaves for them to be available to be sent to colonies.  Once you or your subjects have at least one slave owning province in Africa you will get the option to expand slavery into Asia and the Americas once you or your subjects own provinces there.  This is done through a decision."
 cosmo_events.802.a:0 "Done."
 cosmo_events.802.b:0 "Return to Menu"
 cosmo_events.803.t:0 "Native Assimilaton"
 cosmo_events.803.d:0 "Once every 5 years one of your colonies being built in a province with a high native population may recieve an event allowing you to either intermarry with the natives or attack them and seize their women.  This grows the colony instantly, but can have negative effects depending on your choice."
 cosmo_events.803.a:0 "Done." 
 cosmo_events.803.b:0 "Return to Menu"  
 cosmo_events.1001.t:0 "The Dance of the Seven Veils"
 cosmo_events.1001.d:0 "A performer in your country has an act she calls The Dance of Salome, it is a sensual and revealing act recounting how Salome daughter of King Herodias danced before Herod enticing him to give him the head of John the Baptist.  One of our recruiters suggested hiring the woman to perform her act at events meant to drive up recruitment of officers among the upper classes.  In his version of the act Salome represents our enemy's queen flaunting her body shamelessly in an order to attract men to fight for her husband.  Why this would not lead them to join their army instead I do not know.  But he assures me the act is quite good and should leave onlookers with an impression of the excitement and exotic adventures that await in the [Root.Monarch.GetTitle]'s army."
 cosmo_events.1001.a:0 "Hire her." 
 cosmo_events.1001.b:0 "We do not need her."  