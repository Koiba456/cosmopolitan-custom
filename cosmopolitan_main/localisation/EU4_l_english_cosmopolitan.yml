 cosmo_pirate_kingdom:0 "Pirate Kingdom"
 cosmo_council_of_captains_reform:0 "Council of Captains"
 cosmo_council_of_captains_reform_desc:0 "The Pirate Republic should be governed by the will of its greatest captains. It is their alliance that holds our nation together, and so their decisions must take precedence over any other authority."
 cosmo_articles_of_agreement_reform:0 "Articles of Agreement"
 cosmo_articles_of_agreement_reform_desc:0 "The Articles of Agreement are the cornerstone of the social order on board a pirate ship. They guarantee that every crewman has an equal vote in all matters and an equal share of all plunder. Articles such as these should be established for the Republic itself, so that the liberty and equality of all pirates is secured."
 cosmo_war_against_the_world_doctrine_reform:0 "War Against the World Doctrine"
 cosmo_war_against_the_world_doctrine_reform_desc:0 "The tyrants of the world must be unseated! We can no longer tolerate kings and despots making slaves of our fellow man. And so we shall adopt a new doctrine: war against the world!"
 cosmo_smugglers_haven_reform:0 "Smugglers Haven"
 cosmo_smugglers_haven_reform_desc:0 "A pirate enterprise cannot function without a way to sell their stolen goods. We must ensure that conditions in the Republic are favorable for smuggling operations." 
 cosmo_black_market_consortium_reform:0 "Black Market Consortium"
 cosmo_black_market_consortium_reform_desc:1 "The pirates that run amok in the Republic cannot be trusted to bathe themselves, let alone to govern a nation whose future hands on the edge of a cutlass. A Consortium formed of the most influential black market merchants shall be established as its true governors. Profit must come before liberty."
 cb_cosmo_war_against_the_world:0 "War Against the World"
 cb_cosmo_war_against_the_world_desc:0 "All the world brands us monsters; we will fight them all to protect our liberty!" 
