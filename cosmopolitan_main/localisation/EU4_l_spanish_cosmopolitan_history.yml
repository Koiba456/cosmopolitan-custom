 cosmo_events.999.t:0 "Update 0.932 or later"
 cosmo_events.999.d:0 "This update removes any permanent madam modifiers, and replaces them with timed ones.  It also fixes some subject countries that may have no official religion at all (giving them the religion of their capital province)"
 cosmo_events.999.a:0 "okay"
 cosmo_events.999.b:0 "don't apply fix"
 cosmo_history_events.41.t:0 "The Window to Japan"
 cosmo_history_events.4.d:0 "While much of Japan remains closed to foreign traders [historyprovince.GetCapitalName] in [historyprovince.GetName] has been selected to possibly open its port to the traders of [foreigntrader.GetName].  Doing so would surely give [Root.GetName] a market to the world outside of Japan but it would open us to foreign influence and may draw the ire of our more isolationist neighbors."
 cosmo_history_events.4.a:0 "Designate an area of [historyprovince.GetCapitalName] for [foreigntrader.GetAdjective] traders"
 cosmo_history_events.4.b:0 "We do not need these foreigners"
 cosmo_history_events.42.t:0 "The Window to Japan"
 cosmo_history_events.42.d:0 "While much of Japan remains closed to foreign traders [historyprovince.GetCapitalName] in [historyprovince.GetName] has been selected by [shoguncountry.Monarch.GetTitle] [shoguncountry.Monarch.GetName] of the [shoguncountry.GetName] to possibly open its port to the traders from [ROOT.GetName].  Doing so would give Japan a market to the outside world.  It would also provide [Root.GetName] the opportunity to grow its influence as an intermediary between Japan and foreign trade."
 cosmo_history_events.42.a:0 "[historyprovince.GetCapitalName] will be a window to Japan"
 cosmo_history_events.42.b:0 "[Root.GetName] does not need the [shoguncountry.Monarch.GetTitle]'s permission to trade in our province"
 cosmo_history_events.101.t:0 "A sacrifice on Mount Bromo"
 cosmo_history_events.101.d:0 "[Root.GetName] has decided as a gesture of good will to provide a sacrifice in honor of [sacrificecountry.Monarch.GetTitle] [sacrificecountry.Monarch.GetName]  of the [sacrificecountry.GetAdjective]./n According to legend a Majapahit princess and her husband Roro Anteng their lives threatened took refuge n the upper slopes of Mount Bromo. The couple and their followers later settled in the Tengger mountains and ruled the region jointly under the title Purbawisesa Mangkurat Ing Tengger. Under their leadership Tenngerese people settled and began to flourish, but the couple remained childless. Therefore, they meditated atop Mount Bromo, beseeching the mountain gods for assistance. The gods granted them 24 children on the condition that the 25th child must be thrown into the volcano as human sacrifice. The gods’ request was observed, and so the tradition of offering sacrifices thrown into the volcano to appease the deities continues until today.  The court in [Root.Capital.GetCapitalName] has many suitable candidates the [Root.GovernmentName] might be willing to sacrifice for such a momentous occasion in honor of the [sacrificecountry.GetAdjective] [sacrificecountry.GovernmentName]."
 cosmo_history_events.101.a:0 "Sacrifice [Root.Monarch.GetTitle] [Root.Monarch.GetName]"
 cosmo_history_events.101.b:0 "Sacrifice [Root.Heir.GetTitle] [Root.Heir.GetName]"
 cosmo_history_events.101.c:0 "Sacrifice the Royal Consort"
 cosmo_history_events.101.7:0 "Sacrifice the [Root.Monarch.GetTitle]'s advisor, [Root.Adm_Advisor.GetName]"
 cosmo_history_events.101.8:0 "Sacrifice the [Root.Monarch.GetTitle]'s advisor, [Root.Dip_Advisor.GetName]"
 cosmo_history_events.101.9:0 "Sacrifice the [Root.Monarch.GetTitle]'s advisor, [Root.Mil_Advisor.GetName]"
 cosmo_history_events.101.10:0 "Sacrifice one of the [Root.Monarch.GetTitle]'s concubines"
 cosmo_history_events.101.11:0 "Sacrifice one of the [Root.Monarch.GetTitle]'s wives"
 cosmo_history_events.101.12:0 "Sacrifice a [Root.GetAdjective] prostitute"
 cosmo_history_events.101.13:0 "Actually, [Root.GetName] has no one to spare"
