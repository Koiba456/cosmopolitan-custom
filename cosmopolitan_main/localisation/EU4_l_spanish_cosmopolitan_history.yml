 cosmo_history_events.905.t:0 "A plot in the royal court"
 cosmo_history_events.904.t:0 "Assert [Root.GetAdjective]'s influence in [dignitarycountry.Capital.GetCapitalName]"
 cosmo_history_events.904.d:0 "[dignitarycountry.GetName] has long dominated [Root.GetName]'s affairs.  But due to the latest developments in [dignitarycountry.Capital.GetCapitalName], [Root.GetName] can perhaps turn the tables.  Those closest to power are sympathetic to our cause, and using their influence we can shift the balance of power in our alliance towards [Root.Capital.GetCapitalName]"
 cosmo_history_events.904.a:0 "[dignitarycountry.Monarch.GetTitle] [dignitarycountry.Monarch.GetName] will aid us"
 cosmo_history_events.904.b:0 "The Queen regent will aid us"
 cosmo_history_events.904.c:0 "Let's keep our current arrangement"


