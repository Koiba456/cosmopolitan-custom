 cosmo_brothelspy_events.9100.d:0 "Our spy in [spycountry.Capital.GetCapitalName], can exploit her connection to [spycountry.CosmoSpySeduced] to erode and finally sever the alliance between the two countries.  It is likely that [spycountry.GetName]'s allies will be upset by the ploy, but in the end our spy is convinced she will be successful in driving a wedge between the two."
