 COSMO_AWAITING_ORDERS_TRIGGER:0 "Awaiting Orders"
 cosmo_brothelspy_events.81.t:0 "Hidden event to remove monarch seduction"
 cosmo_brothelspy_events.81.d:0 "This event will be hidden in a future update.  It is to remove the opinion modifier that tracks who your prostitute has seduced.  You should only get this if a monarch you have seduced has died.  If you get think you got this at an inappropriate time let me know and send a copy of the save game, or an earlier save if possible."
 cosmo_brothelspy_events.82.t:0 "Hidden event to remove cardinal seduction"
 cosmo_brothelspy_events.82.d:0 "This event will be hidden in a future update.  It is to remove the opinion modifier that tracks who your prostitute has seduced.  You should only get this if a cardinal you have seduced has died.  If you get think you got this at an inappropriate time let me know and send a copy of the save game, or an earlier save if possible."
 cosmo_brothelspy_events.2001.t:0 "Insert a Spy in [spycountry.Capital.GetCapitalName]"
 cosmo_brothelspy_events.2001.d:0 "Our spy network in [spycountry.GetName] believes they could insert one of our spies into the court of the [spycountry.Monarch.GetTitle] itself.  From here [Root.GetName] could attempt to undermine our enemy from within, or merely to use their knowledge of the court to expand our spy network in the country."
 cosmo_brothelspy_events.2001.a:0 "Select a suitable spy"
 cosmo_brothelspy_events.2001.b:0 "Cancel our plans" 
 cosmo_brothelspy_events.90.t:0 "Insert a Spy"
 cosmo_brothelspy_events.90.d:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] has many enemies, and likes to keep tabs on even some of [Root.Monarch.GetHerHis] closest friends.  [Root.Monarch.GetSheHe] believes that the bedroom is the best place to obtain closely held information or manipulate someone into aiding [Root.GetName]'s best interests.  Our spy networks believe they can insert the right candidate into a position where she is certain to attract the attention of those who hold the keys to our enemies deepest secrets and vulnerabilities."
