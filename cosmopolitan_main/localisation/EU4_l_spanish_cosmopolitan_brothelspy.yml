 cosmo_brothelspy_events.9902.d:0 "Our spy network have been gathering information on the garrison commanders of several key forts in [spycountry.GetName], and the general.  They believe that it would be a simple task to have one of the women familiar with [Root.GetName]'s operations establish herself within the nearby community where camp followers and prostitutes often arrive and leave again.  Using our intelligence she can then seduce the officer and once close to him can manipulate him into revealing weaknesses in their defences or even convincing him to defect entirely."
