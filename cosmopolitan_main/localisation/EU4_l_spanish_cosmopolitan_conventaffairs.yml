 cosmo_conventaffairs_events.300.d:0 "The [Root.Monarch.Dynasty.GetName] are patrons of one of the most lauded and well kept convents located not far from [Root.Capital.GetCapitalName].  Young women from good families far beyond [Root.GetAdjective] borders can be found within its walls.  Fortunately, [Root.Monarch.GetTitle] [Root.Monarch.GetName] is such a pious [Root.Monarch.GetWomanMan] that [Root.Monarch.GetSheHe] regularly makes visits to the grounds to witness the salvation and godly pursuits of the nuns.[Root.Monarch.GetSheHe] always returns to court refreshed and full of vigor.  \n\nOn this visit [Root.Monarch.GetSheHe] has also returned with a companion who he has named a spiritual advisor to the crown.  The [Root.Monarch.GetTitle] demands she be given a position in court where she can be kept close at all times."
