 cosmo_conventaffairs_events.200.t:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] visits [Root.Capital.GetName]'s convent"
 cosmo_conventaffairs_events.200.d:0 "The [Root.Monarch.Dynasty.GetName] are patrons of one of the most lauded and well kept convents located not far from [Root.Capital.GetCapitalName].  Young women from good families far beyond [Root.GetAdjective] borders can be found within its walls.  Fortunately, [Root.Monarch.GetTitle] [Root.Monarch.GetName] is such a pious [Root.Monarch.GetWomanMan] that [Root.Monarch.GetSheHe] regularly makes visits to the grounds to witness the salvation and godly pursuits of the nuns.[Root.Monarch.GetSheHe] always returns to court refreshed and full of vigor."
 cosmo_conventaffairs_events.200.a:0 "As long as it keeps [Root.Monarch.GetHerHim] happy"
 cosmo_conventaffairs_events.200.b:0 "These affairs are a hinderance, we should put a stop to them"
