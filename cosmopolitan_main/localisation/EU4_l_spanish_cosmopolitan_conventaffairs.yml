 cosmo_conventaffairs_events.401.t:0 "Advisor from the Ooku"
 cosmo_conventaffairs_events.401.d:0 "The [Root.Monarch.GetTitle]'s favorite consort has become more than a personal confident for [Root.Monarch.GetHerHim].  [Root.Monarch.GetTitle] [Root.Monarch.GetName] has began to regularly seek her advice on matters of state, and feels that she is more qualified to serve as an advisor than [Root.Monarch.GetHerHis] current advisors."
 cosmo_conventaffairs_events.401.a:0 "As long as it keeps [Root.Monarch.GetHerHim] happy"
 cosmo_conventaffairs_events.401.b:0 "The [Root.GovernmentName] is not in need of a new advisor"  
 cosmo_conventaffairs_events.501.t:0 "[Root.Monarch.GetName] and [Root.Adm_Advisor.GetName] visit the convent"
 cosmo_conventaffairs_events.501.d:0 "The [Root.Monarch.Dynasty.GetName] are patrons of one of the most lauded and well kept convents located not far from [Root.Capital.GetCapitalName].  Young women from good families far beyond [Root.GetAdjective] borders can be found within its walls.  Fortunately, [Root.Monarch.GetTitle] [Root.Monarch.GetName] is such a pious [Root.Monarch.GetWomanMan] that [Root.Monarch.GetSheHe] regularly makes visits to the grounds to witness the salvation and godly pursuits of the nuns.[Root.Monarch.GetSheHe] always returns to court refreshed and full of vigor. \n\nJoining the [Root.Monarch.GetTitle] [Root.Monarch.GetHerHis] theological advisor [Root.Adm_Advisor.GetName] who herself once lived in the convent, and was eager to check in on her fellow nuns."
 cosmo_conventaffairs_events.501.a:0 "As long as it keeps [Root.Monarch.GetHerHim] happy"
 cosmo_conventaffairs_events.501.b:0 "As long as it keeps [Root.Monarch.GetHerHim] happy" 
 cosmo_conventaffairs_events.501.c:0 "These affairs are a hinderance, we should put a stop to them" 
