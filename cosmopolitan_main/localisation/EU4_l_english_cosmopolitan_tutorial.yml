 cosmo_tutorial_events.106.d:0 "Degeneracy \n  When you engage in degenerate behavior during a ruler's reign they gain degeneracy points.  These can be checked via the check degeneracy decision, and your degeneracy level is listed on many events that cause it to increase.  \n\nDegeneracy Penalties \n  As you reach different levels of degeneracy you have a chance of your monarch losing one or more monarch points."
