l_english:
 cosmo_tutorial_events.1.t:0 "Cosmopolitan Universalis"
 cosmo_tutorial_events.1.d:0 "Cosmopolitan adds several new features that you may miss or might be confusing during your first play through.  If you would like to turn on automatic tutorial events these will appear when you first encounter a new feature of the mod.  You can also access the complete tutorial at any time via a decision if you want to avoid the pop ups." 
 cosmo_tutorial_events.1.a:0 "Turn on tutorial events"
 cosmo_tutorial_events.1.b:0 "No tutorial events" 
 cosmo_tutorial_events.2.t:0 "Affair Tutorial"
 cosmo_tutorial_events.2.d:0 "Affairs are accessed via the Affairs in Court decision, while they have no upfront cost advisor affairs have a chance to cost you monarch power while side affairs only give a possible reward once a year. \n\nSide Affairs \n  Depending on your culture or religion you may have access to one or more side affairs specifically for your ruler.  These are yearly events that will give you an opportunity to earn a monarch point upgrade, a skilled advisor, or other unique bonuses depending on the affair type.  These can be stopped every year, at which point you can get a new type.  But you may only gain +1 permanent monarch points per type for your monarch from all side affairs. \n\nAdvisor affairs \n  Affairs between your ruler and one of his advisors, will grant you either a type specific bonus, usually a modifier that can stack up to three times or it will cause one of the two to be distracted from their work losing you administrative, diplomatic, or military points respectively." 
 cosmo_tutorial_events.2.a:0 "Close"
 cosmo_tutorial_events.2.b:0 "No more tutorial events"  
 cosmo_tutorial_events.3.t:0 "Prostitution Tutorial"
 cosmo_tutorial_events.3.d:0 "Brothel Districts are necessary to attract court prostitutes and unlock the Madams estate and its interactions.  Additional madams and brothel districts can attract more prostitutes to your court. \n\nBrothel Districts \n  Brothel districts can be built in any province with a level 2 center of trade.  A province that has both a brothel district and a level 3 center of trade can receive additional madam modifiers through use of the Import and Export Madam building actions to move additional madams there. \n\nMadam modifiers \n  Madams can be placed in any province with a brothel district and World Port or a Port of Pleasure as a province modifier giving +0.5 trade good size and +1 to their trade value.  Only one madam of a type can be placed in a province, and they last for 50 years.  Madams will appear and respawn in their home regions, can be sent elsewhere for a cost, or upgraded from New Prostitutes in one of your ports of pleasure during the event that appears.\n\nPorts of Pleasure \n These are available to be built on most tropical islands and many other low development but interesting or strategic areas.  It replaces the trade good with prostitutes, and can also come with a new prostitute modifier in many areas.  Investing in a port of pleasure to increase their trade power, for example by importing additional madams, can unlock a center of trade in the province.§!" 
 cosmo_tutorial_events.3.a:0 "Close"
 cosmo_tutorial_events.3.b:0 "No more tutorial events" 
 cosmo_tutorial_events.4.t:0 "Slave Trade and Bribing Slavers"
 cosmo_tutorial_events.4.d:0 "Slave traders can be bribed to cease raids on your provinces.  A subject, but one that will not grant tribute or aid you in your wars. \n\nOwning the provinces of Mitidia, Theodoro, or Sulu also allows you to releasing the city to sympathetic leaders and re-open its slave market.  Once active you can capture slaves for sale by privateering in any trade node to at least 10% of total power, or by devastating a province in war to at least level 20 even if you yourself do not have a slave market.  This also allows Europeans a way to fence other European slaves from their enemies in exchange for ducats."
 cosmo_tutorial_events.4.a:0 "Close"
 cosmo_tutorial_events.4.b:0 "No more tutorial events"  
 cosmo_tutorial_events.5.t:0 "Personal union tutorial"
 cosmo_tutorial_events.5.d:0 "Seeking Allies and Royal Match \n Personal unions can be formed with any country either by a Royal Match diplomatic action, or through one time pretender opportunities using the Seeking Allies decision during a war. Seeking allies can be turned on or off at any time to avoid these events when not seeking them in your occupied territory.  These personal unions do not automatically inherit, though Christian European personal unions formed through Royal Marriage still work the same as in vanilla and are untouched by the mod. \n\nPersonal Union interactions \n In addition to the subject actions, two diplomatic actions Militairy Aid and Economic Aid can be taken with personal union subjects.  \n\nPersonal Unions \nDuring the honeymoon your personal union may request help conquering unowned provinces of their primary culture.  Aiding them with this, or in creating a formable nation will earn you a large amount of trust.  You can also help them to build their army or navy to capacity, build additional fortifications in their capital, and help to develop their capital.  \n\nStrengthen Union \nPersonal Unions begin with varied but still limited options.  You can demand tribute, but you cannot set their military focus during times of war, or control their trade.  The strengthen union diplomatic action available at high trust levels gives both of these abilities as well as stops the personal union subject from considering the size of all your vassals in determining its own liberty desire, as well as prevents other vassal subjects from considering its strength in their own liberty desire." 
 cosmo_tutorial_events.5.a:0 "Close"
 cosmo_tutorial_events.5.b:0 "No more tutorial events" 
 cosmo_tutorial_events.6.t:0 "Degeneracy tutorial"
 cosmo_tutorial_events.6.d:0 "Degeneracy \n  When you engage in degenerate behavior during a ruler's reign they gain degeneracy points.  These can be checked via the check degeneracy decision, and your degeneracy level is listed on many events that cause it to increase.   \n Unlocking content \n\nDegeneracy Penalties \n  As you reach different levels of degeneracy you have a chance of your monarch losing one or more monarch points."
 cosmo_tutorial_events.6.a:0 "Close"
 cosmo_tutorial_events.6.b:0 "No more tutorial events" 
 cosmo_tutorial_events.111.t:0 "Anathanism Tutorial"
 cosmo_tutorial_events.111.d:0 "Once you have a province with European Madams which meets other requirements for propagate religion you will receive an event introducing Anathanism.  It will however not be able available to your country outside of a Madam's estate disaster. \n\nMadam's Estate Disaster \n  \nA Madams estate whose influence passes 100% will cause a disaster demanding that you act or suffer a harsh modifier.  Your options are to appease the Madams which will upset your other estates, or ban prostitutes from your court for a time.  A third option, offered if you have European prostitutes active in your court, and a province with European madams where you have a majority of trade power in its node.  Anathanism is its own religion group, and will receive heathen like penalties with all other religions.   \n\nConverting provinces \n  \nWhile you can use your missionaries, Anathanism has a trade node policy Propagate religion that works similarly to Islam's but is not restricted to Trade Company Regions.  Instead it is unlocked through a trade modifier given by the spread Anathanism madams estate interaction to a province in the trade node that is both Anathanist and contains a brothel district.\n\nChurch aspects \n\nLike protestants Anathanisms have access to various church aspects to spend their church power on."
 cosmo_tutorial_events.111.a:0 "Close"
 cosmo_tutorial_events.111.b:0 "No more tutorial events"  
 cosmo_tutorial_events.101.t:0 "Cosmopolitan 0.50 Beta"
 cosmo_tutorial_events.101.d:0 "Welcome to the beta of Cosmopolitan, there are probably a few bugs present still needed to be ironed out so be sure to report any suspicious mod behaviour on the loverslab forums or discord.\n   Would you like to turn on tutorial events?  This is recommended for your first playthrough with the new mod version." 
 cosmo_tutorial_events.101.a:0 "Turn on tutorial events"
 cosmo_tutorial_events.101.b:0 "No tutorial events" 
 cosmo_tutorial_events.102.t:0 "Affair Tutorial"
 cosmo_tutorial_events.102.d:0 "Affairs are accessed via the Affairs in Court decision, while they have no upfront cost advisor affairs have a chance to cost you monarch power while side affairs only give a possible reward once a year. \n\nSide Affairs \n  Depending on your culture or religion you may have access to one or more side affairs specifically for your ruler.  These are yearly events that will give you an opportunity to earn a monarch point upgrade, a skilled advisor, or other unique bonuses depending on the affair type.  These can be stopped every year, at which point you can get a new type.  But you may only gain +1 permanent monarch points per type for your monarch from all side affairs. \n\nAdvisor affairs \n  Affairs between your ruler and one of his advisors, will grant you either a type specific bonus, usually a modifier that can stack up to three times or it will cause one of the two to be distracted from their work losing you administrative, diplomatic, or military points respectively." 
 cosmo_tutorial_events.102.a:0 "Close"
 cosmo_tutorial_events.102.b:0 "Return to tutorial menu"  
 cosmo_tutorial_events.103.t:0 "Brothel District Tutorial"
 cosmo_tutorial_events.103.d:0 "Brothel Districts are necessary to attract court prostitutes and unlock the Madams estate and its interactions.  Additional madams and brothel districts can attract more prostitutes to your court. \n\nBrothel Districts \n  Brothel districts can be built in any province with a level 2 center of trade.  This changes the trade good in province to prostitutes and grants it a regionally appropriate madam though you will get a bonus to trade value depending on the original trade good.  A province that has both prostitute trade goods and a level 3 center of trade can receive additional madam modifiers through use of the Import and Export Madam building actions. \n\nMadam modifiers \n  Madams can be placed in any province with a brothel district and World Port or a Port of Pleasure as a province modifier giving +0.5 trade good size and +1 to their trade value.  Only one madam of a type can be placed in a province.  Madams can be found as the result of events, or upgraded from New Prostitutes in one of your ports of pleasure during the event that appears.\n\nPorts of Pleasure \n These are available to be built on most tropical islands and many other low development but interesting or strategic areas.  It replaces the trade good with prostitutes, and can also come with a new prostitute modifier in many areas.  Investing in a port of pleasure to increase their trade power, for example by importing additional madams, can unlock a center of trade in the province.§!" 
 cosmo_tutorial_events.103.a:0 "Close"
 cosmo_tutorial_events.103.b:0 "Return to tutorial menu" 
