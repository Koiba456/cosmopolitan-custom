 cosmo_tutorial_events.107.t:0 "Ports of Pleasure"
 cosmo_tutorial_events.107.d:0 "The Port of Pleasure building can only be built in certain areas, mostly islands and some coastal areas. \n\nLike a brothel district you can Establish Madams in the province, giving additional trade bonuses and allowing the prostitute to be chosen for Entertain actions.\n\nA Port of Pleasure which reaches a high level of trade power can even spawn a Center of Trade.  One way to accomplish this is to establish a number of madams from different areas to the province. \n\nPorts of Pleasure can also be opened to Pirates if any exist in the node whether your own or someone else's.  Certain provinces in the world can even spawn Pirate Nations."
 cosmo_tutorial_events.107.a:0 "Pirates of the Carribean"
 cosmo_tutorial_events.107.b:0 "Pirates Elsewhere in the World"
 cosmo_tutorial_events.107.c:0 "Return to Tutorial Menu"
 cosmo_tutorial_events.108.t:0 "Pirates of the Carribean"
 cosmo_tutorial_events.108.d:0 "While any port of pleasure can be opened to pirates, allowing for your ruler to have affairs with pirates and giving a small bonus while also angering some of its non-allied neighbors certain provinces can also receive an event to spawn a pirate nation which you can then accept as a subject of yours."
 cosmo_tutorial_events.108.a:0 "Port Royal"
 cosmo_tutorial_events.108.b:0 "New Providence"
 cosmo_tutorial_events.108.c:0 "Tortuga"
 cosmo_tutorial_events.108.7:0 "Return to Tutorial Menu"
 cosmo_tutorial_events.109.t:0 "Pirates Elsewhere in the World"
 cosmo_tutorial_events.109.d:0 "While any port of pleasure can be opened to pirates, allowing for your ruler to have affairs with pirates and giving a small bonus while also angering some of its non-allied neighbors certain provinces can also receive an event to spawn a pirate nation which you can then accept as a subject of yours.\n\nPalembang can be handed over to Chinese pirates via decision if they are your subject, and is also able to adopt a dynasty via decision as your subject or while playing with them."
 cosmo_tutorial_events.109.a:0 "Palembang"
 cosmo_tutorial_events.109.b:0 "Pattani"
 cosmo_tutorial_events.109.c:0 "Libertatia"
 cosmo_tutorial_events.109.8:0 "Rugen"
 cosmo_tutorial_events.109.7:0 "Return to Tutorial Menu"
 cosmo_tutorial_events.902.t:0 "Cosmopolitan 0.988 Patch"
 cosmo_tutorial_events.902.d:0 "This should fix it so all subject types are properly assigned and work with the events and recent changes to personal union subjects."
 cosmo_tutorial_events.902.a:0 "Okay"
