 cosmo_menabrothel_events.6523.b:0 "She is an inspiration to us all" 
 cosmo_menabrothel_events.6131.t:0 "Prostitutes in [Root.Capital.GetCapitalName]"
 cosmo_menabrothel_events.6131.d:0 "These women would fit in among the elegant Tayu at home in the famed Yoshiwara, Maruyama or Shimabara districts in one of Japan's most renowned establishments.  Here in [Root.Capital.GetCapitalName] they are in high demand as entertainment for the wealthiest and most powerful.  The [Root.GetAdjective] [Root.GovernmentName] sees great value in their use in persuading those in power when other forms of persuasion prove insufficient." 
 cosmo_menabrothel_events.6131.a:0 "Yewande from Tunis"
 cosmo_menabrothel_events.6131.b:0 "Dinara from Algiers"
 cosmo_menabrothel_events.6131.c:0 "Isabel from Granada"
 cosmo_menabrothel_events.6131.7:0 "[Root.Monarch.GetName] would like to see who else is available" 
 cosmo_menabrothel_events.6231.t:0 "Yewande from Tunis"
 cosmo_menabrothel_events.6231.d:0 "Yewande, originally from Tunis, is a favourite of many high profile clientele in [Root.Capital.GetCapitalName] since becoming one of the more celebrated courtesans in the capital.\n\n[Root.HeirOrAdvisor3] \n\n[Root.ProstituteReward]" 
 cosmo_menabrothel_events.6231.a:0 "For the good of [Root.CosmoTheName][Root.GetName]"
 cosmo_menabrothel_events.6231.b:0 "For the good of [Root.CosmoTheName][Root.GetName]"
 cosmo_menabrothel_events.6331.t:0 "An introduction to the Tsutsui"
 cosmo_menabrothel_events.6331.d:0 "Yewande has relatives back in Japan whom she believes could get word to a low ranking member of the Daimyo if [Root.Monarch.GetName] [Root.Monarch.GetName] desired it.  Such an introduction could allow [Root.GetName] to get a firmer foothold in the area.  Willing partners can always be found when the trade is appealing enough."
