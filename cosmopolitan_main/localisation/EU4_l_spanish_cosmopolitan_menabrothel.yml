 cosmo_menabrothel_events.101.t:0 "Attracting new prostitutes to [Root.Capital.GetCapitalName]"
 cosmo_menabrothel_events.101.d:0 "Prostitutes from the region are becoming quite popular in [Root.GetName].[Root.ARABMenaMadams][Root.PERMenaMadams][Root.TURMenaMadams][Root.NAMenaMadams].  For now the clientele in [Root.Capital.GetCapitalName] will have to make due with those already in the city."
 cosmo_menabrothel_events.101.a:0 "See who else is available"
 cosmo_menabrothel_events.101.b:0 "View all our options"
 cosmo_menabrothel_events.101.c:0 "Cancel plans"
 cosmo_menabrothel_events.30.t:0 "Prostitutes in the Capital"
 cosmo_menabrothel_events.6101.t:0 "Prostitutes in [Root.Capital.GetCapitalName]"
 cosmo_menabrothel_events.6101.d:0 "These women would fit in among the elegant Tayu at home in the famed Yoshiwara, Maruyama or Shimabara districts in one of Japan's most renowned establishments.  Here in [Root.Capital.GetCapitalName] they are in high demand as entertainment for the wealthiest and most powerful.  The [Root.GetAdjective] [Root.GovernmentName] sees great value in their use in persuading those in power when other forms of persuasion prove insufficient." 
 cosmo_menabrothel_events.6101.a:0 "Nabila from Halab"
 cosmo_menabrothel_events.6101.b:0 "Zahra from Damascus"
 cosmo_menabrothel_events.6101.c:0 "Yasmin from Aden"
 cosmo_menabrothel_events.6101.7:0 "See who else is available" 
 cosmo_menabrothel_events.6201.t:0 "Nabila from Halab"
 cosmo_menabrothel_events.6201.d:0 "Nabila , originally from Halab, is one of the more celebrated courtesans in the capital, and is highly sought after making her a useful ally to the [Root.GovernmentName].\n\n[Root.HeirOrAdvisor3] \n\n[Root.ProstituteReward]" 
 cosmo_menabrothel_events.6201.a:0 "For the good of [Root.CosmoTheName][Root.GetName]"
 cosmo_menabrothel_events.6201.b:0 "For the good of [Root.CosmoTheName][Root.GetName]"
 cosmo_menabrothel_events.6301.t:0 "An introduction to the Otomo"
 cosmo_menabrothel_events.6301.d:0 "Nabila has relatives back in Japan whom she believes could get word to a low ranking member of the Daimyo if [Root.Monarch.GetName] [Root.Monarch.GetName] desired it.  Such an introduction could allow [Root.GetName] to get a firmer foothold in the area.  Willing partners can always be found when the trade is appealing enough."
 cosmo_menabrothel_events.6301.a:0 "See if she really can arrange a meeting"
 cosmo_menabrothel_events.6301.b:0 "See if she really can arrange a meeting"
 cosmo_menabrothel_events.6501.t:0 "Proselytizing in [convertprovince.GetName]"
 cosmo_menabrothel_events.6501.d:0 "Nabila has arrived in [convertprovince.GetName] and it did not take long for her to acquaint herself with the local brothel's prostitutes and patrons.  The prostitutes practically leapt at the opportunity to abandon a faith which had so harshly condemned them as sinners, and many have become eager missionaries themselves for the faith, whispering into the ears of their satisfied clients."
 cosmo_menabrothel_events.6501.a:0 "She is an inspiration to us all"
 cosmo_menabrothel_events.6501.b:0 "She is an inspiration to us all"
