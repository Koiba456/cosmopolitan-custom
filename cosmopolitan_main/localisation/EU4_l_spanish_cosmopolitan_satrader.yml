 cosmo_satrader_events.101.b:0 "Sacrifice [Root.Heir.GetTitle] [Root.Heir.GetName]"
 cosmo_satrader_events.101.c:0 "Sacrifice the Royal Consort"
 cosmo_satrader_events.101.7:0 "Sacrifice the [Root.Monarch.GetTitle]'s advisor, [Root.Adm_Advisor.GetName]"
 cosmo_satrader_events.101.8:0 "Sacrifice the [Root.Monarch.GetTitle]'s advisor, [Root.Dip_Advisor.GetName]"
 cosmo_satrader_events.101.9:0 "Sacrifice the [Root.Monarch.GetTitle]'s advisor, [Root.Mil_Advisor.GetName]"
 cosmo_satrader_events.101.10:0 "Sacrifice one of the [Root.Monarch.GetTitle]'s concubines"
 cosmo_satrader_events.101.11:0 "Sacrifice one of the [Root.Monarch.GetTitle]'s wives"
 cosmo_satrader_events.101.12:0 "Sacrifice a [Root.GetAdjective] prostitute"
 cosmo_satrader_events.101.13:0 "Actually, [Root.GetName] has no one to spare"
