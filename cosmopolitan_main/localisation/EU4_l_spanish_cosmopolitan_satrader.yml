 cosmo_satrader_events.101.t:0 "A sacrifice on Mount Bromo"
 cosmo_satrader_events.101.d:0 "[Root.GetName] has decided as a gesture of good will to provide a sacrifice in honor of [sacrificecountry.Monarch.GetTitle] [sacrificecountry.Monarch.GetName]  of the [sacrificecountry.GetAdjective]./n According to legend a Majapahit princess and her husband Roro Anteng their lives threatened took refuge n the upper slopes of Mount Bromo. The couple and their followers later settled in the Tengger mountains and ruled the region jointly under the title Purbawisesa Mangkurat Ing Tengger. Under their leadership Tenngerese people settled and began to flourish, but the couple remained childless. Therefore, they meditated atop Mount Bromo, beseeching the mountain gods for assistance. The gods granted them 24 children on the condition that the 25th child must be thrown into the volcano as human sacrifice. The gods’ request was observed, and so the tradition of offering sacrifices thrown into the volcano to appease the deities continues until today.  The court in [Root.Capital.GetCapitalName] has many suitable candidates the [Root.GovernmentName] might be willing to sacrifice for such a momentous occasion in honor of the [sacrificecountry.GetAdjective] [sacrificecountry.GovernmentName]."
