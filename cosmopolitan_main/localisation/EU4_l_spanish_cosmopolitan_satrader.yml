l_spanish:
 cosmo_satrader_events.2.t:0 "Seal trade deal with a [tradecountry.GetAdjective] marriage"
 cosmo_satrader_events.2.d:0 "[Root.GetName] has made some progress in establishing trade ties in the region, but our merchant believes that in order to earn the local's trust we must observe certain [tradecountry.Culture.GetName] traditions.  A marriage between [Root.GetName]'s main trader in the area and a local woman would show a lasting commitment to the area, and could do a great deal to open otherwise closed opportunities to foreigners like ourselves.  Beyond the demonstration of our commitment these women have proven vital in providing help with translation, and with smoothing over relations with representatives from her people."
 cosmo_satrader_events.2.a:0 "Seek ties in the Capital province"
 cosmo_satrader_events.2.b:0 "Seek ties in one of [tradecountry.GetName]'s provinces"
 cosmo_satrader_events.2.c:0 "Seek ties with the [tradecountry.Culture.GetName] in the frontier"
 cosmo_satrader_events.2.7:0 "There are non ties worth pursuing"
 cosmo_satrader_events.20.t:0 "[tradecountry.Culture.GetName] Ties"
 cosmo_satrader_events.20.d:0 "The [Root.GetAdjective] traders have been working among the [tradecountry.Culture.GetName] in the region for some time now to identify provinces where we can expand our influence and forge new ties with the local people."
 cosmo_satrader_events.20.a:0 "The [tradecountry.Culture.GetName] in [traderwife1.GetName]"
 cosmo_satrader_events.20.b:0 "The [tradecountry.Culture.GetName] in [traderwife2.GetName]"
 cosmo_satrader_events.20.c:0 "The [tradecountry.Culture.GetName] in [traderwife3.GetName]"
 cosmo_satrader_events.20.7:0 "The [tradecountry.Culture.GetName] in [traderwife4.GetName]" 
 cosmo_satrader_events.20.8:0 "The [tradecountry.Culture.GetName] in [traderwife5.GetName]" 
 cosmo_satrader_events.20.9:0 "The [tradecountry.Culture.GetName] in [traderwife6.GetName]" 
