 cosmo_satrader_events.20.11:0 "The [tradecountry.Culture.GetName] in [traderwife8.GetName]" 
 cosmo_satrader_events.20.12:0 "The [tradecountry.Culture.GetName] in [traderwife9.GetName]" 
 cosmo_satrader_events.20.13:0 "The [tradecountry.Culture.GetName] in [traderwife10.GetName]" 
 cosmo_satrader_events.20.14:0 "There are no suitable options" 
 cosmo_satrader_events.30.t:0 "The [Root.GetAdjective] Trader's [traderprovince.Culture.GetName] Wife"
 cosmo_satrader_events.30.d:0 "The [Root.GetAdjective] Trader's new wife has intimate knowledge of [traderprovince.GetName], it's people, and local trade.  [Root.GetName] can leverage her insight as well as her ability to ease relations with the local [traderprovince.Culture.GetName]." 
 cosmo_satrader_events.30.a:0 "Build ties among the local [traderprovince.Culture.GetName]." 
 cosmo_satrader_events.30.b:0 "Establish trade in [traderprovince.GetName]." 
 cosmo_satrader_events.30.c:0 "Sell arms to the local [traderprovince.Culture.GetName]." 
 cosmo_satrader_events.30.7:0 "It's not worth it." 
 cosmo_satrader_events.110.t:0 "The [Root.GetAdjective] Trader's [traderprovince.Culture.GetName] Wife"
 cosmo_satrader_events.110.d:0 "The [traderprovince.Culture.GetName] woman has been invaluable in helping [Root.GetName] to establish the necessary local connections in order to advance our trade interests in [traderprovince.GetName].  [Root.GetAdjective] gold and goods flows throughout the province, and [traderprovince.GetTradeGoodsName] goods from [traderprovince.GetName] is being sent back to our own markets." 
 cosmo_satrader_events.110.a:0 "[Root.GetName] continues to expand its influence"
