l_english:
 cosmo_pirateaffairs_events.200.t:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] and the Pirates"
 cosmo_pirateaffairs_events.200.d:0 "The [Root.Monarch.GetTitle]'s interest in all things to do with the pirates of [popprovince.GetRegionName] has led to beneficial financial arrangements with many enterprising privateers who frequent the port and brothels of [popprovince.GetName].  Appreciative of their generous patron they have sent some of their finest ambassadors to show their gratitude to [Root.Monarch.GetTitle] [Root.Monarch.GetName]."
 cosmo_pirateaffairs_events.200.a:0 "As long as it keeps [Root.Monarch.GetHerHim] happy"
 cosmo_pirateaffairs_events.200.b:0 "These affairs are a hinderance, we should put a stop to them"
