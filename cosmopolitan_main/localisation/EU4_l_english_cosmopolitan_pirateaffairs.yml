 cosmo_pirateaffairs_events.300.t:0 "A Pirate for an Advisor?"
 cosmo_pirateaffairs_events.300.d:0 "The [Root.Monarch.GetTitle]'s interest in all things to do with the pirates of [popprovince.GetRegionName] has led to beneficial financial arrangements with many enterprising privateers who frequent the port and brothels of [popprovince.GetName].  Appreciative of their generous patron they have sent a fitting ambassador to show their gratitude to [Root.Monarch.GetTitle] [Root.Monarch.GetName].  The [Root.Monarch.GetTitle] has demanded his guest be immediately that they be given a suitable position in [Root.Monarch.GetHerHis] administration."
 cosmo_pirateaffairs_events.300.a:0 "As long as it keeps [Root.Monarch.GetHerHim] happy"
 cosmo_pirateaffairs_events.300.b:0 "These affairs are a hinderance, we should put a stop to them"
