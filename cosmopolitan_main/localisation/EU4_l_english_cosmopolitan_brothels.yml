 cosmo_brothel_events.1001.t:0 "[Root.Monarch.GetName] blackmails the clergy"
 cosmo_brothel_events.1001.d:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] plans to use [Root.GetName]'s new position in the brothel district to pressure madams to reveal any sensitive information that could be useful in negotiations with prominent members of the clergy.  While [Root.Monarch.GetName] would pass no judgement on these men for their proclivities, others in their organization may not.  Armed with this information the [Root.Monarch.GetTitle] can put at end to certain demands being pushed by hypocritical priests."
 cosmo_brothel_events.1001.a:0 "This is a good use of our leverage"
 cosmo_brothel_events.1001.b:0 "We should leave them be"  
 cosmo_brothel_events.4.t:0 "The Serenissima and the brothel districts of the Rialto"
 cosmo_brothel_events.4.d:0 "While we embrace the reality and the usefulness of our new brothels other cities already have a long history with such establishments, traditions, and celebrated locales.  Perhaps none more than the city of Venice which boasts not one but several well organized and regulated red-light districts and muncipal brothels.  Among the more famous locations are the Ponte delle Tette, the bridge of tits, where prostitutes are encouraged to advertise their goods.  All in all, there are over 11,000 working courtesans in the city according to the recent census."
 cosmo_brothel_events.4.a:0 "We have some competition" 
 cosmo_brothel_events.3.t:0 "A fascination with the natives"
 cosmo_brothel_events.3.d:0 "Back at home the [Root.GetAdjective] are obsessed with news from the New World and the native peoples we have encountered there.  A brothel owner wishes to take advantage of this and has has asked permission to open several brothels catering to clientele curious about the women in these new lands.  He swears he is offering an authentic experience, and that the women are all definitely natives from the area."
 cosmo_brothel_events.3.a:0 "Sounds interesting"
 cosmo_brothel_events.3.b:0 "Not here"
