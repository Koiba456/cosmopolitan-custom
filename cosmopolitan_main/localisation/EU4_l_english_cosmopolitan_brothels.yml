 cosmo_psort_events.7.t:0 "Opportunities away from [Root.Capital.GetCapitalName]"  
 cosmo_psort_events.7.d:0 "While they certainly are of use to [Root.GetName] present near court the loyal prostitutes of [Root.Capital.GetCapitalName] are unfortunately privy to many of the [Root.GovernmentName]'s secrets.  Perhaps we could maintain their loyalty while reducing their influence on [Root.GetAdjective] affairs by helping them become established elsewhere far away from court."  
 cosmo_psort_events.7.a:0 "[Root.GetName] will finance an establishment"  
 cosmo_psort_events.7.b:0 "The local authorities in [prostituteprovince.GetName] will ensure she is established"  
 cosmo_psort_events.7.8:0 "We should reconsider"  
 cosmo_psort_events.71.t:0 "Further Opportunities away from [Root.Capital.GetCapitalName]"  
 cosmo_psort_events.71.d:0 "[Root.GetName] could help establish other brothels, furthering the reach of madams loyal to our government and spreading their influence thinner."  
 cosmo_psort_events.71.a:0 "Find another province"  
 cosmo_psort_events.71.8:0 "That is enough for now" 
