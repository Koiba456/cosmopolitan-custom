 cosmo_brothel_events.91.t:0 "Prostitutes at Court"
 cosmo_brothel_events.91.d:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName]'s court in the capital [Root.Capital.GetCapitalName] is the center of power and authority within the [Root.GovernmentName].  Here prostitutes employed to further the interests of of [Root.GetName] can provide both comfort and enticement for the [Root.Monarch.GetTitle] and [Root.Monarch.GetHerHis] advisors to better attend to their duties in [Root.GetName]."
 cosmo_brothel_events.91.a:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName]"
 cosmo_brothel_events.91.b:0 "The [Root.Monarch.GetTitle]'s administrative advisor [Root.Adm_Advisor.GetName]" 
 cosmo_brothel_events.91.c:0 "The [Root.Monarch.GetTitle]'s diplomatic advisor [Root.Dip_Advisor.GetName]" 
 cosmo_brothel_events.91.7:0 "The [Root.Monarch.GetTitle]'s military advisor [Root.Mil_Advisor.GetName]" 
 cosmo_brothel_events.91.8:0 "Nevermind" 
 cosmo_brothel_events.1.t:0 "Expanding the brothel district"
 cosmo_brothel_events.1.d:0 "[exportprovince.GetName]'s Madams have their eyes on more successful ventures in other ports.  Though they have made a fortune from the many [Root.GetAdjective] sailors and others who frequent the port the most profitable brothels are in one of [Root.GetName]'s famed brothel districts.  Of course, [Root.GetAdjective] officials have final say over the approval of any new establishments in the district but rumor has it that [Root.Monarch.GetTitle] [Root.Monarch.GetName] has shown interest [Root.Monarch.GetHerHim]self in the prospect."
