 cosmo_brothel_events.6.t:0 "Prostitutes in the Steppe" 
 cosmo_brothel_events.6.d:0 "As [Root.Capital.GetCapitalName] and other cities throughout the [Root.GovernmentName] prosper and attract new trade there is a demand for women in these places.  Having sanctioned the construction of a brothel district we have several madams seeking to sign a contract with the [Root.Monarch.GetTitle] to provide prostitutes throughout the region." 
 cosmo_brothel_events.6.a:0 "Chinese prostitutes" 
 cosmo_brothel_events.6.b:0 "Korean prostitutes" 
 cosmo_brothel_events.6.c:0 "European prostitutes" 
 cosmo_brothel_events.6.7:0 "Muslim prostitutes" 
 cosmo_brothel_events.6.8:0 "We will move madams here ourselves if at all" 
 cosmo_brothel_events.7.t:0 "Prostitutes serving the [Root.GetAdjective] Army" 
 cosmo_brothel_events.7.d:0 "The [Root.GetAdjective] Army is certainly appreciative of both the ready availability and quality of the women sent by the [Root.Monarch.GetTitle].  Recruitment is at an all time high and considering all the perks that come with serving [Root.GetName] it appears that our men are more motivated to stay in the good graces of their commanding officers and to move up the ranks whenever possible.  War is certainly hell, but for these men away from the fighting the [Root.GovernmentName] takes care of their every need." 
 cosmo_brothel_events.7.a:0 "Serving the [Root.GetAdjective] Army" 
