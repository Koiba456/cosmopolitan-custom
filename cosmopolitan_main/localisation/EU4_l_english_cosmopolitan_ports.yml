 cosmo_pleasure_events.2001.t:0 "The port in [portofpleasure.GetName] prospers"
 cosmo_pleasure_events.2001.d:0 "The experiment seems to have paid off.  The port here in [portofpleasure.GetName] is teaming year round with ships, and not just our own ships but those of merchants from many nations.  The brothels are prospering as well, and have begun to amass some reputation among sailors of the region.  As predicted this may certainly help guide more ships to our port over that of our competition."
 cosmo_pleasure_events.2001.a:0 "That is excellent news"
 cosmo_pleasure_events.2002.t:0 "A request of aid from [portofpleasure.GetName]"
 cosmo_pleasure_events.2002.d:0 "The madams and tradesmen of [portofpleasure.GetName] are united in the opinion that their colony is a shining pearl in the seas of the region but that pearl is not being given the attention they feel it deserves.  With just a little assistance they claim that they can grow into a real draw for all those who pass these waters.  In return for your assistance they promise to give special consideration to [Root.GetAdjective] vessels and once the renovations are completed perhaps your army or navy could be enticed to perform manoeuvres nearby and take advantage of the port's ample supply of just about anything a military force could desire."
 cosmo_pleasure_events.2002.a:0 "We can spare some resources"
 cosmo_pleasure_events.2002.b:0 "They are on their own" 
 cosmo_pleasure_events.2003.t:0 "[portofpleasure.GetName] can handle any load"
 cosmo_pleasure_events.2003.d:0 "The development of  [portofpleasure.GetName] can definitely be seen.  The harbor has been dredged to allow for even the largest of our ships to easily make port, and in considerable number.  The number of brothels and inns on the island as well as a suitable area nearby for any parties to large to stay in town to set up camp.  Indeed there is little this port could not handle and everyone from the madams to the tavern keeps plan to lure as many paying customers in as possible.  But with all the construction and preparations they could use with one final small loan to cover the costs of properly informing their necessarily clients they are open for their business."
 cosmo_pleasure_events.2003.a:0 "A worthwhile investment"
 cosmo_pleasure_events.2003.b:0 "Not a venture we can afford at this time"
 cosmo_pleasure_events.2004.t:0 "[portofpleasure.GetName] is world famous"
 cosmo_pleasure_events.2004.d:0 "Much has changed since its humble beginnings as a simple supply depot and maritime brothel for passing sailors and tradesmen.  In the years since the small outpost has grown into a bustling city.  It is rumoured that in its brothels one can find a beautiful woman from every city on Earth.  Every day ships full of merchants, sailors, and no small amount of travellers here purely for their own leisure dock in its harbour.  Everyone who visit goes home singing the praises of the wild and magical time they spent in [portofpleasure.GetName] and promising to return."
 cosmo_pleasure_events.2004.a:0 "They deserve to be celebrated"
 cosmo_pleasure_events.2004.b:0 "We don't have time for these upstart merchants" 
 cosmo_pleasure_events.711.t:0 "A profitable brothel needs a capable madam" 
 cosmo_pleasure_events.711.d:0 "The issue is not necessarily that these women are not suited for a [Root.GetAdjective] brothel, but they will need a proper madam to oversee the establishment and keep it up to the standards of our brothel districts.  The local madam of one of the more successful establishments here in [portofpleasure.GetName] can attempt to lure some of them to work in one of her brothels until she can find an ambitious candidate to set up their own independent operation.  Perhaps in a few years, or a decade." 
 cosmo_pleasure_events.711.a:0 "[portofpleasure.GetName] is vital, [Root.Adm_Advisor.GetName] will oversee it" 
 cosmo_pleasure_events.711.b:0 "[portofpleasure.GetName] is vital, [Root.Dip_Advisor.GetName] will oversee it" 
 cosmo_pleasure_events.711.c:0 "[portofpleasure.GetName] is vital, [Root.Mil_Advisor.GetName] will oversee it" 
 cosmo_pleasure_events.711.7:0 "I'm sure they will work it out themselves" 
 cosmo_pleasure_events.712.t:0 "[Root.Adm_Advisor.GetName] in [portofpleasure.GetName]" 
 cosmo_pleasure_events.712.d:0 "[Root.Adm_Advisor.GetName] remains in [portofpleasure.GetName] in search of  a solution to the port's issue with unregulated prostitution.  Apparently the issue is more complicated than it might seem, and [Root.Adm_Advisor.GetName] has requested additional funds to support their efforts in getting the lay of the land in [portofpleasure.GetName], and consulting with all the necessary authorities on the subject at hand." 
 cosmo_pleasure_events.712.a:0 "This attention to detail is impressive" 
 cosmo_pleasure_events.712.7:0 "Recall [Root.Adm_Advisor.GetName] to court" 
