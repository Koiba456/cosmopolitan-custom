 cosmo_pleasure_events.139.t:0 "Pirates have seized [popprovince.GetName]" 
 cosmo_pleasure_events.139.d:0 "[popprovince.GetName] has been seized by the pirates we offered haven to.  They have overthrown the local government and installed themselves as rulers of the area.  Madams in the port loyal to [Root.GetName] have helped us identify the main groups responsible in case we wish to negotiate with them.  Otherwise, we will seek to reclaim our lands." 
 cosmo_pleasure_events.139.11:0 "Give them control in exchange for an oath of fealty"  
 cosmo_pleasure_events.139.12:0 "Give them control in exchange for an oath of fealty"  
 cosmo_pleasure_events.139.13:0 "Give them control in exchange for an oath of fealty"  
 cosmo_pleasure_events.139.20:0 "Consider our other options"                       
 cosmo_pleasure_events.230.12:0 "Open [popprovince.GetName] to the pirates" 
 cosmo_pleasure_events.230.13:0 "Deny the pirates access to [popprovince.GetName]" 
 cosmo_pleasure_events.230.t:0 "The Price of Prostitutes" 
 cosmo_pleasure_events.230.d:0 "The price of prostitutes has gone up as more areas have laxed their positions against the practice in order to pull back some profits from the black market and allow its entrepreneurs to reach for their potential .  The result most clients and workers alike agree is a higher quality and generally safer experience for all.  Those countries who have embraced a more open stance are positioned to take full advantage of from this booming industry positioned to profit from the great rush of unwed men and women through ports like [Root.GetName]'s." 
 cosmo_pleasure_events.230.a:0 "[Root.GetName] will benefit from this" 
 cosmo_pleasure_events.231.t:0 "The Price of Prostitutes" 
 cosmo_pleasure_events.231.d:0 "The price of prostitutes has gone up as more areas have laxed their positions against the practice in order to pull back some profits from the black market and allow its entrepreneurs to reach for their potential .  The result most clients and workers alike agree is a higher quality and generally safer experience for all.  Those countries who have embraced a more open stance are positioned to take full advantage of from this booming industry positioned to profit from the great rush of unwed men and women through ports like [Root.GetName]'s." 
 cosmo_pleasure_events.231.a:0 "[Root.GetName] will benefit from this"  
 cosmo_pleasure_events.24.t:0 "A retreat for [Root.GetName]'s soldiers" 
 cosmo_pleasure_events.24.d:0 "[Root.Mil_Advisor.GetName] has been lobbying you for what they claim is a much needed reprieve for [Root.GetName]'s brave soldiers.  Their rigorous training and our high demands creates a disciplined soldier, but pride in service should also be valued in our forces.  Such a retreat could be an excellent means of showing our appreciation for our armed forces and helping to forge bonds among new recruits so that all may hopefully look back more fondly on their service despite what [Root.GetName] demands of them." 
 cosmo_pleasure_events.24.a:0 "We will consider the proposal" 
 cosmo_pleasure_events.24.b:0 "Ridiculous" 
 cosmo_pleasure_events.240.t:0 "Retreat at [pleasureprovince.GetName]" 
 cosmo_pleasure_events.240.d:0 "[Root.GetAdjective] soldiers, both among the officer corps and rank-and-file are certainly appreciative of [Root.Monarch.GetTitle] [Root.Monarch.GetName]'s generosity in providing them with the month long shore leave in [pleasureprovince.GetName].  The islands businesses are overflowing with [Root.GetAdjective] gold and the brothels' madams are certainly appreciative of not only today's business, but that will come in the years to come as the men spread word of the exotic port and its many amenities." 
 cosmo_pleasure_events.240.a:0 "[Root.GetName] takes care of her own"  
 cosmo_pleasure_events.26.t:0 "[pleasureprovince.GetName] is a hotbed for Anathanism" 
 cosmo_pleasure_events.26.d:0 "Anathanists among the prostitutes at [pleasureprovince.GetName] have began converting some of their fellow brothel workers and clientele to the one true faith.  With some additional investments we could turn the province into a beacon spreading Anathanism in the region." 
 cosmo_pleasure_events.26.a:0 "We may look into it" 
 cosmo_pleasure_events.210.t:0 "Prostitutes arrive in [pleasureprovince.GetName]" 
 cosmo_pleasure_events.210.d:0 "[pleasureprovince.TradeCompany] has grown to the point that it regularly receives all manner of trade in the region.  Prostitutes are no different as many locals flock to the region to take advantage of the desperate and captive clientele in [pleasureprovince.GetName]'s port." 
 cosmo_pleasure_events.210.a:0 "As long as they don't cause unrest"
