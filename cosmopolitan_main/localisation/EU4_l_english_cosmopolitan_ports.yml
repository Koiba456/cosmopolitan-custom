 cosmo_pleasure_events.1391.t:0 "Changing the [Root.GetName] Flag" 
 cosmo_pleasure_events.1391.d:0 "Ever since Chinese Pirates seized control of [Root.Capital.GetCapitalName] we have expanded the reach of [Root.GetName] beyond a mere port, and into a power of its own in the region.  Many now say that we should turn our eyes on China, that the [chineseemperor.Owner.GetAdjective] [chineseemperor.Owner.Monarch.GetTitle] [chineseemperor.Owner.Monarch.GetName] is unfit for the throne.  For all [Root.Monarch.GetSheHe] has accomplished, why not [Root.Monarch.GetTitle] [Root.Monarch.GetName]  By claiming our dynasty we can increase our prestige, but may risk angering the [chineseemperor.Owner.Monarch.GetTitle]." 
