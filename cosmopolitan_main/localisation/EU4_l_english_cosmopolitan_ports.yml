 cosmo_pleasure_events.854.d:0 "[Root.Mil_Advisor.GetName] remains in [portofpleasure.GetName] in search of  a solution to the port's issue with unregulated prostitution.  Apparently the issue is more complicated than it might seem, and [Root.Mil_Advisor.GetName] has requested additional funds to support their efforts in getting the lay of the land in [portofpleasure.GetName], and consulting with all the necessary authorities on the subject at hand." 
 cosmo_pleasure_events.854.a:0 "This attention to detail is impressive" 
 cosmo_pleasure_events.854.7:0 "Recall [Root.Mil_Advisor.GetName] to court"  
 cosmo_pleasure_events.8511.t:0 "A new madam in [portofpleasure.GetName]" 
 cosmo_pleasure_events.8511.d:0 "The search is over, and construction is already underway for the new brothel in the port of [portofpleasure.GetName].  Seeing someone from a similar background in charge has overcome the initial reluctance of many of the women who had refused the move to the brothels and attempted to ply their trade on their own.  Overnight, the reduction in [portofpleasure.GetName]'s crime has been noticeable and the port is a safer and more orderly place for all." 
 cosmo_pleasure_events.8511.a:0 "More profitable as well" 
