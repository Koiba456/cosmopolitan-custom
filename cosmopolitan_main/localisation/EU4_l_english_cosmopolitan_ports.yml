 cosmo_pleasure_events.801.t:0 "A profitable brothel needs a capable madam" 
 cosmo_pleasure_events.801.d:0 "The issue is not necessarily that these women are not suited for a [Root.GetAdjective] brothel, but they will need a proper madam to oversee the establishment and keep it up to the standards of our brothel districts.  The local madam of one of the more successful establishments here in [portofpleasure.GetName] can attempt to lure some of them to work in one of her brothels until she can find an ambitious candidate to set up their own independent operation.  Perhaps in a few years, or a decade." 
 cosmo_pleasure_events.801.a:0 "[portofpleasure.GetName] is vital, [Root.Adm_Advisor.GetName] will oversee it" 
 cosmo_pleasure_events.801.b:0 "[portofpleasure.GetName] is vital, [Root.Dip_Advisor.GetName] will oversee it" 
 cosmo_pleasure_events.801.c:0 "[portofpleasure.GetName] is vital, [Root.Mil_Advisor.GetName] will oversee it" 
 cosmo_pleasure_events.801.7:0 "I'm sure they will work it out themselves" 
 cosmo_pleasure_events.802.t:0 "[Root.Adm_Advisor.GetName] in [portofpleasure.GetName]" 
 cosmo_pleasure_events.802.d:0 "[Root.Adm_Advisor.GetName] remains in [portofpleasure.GetName] in search of  a solution to the port's issue with unregulated prostitution.  Apparently the issue is more complicated than it might seem, and [Root.Adm_Advisor.GetName] has requested additional funds to support their efforts in getting the lay of the land in [portofpleasure.GetName], and consulting with all the necessary authorities on the subject at hand." 
 cosmo_pleasure_events.802.a:0 "This attention to detail is impressive" 
 cosmo_pleasure_events.802.7:0 "Recall [Root.Adm_Advisor.GetName] to court" 
