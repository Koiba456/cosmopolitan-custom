 cosmo_pleasure_events.9123.t:0 "The allure of [brothelprovince.GetName]"  
 cosmo_pleasure_events.9123.d:0 "Though quite successful, having become quite an attraction all on its own, the madam in charge of one of our brothels believes the operation has outgrown the remote outpost.  She views her best fortunes being in the brothel district of [brothelprovince.GetName]."  
 cosmo_pleasure_events.9123.a:0 "[Root.GetAdjective] ports would welcome her"  
 cosmo_pleasure_events.9123.b:0 "We need her to stay put for now"  
