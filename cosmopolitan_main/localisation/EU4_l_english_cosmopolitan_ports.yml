 cosmo_pleasure_events.13111.t:0 "A new madam in [portofpleasure.GetName]" 
 cosmo_pleasure_events.13111.d:0 "The search is over, and construction is already underway for the new brothel in the port of [portofpleasure.GetName].  Seeing someone from a similar background in charge has overcome the initial reluctance of many of the women who had refused the move to the brothels and attempted to ply their trade on their own.  Overnight, the reduction in [portofpleasure.GetName]'s crime has been noticeable and the port is a safer and more orderly place for all." 
