 cosmo_pleasure_events.1312.t:0 "[Root.Adm_Advisor.GetName] in [portofpleasure.GetName]" 
 cosmo_pleasure_events.1312.d:0 "[Root.Adm_Advisor.GetName] remains in [portofpleasure.GetName] in search of  a solution to the port's issue with unregulated prostitution.  Apparently the issue is more complicated than it might seem, and [Root.Adm_Advisor.GetName] has requested additional funds to support their efforts in getting the lay of the land in [portofpleasure.GetName], and consulting with all the necessary authorities on the subject at hand." 
 cosmo_pleasure_events.1312.a:0 "This attention to detail is impressive" 
 cosmo_pleasure_events.1312.7:0 "Recall [Root.Adm_Advisor.GetName] to court" 
