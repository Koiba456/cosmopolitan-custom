 cosmo_pleasure_events.12123.t:0 "The search continues" 
 cosmo_pleasure_events.12123.d:0 "Despite the expense and attention of our most trusted advisor, a week has passed and still our advisor has failed to produce a suitable candidate to solve [portofpleasure.GetName]'s problem of wanton street prostitution.  We must find a candidate who can convince these women freely of the benefits of registering and working through an approved and established brothel.  The problem will continue to persist until then." 
 cosmo_pleasure_events.12123.a:0 "They seems hard at work"  
 cosmo_pleasure_events.1311.t:0 "A profitable brothel needs a capable madam" 
 cosmo_pleasure_events.1311.d:0 "The issue is not necessarily that these women are not suited for a [Root.GetAdjective] brothel, but they will need a proper madam to oversee the establishment and keep it up to the standards of our brothel districts.  The local madam of one of the more successful establishments here in [portofpleasure.GetName] can attempt to lure some of them to work in one of her brothels until she can find an ambitious candidate to set up their own independent operation.  Perhaps in a few years, or a decade." 
