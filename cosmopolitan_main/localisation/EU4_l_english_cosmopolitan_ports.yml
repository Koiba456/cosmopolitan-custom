 cosmo_pleasure_events.1.t:0 "New opportunities for an old trade"
 cosmo_pleasure_events.1.d:0 "With much of [Root.GetName]'s focus turning to the seas and the distant lands that lay beyond there is no shortage of people looking to cash in on the opportunity.  One merchant has come forward seeking to purchase a sizeable stake within any otherwise undesirable island or port province.  Provinces that lack soil suitable for valuable crops and which contain no gemstones or valuable metals.  All he claims he needs is a suitable place to anchor ships, for long periods if needed.  Here he will build much more than just a mere supply depot, he will create a shining oasis where those long at sea can enjoy tastes from home and the gifted touch of the most intoxicating women.  The competition would stand no chance."
 cosmo_pleasure_events.1.a:0 "These Ports of pleasure sound lucrative"
 cosmo_pleasure_events.8.t:0 "Piracy in Palembang"
 cosmo_pleasure_events.8.d:1 "Palembang has fallen far from its time as capital of the great Srivijaya empire. The city has been abandoned by the collapsed Majapahit kingdom and for decades has been plagued by Chinese pirates who use the port as a base for their smuggling operations. When Admiral Zheng He weighed anchor in the city during his expeditions, he drove out the pirates and appointed Shi Jinqing to rule the city. But Zheng He and Shi Jinqing are now dead, and the pirates have to begun to gather once again. Left unchecked they will surely attempt to retake seize the city."
 cosmo_pleasure_events.8.a:0 "A pirate's life for Palembang!"
 cosmo_pleasure_events.8.b:0 "They will no longer find refuge in Palembang." 
 cosmo_pleasure_events.25.t:0 "Port of Pleasure built"
 cosmo_pleasure_events.250.t:0 "Port of Pleasure destroyed"
 cosmo_pleasure_events.25.d:0 "[pleasureprovince.GetName] has recently completed construction of a port of pleasure.  Encouraging a safe and welcoming environment for brothels will pay great dividends in increasing local trade.  Adventurous madams can amass a fortune and a name for themselves, one that could carry them to a prominent place in the high streets of [Root.GetName]'s finest brothel districts."
 cosmo_pleasure_events.25.a:0 "A much needed refuge"
 cosmo_pleasure_events.22.t:0 "[Root.GetName]'s famed port in [pleasureprovince.GetName]"
 cosmo_pleasure_events.22.d:0 "Much has changed since its humble beginnings as a simple supply depot and maritime brothel for passing sailors and tradesmen.  In the years since the small outpost has grown into a bustling city.  It is rumoured that in its brothels one can find a beautiful woman from every city on Earth.  Every day ships full of merchants, sailors, and no small amount of travellers here purely for their own leisure dock in its harbour.  Everyone who visit goes home singing the praises of the wild and magical time they spent in [pleasureprovince.GetName] and promising to return."
 cosmo_pleasure_events.22.a:0 "[Root.GetName] will rule trade in the area" 
 cosmo_pleasure_events.21.t:0 "Prostitutes arrive in [pleasureprovince.GetName]" 
 cosmo_pleasure_events.21.d:0 "[pleasureprovince.TradeCompany] has grown to the point that it regularly receives all manner of trade in the region.  Prostitutes are no different as many locals flock to the region to take advantage of the desperate and captive clientele in [pleasureprovince.GetName]'s port." 
 cosmo_pleasure_events.21.a:0 "As long as they don't cause unrest" 
 cosmo_pleasure_events.23.t:0 "The Price of Prostitutes" 
 cosmo_pleasure_events.23.d:0 "The price of prostitutes has gone up as more areas have laxed their positions against the practice in order to pull back some profits from the black market and allow its entrepreneurs to reach for their potential .  The result most clients and workers alike agree is a higher quality and generally safer experience for all.  Those countries who have embraced a more open stance are positioned to take full advantage of from this booming industry positioned to profit from the great rush of unwed men and women through ports like [Root.GetName]'s." 
 cosmo_pleasure_events.23.a:0 "[Root.GetName] will benefit from this" 
 cosmo_pleasure_events.11.t:0 "Pirates arrive in [popprovince.GetName]" 
 cosmo_pleasure_events.11.d:0 "The brothels of [popprovince.GetName] have long helped attract ships and trade to the area, but the latest ships to sail into port carried aboard privateers who have been terrorizing the entirety of the [popprovince.GetRegionName] region.  These rowdy pirates have a great deal of coin to spend however and some among the local merchants and authorities are willing to turn a blind eye.  Welcoming them, however could anger others in the area whose ships they plunder." 
 cosmo_pleasure_events.11.12:0 "Open the port to the pirates" 
 cosmo_pleasure_events.11.13:0 "Our ports are closed to these criminals" 
 cosmo_pleasure_events.13.t:0 "Pirates have seized [popprovince.GetName]" 
 cosmo_pleasure_events.13.d:0 "[popprovince.GetName] has been seized by the pirates we offered haven to.  They have overthrown the local government and installed themselves as rulers of the area.  Madams in the port loyal to [Root.GetName] have helped us identify the main groups responsible in case we wish to negotiate with them.  Otherwise, we will seek to reclaim our lands." 
