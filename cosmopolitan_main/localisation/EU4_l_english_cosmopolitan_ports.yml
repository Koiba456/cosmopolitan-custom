 cosmo_pleasure_events.10123.d:0 "Despite the expense and attention of our most trusted advisor, a week has passed and still our advisor has failed to produce a suitable candidate to solve [portofpleasure.GetName]'s problem of wanton street prostitution.  We must find a candidate who can convince these women freely of the benefits of registering and working through an approved and established brothel.  The problem will continue to persist until then." 
 cosmo_pleasure_events.10123.a:0 "They seems hard at work"   
 cosmo_pleasure_events.1021.t:0 "A profitable brothel needs a capable madam" 
 cosmo_pleasure_events.1021.d:0 "The issue is not necessarily that these women are not suited for a [Root.GetAdjective] brothel, but they will need a proper madam to oversee the establishment and keep it up to the standards of our brothel districts.  The local madam of one of the more successful establishments here in [portofpleasure.GetName] can attempt to lure some of them to work in one of her brothels until she can find an ambitious candidate to set up their own independent operation.  Perhaps in a few years, or a decade." 
 cosmo_pleasure_events.1021.a:0 "[portofpleasure.GetName] is vital, [Root.Adm_Advisor.GetName] will oversee it" 
 cosmo_pleasure_events.1021.b:0 "[portofpleasure.GetName] is vital, [Root.Dip_Advisor.GetName] will oversee it" 
 cosmo_pleasure_events.1021.c:0 "[portofpleasure.GetName] is vital, [Root.Mil_Advisor.GetName] will oversee it" 
 cosmo_pleasure_events.1021.7:0 "I'm sure they will work it out themselves" 
 cosmo_pleasure_events.1022.t:0 "[Root.Adm_Advisor.GetName] in [portofpleasure.GetName]" 
 cosmo_pleasure_events.1022.d:0 "[Root.Adm_Advisor.GetName] remains in [portofpleasure.GetName] in search of  a solution to the port's issue with unregulated prostitution.  Apparently the issue is more complicated than it might seem, and [Root.Adm_Advisor.GetName] has requested additional funds to support their efforts in getting the lay of the land in [portofpleasure.GetName], and consulting with all the necessary authorities on the subject at hand." 
 cosmo_pleasure_events.1022.a:0 "This attention to detail is impressive" 
 cosmo_pleasure_events.1022.7:0 "Recall [Root.Adm_Advisor.GetName] to court" 
