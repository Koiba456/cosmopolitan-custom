 cosmo_pleasure_events.7111.t:0 "A new madam in [portofpleasure.GetName]" 
 cosmo_pleasure_events.7111.d:0 "The search is over, and construction is already underway for the new brothel in the port of [portofpleasure.GetName].  Seeing someone from a similar background in charge has overcome the initial reluctance of many of the women who had refused the move to the brothels and attempted to ply their trade on their own.  Overnight, the reduction in [portofpleasure.GetName]'s crime has been noticeable and the port is a safer and more orderly place for all." 
 cosmo_pleasure_events.7111.a:0 "More profitable as well" 
 cosmo_pleasure_events.7112.t:0 "[Root.Adm_Advisor.GetName] in [portofpleasure.GetName]" 
 cosmo_pleasure_events.7112.d:0 "Though the search for a new madam continues, [Root.Adm_Advisor.GetName] has felt particularly inspired by their time in [portofpleasure.GetName].  They have made breakthroughs in their work they claim was inspired by the much needed vacation.  When they return to [Root.Monarch.GetTitle] [Root.Monarch.GetName]'s court rested and refreshed they assure the [Root.Monarch.GetTitle] their work on behalf of the [Root.GetAdjective] [Root.GovernmentName] will show for it." 
