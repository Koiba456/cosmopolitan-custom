 cosmo_events.11.t:0 "Allowing Prostitution in [Root.GetName]"  
 cosmo_events.11.d:0 "From ports outside our [Root.GovernmentName] our traders have come into contact with many women who offer their companionship for a fee.  This is a quite lucrative trade, but also one that the [Root.Monarch.GetTitle] and others in [Root.GetName] could gain from.  During these intimate transactions many customers find themselves quite vulnerable, to either be more easily persuaded or particularly exploited."  
