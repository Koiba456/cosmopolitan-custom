 cosmo_estateadvisors_events.998.t:0 "Hidden event to remove estate land"
 cosmo_estateadvisors_events.998.d:0 "If you see this often let me know - La Mancha.  This event should remove land given to mistress/wives/ooku/forbidden palace/harem or madams estates when you gain new land.  If you get it randomly or very often then something is probably wrong.  This event should be hidden."
