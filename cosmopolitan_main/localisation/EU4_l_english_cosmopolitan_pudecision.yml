 cosmo_incan_nation_title:0 "Tawantinsuyu, the Empire of the Incas"
 cosmo_incan_nation_desc:0 "Once one of many small regional kingdoms our subject's state now holds land in all the four regions of the Andes. Their kingdom has transformed into something greater, a mighty empire of many peoples united under a strong class of rulers. To their subjects they are simply their overlords, the Incas."