l_english:  
 cosmo_discovering_allies_maps_tt:0 "Our ally has shared their maps of this land"
 cosmo_end_pu_affair_title:0 "End Advisor Affair"
 cosmo_end_pu_affair_desc:0 "put an end to our affair with an advisor of one of our personal unions"
 cosmo_form_great_yuan_title:0 "Form Great Yuan"
 cosmo_form_great_yuan_desc:0 "Our subject the heirs of Kublai Khan once ruled over allChinese and Mongol lands. Let them rise to reclaim the legacy of the old Yuan and crush the weaker lineages that have attempted to claim the Empire that is their birthright!" 
 cosmo_restore_mongol_empire_title:0 "Restore the Mongol Empire"
 cosmo_restore_mongol_empire_desc:0 "The empire of Genghis Khan has fallen, broken into many parts. We must help restore his legacy by replicating the Great Khan's conquests. We will help our allies reconquer the Mongol Empire!" 
 cosmo_manchu_nation_1_title:0 "Support Manchu Identity"
 cosmo_manchu_nation_1_desc:0 "With the three capitals of the ancient Jurchen tribes firmly in their hands, it is now time for our allies to proclaim their people's unification through the adoption of a new identity: Manchu." 
 cosmo_form_manchu_dynasty_title:0 "Qing Dynasty"
 cosmo_form_manchu_dynasty_desc:0 "We have taken the Northern Capital and defeated the false emperors. The Middle Kingdom must be united under a Manchu banner. The Manchu's dynasty shall reign for a thousand years!" 
 cosmo_mughal_nation_title:0 "Form Mughal Empire"
 cosmo_mughal_nation_desc:0 "Our subjects have begun to lay the foundation of their new empire. Although inferior in numbers, their well-disciplined troops have managed to achieve several decisive victories against the Sultans of India. With time, the empire of the Mughals could stretch over the larger part of the Indian plateau." 
 cosmo_irish_nation_title:0 "Form Irish Nation"
 cosmo_irish_nation_desc:0 "Uniting the Irish lands under a sole flag would make them a formidable ally capable of repelling invaders." 
 cosmo_unite_japan_title:0 "Unite Japan!"
 cosmo_unite_japan_desc:0 "The time has come to unite Japan! Our allies have seized control of Kyoto and declared themselves rulers of all Japan.  The time for diplomacy is over and all these warring daimyo lords must be conquered." 
 cosmo_georgia_nation_title:0 "Unite Georgia"
 cosmo_georgia_nation_desc:0 "Ever since the abdication of Alexander I Georgia has been divided and devastated by in-fighting. This has allowed other countries to control the internal politics of the region and oppress our people.\nThe time has come to once again unite the Georgian people and reforge the kingdom that was once lost!" 
 cosmo_russian_nation_title:0 "Form Russian Nation"
 cosmo_russian_nation_desc:0 "Through conquest and diplomacy Russia has managed to transform from a mere settlement into a dominant principality. After several eastern expeditions the Mongol hordes have finally been subdued and a centralized Russian state, ruled under the suzerainty of the Tsar, is emerging. Influences from Western Europe are helping us modernize and reform our nation and Western style of education is being adopted." 
 cosmo_persian_nation_title:0 "Form Persian Nation"
 cosmo_persian_nation_desc:0 "At the mere age of 15, $MONARCH$ has taken his father's position as head of the Shiite Turkmen tribe. He has quickly established a base of power in the northwest and proclaimed himself Shah of Iran. Several of the neighboring regions have been conquered and the possibility of a resurrected Iranian nation doesn't seem so absent anymore." 
 cosmo_armenia_nation_title:0 "Kingdom of Armenia"
 cosmo_armenia_nation_desc:0 "The Kingdom of Armenia once dominated the Caucasus. Time was not kind to our ancestors, however, and neighboring empires saw weakness in our internal divisions and used it to conquer our people. Let us drive out these invaders and re-establish the Kingdom and Church of Armenia." 
 cosmo_french_nation_title:0 "Form French Nation"
 cosmo_french_nation_desc:0 "Our allies now maintain a tight grip on what was once France.  By aiding to restore the nation to its former glory, we can manage to transform them once again into one of the most dominant powers of Europe." 
 cosmo_restore_sweden_title:0 "Form Sweden"
 cosmo_restore_sweden_desc:0 "Years after King Eric had been deposed and fled to the island, Gotland once again has a chance to win back the Swedish throne.  By aiding to restore the nation to its former glory, we can help rebuild one of the great powers in Northern Europe."  
 cosmo_maya_nation_title:0 "Reunite the League of Mayapan"
 cosmo_maya_nation_desc:0 "Once all Maya states of importance fought under the same banner. Let us recreate the League of Mayapan and put the petty conflicts that once shattered the confederation behind us." 
 cosmo_english_nation_title:0 "Form English Nation"
 cosmo_english_nation_desc:0 "Trade has long been a foundation of English national policy. By extending their influence across borders and controlling its political development domestically, they could manage to become one of the foremost European powers." 
 cosmo_dipevents_events.301.t:0 "Deliver their new army"
 cosmo_sendadmadvisor_events.1.t:0 "Advisor sent by Overlord"
 cosmo_sendadmadvisor_events.10.t:0 "Sending our [sendadvisor.CosmoAdmAdvisorCulture] Advisor to [receiveadvisor.GetName]"
 cosmo_sendadmadvisor_events.10.d:0 "[sendadvisor.Adm_Advisor.GetName] has served [Root.GetName] well in [sendadvisor.Adm_Advisor.GetHerHis] time at court in [sendadvisor.Capital.GetCapitalName] while serving as an advisor to [sendadvisor.Monarch.GetTitle] [sendadvisor.Monarch.GetName].  Having earned the [sendadvisor.GovernmentName]'s trust there is no one better to send to help oversee [receiveadvisor.GetName]'s development.  Of course it was decided that [sendadvisor.Adm_Advisor.GetHerHis] name be altered in official records merely to avoid any misonceptions about the independence of the [receiveadvisor.Monarch.GetTitle] in [receiveadvisor.Capital.GetCapitalName] should it be discovered that one of [sendadvisor.GetName]'s own advisors is helping shape [receiveadvisor.GetAdjective] policy at the highest level."
 cosmo_sendadmadvisor_events.10.a:0 "We wish [sendadvisor.Adm_Advisor.GetHerHim] the best"
