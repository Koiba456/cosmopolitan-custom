 cosmo_honeymoonevents.1.t:0 "The Honeymoon"
 cosmo_honeymoonevents.1.d:0 "Your new wife wishes to properly get to know you and has suggested the two of you travel so you can have the necessary privacy to ensure the future of your rule."
 cosmo_honeymoonevents.1.a:0 "Matters of state can wait."
 cosmo_honeymoonevents.100.t:0 "A Bachelor Monarch"
 cosmo_honeymoonevents.100.d:0 "You are as yet unmarried, and this is quite frankly unacceptable now.  To cement your legacy as monarch you must sire an heir as soon as possible, but first you will have to marry.  A royal marriage with one of our allies or subjects, or a match with a powerful noble family could all aid us in solidifying your rule. Or perhaps you have a more unconvential match in mind."
 cosmo_honeymoonevents.100.a:0 "Explore a match with an allied nation."
 cosmo_honeymoonevents.100.b:0 "Marry a member of a noble family." 
 cosmo_honeymoonevents.100.9:0 "Marry a member of a noble family." 
 cosmo_honeymoonevents.100.10:0 "Marry a member of a noble family."  
 cosmo_honeymoonevents.100.c:0 "Matters of state can wait." 
 cosmo_honeymoonevents.100.7:0 "Matters of state can wait." 
 cosmo_honeymoonevents.100.8:0 "I don't want to get married."
