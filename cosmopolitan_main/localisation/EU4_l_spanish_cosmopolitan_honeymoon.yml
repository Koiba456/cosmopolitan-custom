 cosmo_honeymoonevents.1110.t:0 "A Celebration to Remember"
 cosmo_honeymoonevents.1110.d:0 "Your new wife has the [Root.GetAdjective] nobility singing her praises after the evening she organized for the two of you and some local lords and ladies.  Apparently, the festivities lasted well into the night and by dawn the revelers lay sprawling on the floors and couches of the great house.  Indeed even your noble host, a somewhat stern man normally was noticeably intoxicated at one point late in the evening and left the group in the company of a young woman you had not seen before.  Apparently your wife had spotted her in a nearby village and was quite taken by her beauty, an unconventional and perhaps controversial dalliance were it to be discovered.  But for now there is little arguing with the results, the next morning his lordship was as giddy as a young lad after his first kiss."
 cosmo_honeymoonevents.1110.a:0 "The nobility toasts your new bride." 