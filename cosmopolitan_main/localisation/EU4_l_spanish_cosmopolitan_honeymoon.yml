 domain_of_spouses_family:0 "Seat of Strong Aristocrats"
 desc_domain_of_spouses_family:0 "This is the seat of the family of our royal Spouse. Their close ties with our ruler have afforded them a number of local privileges that cannot be easily undone while the union lasts."
 cosmo_honeymoonevents.2320.t:0 "The House of [Root.Consort.Dynasty.GetName]"
 cosmo_honeymoonevents.2320.d:0 "With the union of [Root.Monarch.GetName] and [Root.Consort.GetName] we will gain not only a spouse but also a secures the support of a powerful noble house in the realm. The [Root.Consort.Dynasty.GetName] is an old and influential family and their seat in [origin_of_queens_family.GetName] is a jewel of the [Root.GovernmentName].\n   Of course the benefits of marital ties goes both ways and [Root.Consort.GetName] will be expected to speak for [Root.Consort.GetHerHis] kin while our [Root.Monarch.GetTitle] will be expected to consider such advice very carefully.\n   For their part, [Root.Monarch.GetName] and [Root.Consort.GetName] seem to get along extremely well, though in the midst of the celebrations they appear to have slipped away and haven't been seen in some hours leading to some concerned looks from the bride-to-be's father."
 cosmo_honeymoonevents.2320.a:0 "A blessed union"
 cosmo_honeymoonevents.2320.a.tt:0 "[origin_of_queens_family.GetName] is the seat of the family of our [Root.Consort.GetTitle]. This province will be less likely to revolt but will be granted privileges making it harder to tax or convert." 
