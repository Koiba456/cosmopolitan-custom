 cosmo_anathanism_start:0 "Turmoil among Estates"
 estate_ooku_disaster:0 "Influential Consorts"
 estate_nobleaffairs_disaster:0 "Influential Mistresses"
 cosmo_madamsd_events.10.t:0 "A Cult in a [prostituteprovince.GetCapitalName] Brothel"
 cosmo_madamsd_events.101.t:0 "Consort Rebels"
 cosmo_madamsd_events.10.d:0 "In the province of [prostituteprovince.GetName] at a brothel there is a Christian woman who is said to be growing in influence.  More than the fawning of her clientele she is said to have a growing following with her radical ideas that threaten accepted [Root.Religion.GetAdjective] beliefs.  Should they find their way to court at [Root.Capital.GetCapitalName] some fear it could pose a threat to [Root.Religion.GetAdjective] power in [Root.GetName]."
 cosmo_madamsd_events.10.a:0 "A small threat with such limited influence"
 cosmo_madamsd_events.4.t:0 "Madams wield influence"
 cosmo_madamsd_events.4.d:0 "As the Madams and prostitutes of [Root.Capital.GetCapitalName] increasingly work hand and, hand with the [Root.GetAdjective] court their influence has become a point of concern for other powers in the  [Root.GovernmentName].  As several have began to lobby the [Root.Monarch.GetTitle] for greater protections and opportunities for themselves the conflict has come to a head.  On one side are the court prostitutes and madams with their own demands, and the other are the traditional aristocracy and religious authorities who feel that for them to have any significant influence in [Root.GetName] is an affront that must be immediately addressed."
 cosmo_madamsd_events.4.a:0 "Make administrative concessions to the Madams"
 cosmo_madamsd_events.4.b:0 "The influence of these women on [Root.Monarch.GetTitle] [Root.Monarch.GetName] must end"
 cosmo_madamsd_events.4.c:0 "Ignore the Madam's Influence"
 cosmo_madamsd_events.4.8:0 "Exempt Madams from Tax"  
 cosmo_madamsd_events.4.7:0 "A cult from [prostituteprovince.GetName] at Court"  
 cosmo_madamsd_events.5.t:0 "Anathanism"
 cosmo_madamsd_events.5.d:0 "An influential Madam both in her home of [prostituteprovince.GetName], and even at the [Root.GetAdjective] court has begun a movement in opposition to the teachings and authority of [Root.GetAdjective] [Root.Religion.GetName] officials.  The two have become increasingly at odds recently it seems, despite these madams many supporters and clients in prominent positions of the [Root.Religion.GetName] faith.  Yet, she is not the first madam to have enemies within the ranks of [Root.GetName]'s [Root.Religion.GetName] who at times have scapegoated such women in an effort to appease believers out for blood after an inexplainable misfortune.  \n\nIn [prostituteprovince.GetName] the local madams have largely been supportive of the faith, financially and in their discretion.  These close ties have recently given rise to one madam in particular who has influenced a number of prominent [Root.Religion.GetName] men.  They have embraced her vision for a more libertine interpretation of our religion, one that would no longer be a threat to women like her and which promises to give women of [Root.GetName] like her access to positions of power untethered to marriage.  It is said she and her ideas have influential supporters even in [Root.Capital.GetCapitalName] among the court, perhaps even the [Root.Monarch.GetTitle] [Root.Monarch.GetHerHim]self."
 cosmo_madamsd_events.5.a:0 "We should embrace this Anathanism fully"
 cosmo_madamsd_events.5.7:0 "Seek their help to reform the [Root.GetAdjective] [Root.Religion.GetName]"
 cosmo_madamsd_events.5.b:0 "[Root.GetName] is [Root.Religion.GetName], the [Root.Monarch.GetTitle] must banish all Anathanists" 
 cosmo_madamsd_events.5.c:0 "Dismiss claims of the cult's influence on [Root.Monarch.GetTitle] [Root.Monarch.GetName]" 
 cosmo_madamsd_events.30.t:0 "Anathanism"
 cosmo_madamsd_events.30.d:0 "Once again the [Root.GovernmentName] finds itself largely in the hands of women who hold the [Root.Monarch.GetTitle]'s attentions and confidence. The influence of the madams and prostitutes of [Root.Capital.GetCapitalName] on [Root.Monarch.GetTitle] [Root.Monarch.GetName]'s court is not the issue it once was.  There are few scandals at stake since the conversion to  [Root.Religion.GetName] and [Root.GetAdjective] society is generally becoming increasingly tolerant of the practice.  However debts still must be paid and even still there are demands to consider to reach a compromise as quickly as possible so the [Root.Monarch.GetTitle]'s focus can return to the running of [Root.GetName]."
 cosmo_madamsd_events.30.a:0 "Show support for the Anathanists"
 cosmo_madamsd_events.30.b:0 "Fund an Anathanist Church"  
 cosmo_madamsd_events.30.c:0 "Ignore the Madam's Influence"  
