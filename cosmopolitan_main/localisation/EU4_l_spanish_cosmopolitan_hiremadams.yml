 cosmo_hiremadams_events.101.t:0 "Hire Prostitutes to [Root.Capital.GetCapitalName]"
 cosmo_hiremadams_events.101.d1:0 "Originally from Bavaria, Holstein, and Amsterdam the three women are already employed in [Root.Capital.GetCapitalName] and working on behalf of [Root.GetName].  "
 cosmo_hiremadams_events.101.d2:0 "Originally from Bavaria, Holstein, and Amsterdam the three women have all found work in [Root.GetName]'s brothel districts at [madamprovince.GetName] where they quickly came to the attention of the [Root.GovernmentName]'s agents who identified them as possibly being of interest to the [Root.Monarch.GetTitle]."
 cosmo_hiremadams_events.101.d3:0 "Originally from Bavaria, Holstein, and Amsterdam the three women are in high demand in the brothels of [madamprovince.GetName] where [Root.GetName]'s generous trade position has given us the opportunity to lure them away..  It is possible they could be convinced to work on behalf of the [Root.Monarch.GetTitle]"
 cosmo_hiremadams_events.101.d4:0 "Originally from Bavaria, Holstein, and Amsterdam the three women have been found working in [Root.GetAdjective] occupied [madamprovince.GetName]. It is possible they could be convinced to work on behalf of the [Root.Monarch.GetTitle]"
 cosmo_hiremadams_events.101.d5:0 "We have no contact with these prostitutes currently, though it is said they are from somewhere near North Germany." 
