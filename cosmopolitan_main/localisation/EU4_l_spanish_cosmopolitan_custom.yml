 cosmo_heiradvisor3005:0 "Throughout [prostituteprovince.GetName] [Root.GetName] is hard at work convincing any potential [prostituteprovince.Culture.GetName] colonists of the exotic and luxurious life that could awaited them at [Root.GetName]'s colonies in [colonyprovince.GetRegionName]."  
 cosmo_heiradvisor3006:0 "In her strange costume, she was a big draw at the gathering of wealthy financiers and ambitious young leaders hoping to lead [Root.GetAdjective] colonists to the Amazon.  If the possibilities for riches and glory were not enough, the group of beautiful women supposedly freshly arrived from these new continents had certainly piqued their curiosity about these exotic and possibly wild new lands."
