 cosmo_dipbadtext002:0 "[From.Monarch.GetTitle] [From.Monarch.GetName] appreciates the advice of [From.Monarch.GetHerHis] [From.CosmoDipAdvisorCulture] advisor, [From.Dip_Advisor.GetName].  Her unique perspective taken from her time in [Root.Capital.GetCapitalName] has been put to good in advancing [From.Monarch.GetHerHis] own priorities.  The [From.GetAdjective] [From.Monarch.GetTitle]'s' attentions however have distracted her from her true assignment to influence the direction and policies of the court in [From.Capital.GetCapitalName] on behalf of the [Root.GetAdjective] [Root.GovernmentName] who so generously sponsors her." 
