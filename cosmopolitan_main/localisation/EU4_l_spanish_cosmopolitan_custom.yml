 cosmo_palacevisit001:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] is enjoying having free reign over [palacecountry.Monarch.GetTitle] [palacecountry.Monarch.GetName]'s harem in [palacecountry.Capital.GetCapitalName] even if only temporarily.  [Root.Monarch.GetSheHe] wonders aloud repeatedly why [Root.GetName] does not offer the same level of options for companionship to its rightful ruler."
 cosmo_palacevisit002:0 "[palacecountry.Monarch.GetTitle] [palacecountry.Monarch.GetName]'s harem of women purportedly contains many women of noble and even royal birth.  Their relations back home could be valuable allies should [Root.GetName] decide to wage war against [palacecountry.GetName].  These women were often sent to [palacecountry.Capital.GetCapitalName] at a young age, and our agent believes she can concoct the necessary backstory for them to pass as the highest of royalty for a number of nations.  She has found a number of the [palacecountry.Monarch.GetTitle]'s consorts she believes would be capable and willing to play the part in exchange for their freedom."
 cosmo_palaceconsort001:0 "The [palacecountry.Monarch.GetTitle]'s consort is truly a regal beauty and conducts herself as one would expect of royalty.  She treats [Root.Monarch.GetTitle] [Root.Monarch.GetName] as she would her own [palacecountry.Monarch.GetTitle].  The [Root.Monarch.GetTitle] forgets for a moment that he is in [palacecountry.Capital.GetCapitalName] as the palace seems to be a realm of its own."
 cosmo_palaceconsort002:0 "The consort is hesitant at first, but given her lack of other options in her current home is eventually convinced that the [Root.GetAdjective] agent tells the truth, and this is not some cruel test of her loyalty.  If we can ensure her safety she will gladly go along with our plan and convince others that [Root.GetName] can stand against [palacecountry.GetName] and put a end to [palacecountry.Monarch.GetTitle] [palacecountry.Monarch.GetName]'s tyranny."
