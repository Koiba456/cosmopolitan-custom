 cosmo_fulladvtext001:0 "The affair between [Root.Monarch.GetTitle] [Root.Monarch.GetName] and [Root.Monarch.GetHerHis] administrative advisor [Root.Adm_Advisor.GetName] has run its course as she has impacted [Root.GetAdjective] policy to the fullest extent possible.  While the two remain very close it is unlikely that the [Root.GovernmentName]will benefit further from their relationship for some time.  Perhaps the [Root.Monarch.GetTitle]'s attention should be affixed elsewhere."   
