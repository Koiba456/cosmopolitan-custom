 cosmo_japanesemadams001:0 "  There are few if any new prostitutes in demand from the region who could not eventually make their way to [Root.Capital.GetCapitalName]."
 cosmo_japanesemadams002:0 "  Prostitutes from this region are in high demand in [Root.Capital.GetCapitalName], as [Root.GetName] establishes new brothels for them they will eventually make their way to the [Root.GetAdjective] capital." 
 cosmo_japanesemadams003:0 "  Prostitutes from the region have recently arrived in [Root.Capital.GetCapitalName] and there is likely not enough demand to support new endeavours in the city for some time.  However the appetites of the rich and powerful are insatiable, and if the need exists [Root.GetName]'s madams will provide for that demand."  
 cosmo_harem001:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName]'s pride in all of the [Root.GovernmentName] is [Root.Monarch.GetHerHis] forbidden palace.  Conveniently adjoining the [Root.Monarch.GetTitle]'s own estate, but secluded from prying eyes and unwanted visitors.  Indeed only the [Root.Monarch.GetTitle] [Root.Monarch.GetHerHim]self is allowed to enter, with the exception of similarly secluded servants and eunuchs.  Amidst the constant demands and political intrigue in [Root.Capital.GetCapitalName] it is here that [Root.Monarch.GetSheHe] feels most at rest.  The company kept within also bring [Root.Monarch.GetHerHim] great comfort."  
