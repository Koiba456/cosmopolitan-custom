 cosmo_strength001:0 "[From.GetName] can exploit any trust gained with [personalunion.GetName].\n\n[personalunion.GetAdjective] [personalunion.GovernmentName]\nRuled by [personalunion.Monarch.GetTitle] [personalunion.Monarch.GetName] \n[personalunion.CosmoAdmAdvisorPU] \n[personalunion.CosmoDipAdvisorPU] \n[personalunion.CosmoMilAdvisorPU] \n[personalunion.CosmoPUTypeI] [personalunion.CosmoPUTypeT] [personalunion.CosmoPUTypeR] [personalunion.CosmoPUTypeM] [personalunion.CosmoPUTypeJ] [personalunion.CosmoPUTypeD] [personalunion.CosmoPUTypeC] [personalunion.CosmoPUTypeG]\n\n[personalunion.GetName]'s trust towards [From.GetName] is currently [From.PUTrust.GetValue]%"  
 cosmo_strength002:0 "[personalunion.GetName] wants to join our war"  
 cosmo_strength003:0 "[From.GetName] is requesting additional manpower from [personalunion.GetName] in order to support the [From.GetAdjective] [From.GovernmentName]'s armies.  While these men would ultimately also be working to protect [personalunion.GetName] there are some who feel we are taking advantage of the rulers in [personalunion.Capital.GetCapitalName]."  
