 cosmo_heiradvisor3014:0 "[spycountry.Monarch.GetTitle] [spycountry.Monarch.GetName], eager to please his new mistress has began expressing more regular criticisms of [spycountry.GetName]'s ally.  Hopefully this will help lead to a breakdown of the two countries ties."  
 cosmo_heiradvisor3015:0 "[spycountry.Monarch.GetTitle] [spycountry.Monarch.GetName], so enthralled with [spycountry.Monarch.GetHerHis] new mistress that [spycountry.Monarch.GetSheHe] was sucessfully lured away from the palace where an accident unfortunately has claimed the [spycountry.Monarch.GetTitle]'s life.  Now is the time for for [Root.GetName] to press our advantage while the court in [spycountry.Capital.GetCapitalName] is in turmoil."   
 cosmo_heiradvisor3016:0 "The [spycountry.GetAdjective] [spycountry.Monarch.GetTitle] made a public appearance in [spycountry.Capital.GetCapitalName] after our agent was supposed to carry out the assassination.  She has not reported in to her handler in some time, and it is assumed the mission has failed.  Thankfully [spycountry.GetName] has not yet accused us of any involvement, or made mention of the attempt on the [spycountry.Monarch.GetTitle] life."   
 cosmo_heiradvisor3017:0 "The [spycountry.GetAdjective] cardinal was an easy target, and as a supposedly celibate clergyman it is unlikely that [spycountry.GetName] will want to bring attention to his relationship with our agent who has already made her escape and en route to [Root.Capital.GetCapitalName].  With his rival removed, hopefully our own cardinal will gain favor in the college."  
 cosmo_heiradvisor3018:0 "The [spycountry.GetAdjective] Cardinal has been spotted returning to Rome, clearly the mission has failed.  Whether our agent escaped is unknown but we have had no contact with her and suspect that she has fallen into [spycountry.GetAdjective] hands or disappeared into the chaos of sprawling streets and crowds of [spycountry.Capital.GetCapitalName]."  
 cosmo_heiradvisor3019:0 "The [spycountry.GetAdjective] cardinal is enthralled by the beauty and charm of our agent, and she reports that he is taking her with him when he returns to Rome.  This will be the perfect opportunity to further influence his thoughts to more closely align with [Root.GetName]'s."  
 cosmo_heiradvisor3020:0 "The [spycountry.GetAdjective] cardinal was no match for our agent who reports that her seduction is complete.  With this intimate connection to someone so close to the [spycountry.Monarch.GetTitle] her access to information and connections at court in [spycountry.Capital.GetCapitalName] has grown.  She awaits our further instruction."  
 cosmo_heiradvisor3021:0 "At the [spycountry.GetAdjective] court in [spycountry.Capital.GetCapitalName] our agent works to expand her network of connections.  Fortunately, she is very popular with many of the nobility and others that surround the [spycountry.Monarch.GetTitle] and has exploited these encounters to further our knowleedge of [spycountry.GetName]'s affairs."   
 cosmo_heiradvisor3021:0 "At the [spycountry.GetAdjective] court in [spycountry.Capital.GetCapitalName] our agent works to expand her network of connections.  Fortunately, she is very popular with many of the nobility and others that surround the [spycountry.Monarch.GetTitle] and has exploited these encounters to further our knowleedge of [spycountry.GetName]'s affairs."   
 cosmo_heiradvisor3022:0 "After considerable effort our agent has finally seduced the [spycountry.GetAdjective] [spycountry.Monarch.GetTitle], [spycountry.Monarch.GetName].  [Root.GetName] now has a direct line of influence to the [spycountry.Monarch.GetTitle] and we should press this advantage to push [spycountry.Monarch.GetHerHim] in the direction most advantageous to [Root.GetAdjective] interests."   
 cosmo_heiradvisor3023:0 "Our spy has arrived in the [spycountry.GetAdjective] court in [spycountry.Capital.GetCapitalName] and is already making an impression on those with connections to the [spycountry.Monarch.GetTitle] and [spycountry.Monarch.GetHerHis] most trusted advisors and confidants.  She will await our further instruction, and as our network grows she will be positioned to take direct action on [Root.GetName]'s behalf."   
 cosmo_heiradvisor3024:0 "In [prostituteprovince.GetName] our prostitute has organized entertainment and brothels for [Root.GetAdjective] troops stationed in the area.  The men seem in particularly good spirits, and the [prostituteprovince.Culture.GetName] people of [prostituteprovince.GetAreaName] are appreciative to have their appetites sated by willing and compensated women provided by [Root.GetName]."  
 cosmo_heiradvisor3025:0 "At the port in [prostituteprovince.GetName] our prostitute has organized entertainment and brothels for [Root.GetAdjective] sailors stationed in the area.  The men seem in particularly good spirits, and many [prostituteprovince.Culture.GetName] sailors from around [prostituteprovince.GetAreaName] are eager to join the [Root.GetName]'s fleet." 
 cosmo_heiradvisor3026:0 "At the bustling center of trade in [merchantprovince.GetName] our prostitute has helped to seal important and lucrative trade deals for [Root.GetAdjective] goods abroad with a personal appeal to the foreign merchant."   
 cosmo_heiradvisor3027:0 "At the bustling center of trade in [merchantprovince.GetName] our prostitute become quite close with the foreign merchant who she believes will be more eager to do business with [Root.GetName] in the future."   
 cosmo_heiradvisor3028:0 "Our agent has successfully infiltrated the [spycountry.GetAdjective] defenses currently being beseiged by [Root.GetName].  She has already gained intimate knowledge from a garrison commander about their plans, information which should be useful to [Root.GetAdjective] seige efforts.  She may be able to more actively aid our efforts should we need it."  
 cosmo_heiradvisor3029:0 "Our agent has inside the enemies defenses has sabotaged crucial supplies leaving the [spycountry.GetAdjective] defenders scrambling to recover.  Surely this will aid in a successful seige.  Even still, she may be able to more actively aid our efforts should we need it."  
 cosmo_heiradvisor3030:0 "Our agent has inside has reached the extent of her efforts inside the [spycountry.GetAdjective] defences.  As their fortifications and foodstores burn and the commander lays dead in his bed she has fled unnoticed.  Now is the time for [Root.GetName] to make its advance."  
 cosmo_heiradvisor3031:0 "We have lost contact with our agent inside the [spycountry.GetAdjective] defences.  Whether she has been captured by the enemy, fallen victim to the seige herself, or otherwise been unable to establish contact with her handlers she will be unable to aid us in our efforts here further.  It is thought unlikely that she will ever return to [Root.GetName]."  
 cosmo_prostitutereward001:0 "As soon as possible, they will write to [dignitarycountry.Monarch.GetTitle] [dignitarycountry.Monarch.GetName] of the many benefits membership in the empire provides, especially with [Root.Monarch.GetTitle] [Root.Monarch.GetName] at its head." 
 cosmo_prostitutereward002:0 "As soon as possible, they will write to [dignitarycountry.Monarch.GetTitle] [dignitarycountry.Monarch.GetName] of the urgency in getting [Root.GetName] approved as a member of the Empire" 
 cosmo_prostitutereward003:0 "As soon as possible, they will write to [dignitarycountry.Monarch.GetTitle] [dignitarycountry.Monarch.GetName] of [Root.GetName] trustworthiness as an ally." 
 cosmo_prostitutereward004:0 "As soon as possible, they will write to [dignitarycountry.Monarch.GetTitle] [dignitarycountry.Monarch.GetName] the many benefits [Root.GetName] provides to her loyal subjects." 
 cosmo_prostitutereward005:0 "While taxes on goods from [Root.GetName] may seem like a burden, it is clear now that [dignitarycountry.GetName] benefits greatly from our trade ties and that [Root.GetAdjective] goods and services are worth the premium paid." 
 cosmo_prostitutereward006:0 "He needs no more convincing that [Root.GetName]'s cause is just and has promised to tell every captain he sees of the myriad benefits of joining the [Root.GetAdjective] cause." 
 cosmo_prostitutereward007:0 "As soon as possible, they will write to [dignitarycountry.Monarch.GetTitle] [dignitarycountry.Monarch.GetName] telling them of the extravagance of [Root.GetName] and [Root.Monarch.GetTitle] [Root.Monarch.GetName]'s [Root.GovernmentName]." 
 cosmo_prostitutereward008:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] feels like a true statesman, ready to take on the affairs of [Root.Capital.GetCapitalName]."
 cosmo_prostitutereward009:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] needs not leave [Root.Capital.GetCapitalName] to meet interesting people from all over.  For a [Root.Monarch.GetWomanMan] so deeply in touch with people, matters of diplomacy are second nature." 
 cosmo_prostitutereward0010:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] feels ten years younger with the unparalleled vigor expected of a [Root.Monarch.Dynasty.GetName] [Root.Monarch.GetWomanMan].  There is only one [Root.Monarch.GetWomanMan] capable of being [Root.Monarch.GetTitle] in [Root.Capital.GetCapitalName]." 
 cosmo_prostitutereward0011:0 "[Root.Monarch.GetName]'s affairs are not the concern of [Root.Monarch.GetHerHis] subjects, but it is not entirely unnoticed in court that many of [Root.GetName]'s most beautiful women frequently can be seen entering the royal quarters." 
 cosmo_prostitutereward0012:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] feels as though [Root.Monarch.GetSheHe] is the embodiment of [Root.GetName] and all that reside within its borders belong to [Root.Monarch.GetHerHim]." 
 cosmo_prostitutereward0013:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] is nothing if not a [Root.Monarch.GetWomanMan] of [Root.Monarch.GetHerHis] time, and even the young see [Root.Monarch.GetHerHim] as one of their own." 
 cosmo_prostitutereward0014:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] feels the need to leave a legacy in stone in [Root.Capital.GetCapitalName], imposing structures that will ensure  [Root.Monarch.GetHerHis] greatness is recorded for all." 
 cosmo_prostitutereward0015:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] wishes for [Root.Capital.GetCapitalName] to reflect his own advanced thinking, it should be the very definition of modernity in all things." 
 cosmo_prostitutereward0016:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName] is more than the crown, there is a great intellect at [Root.Monarch.GetHerHis] core.  [Root.Capital.GetCapitalName], as a reflection of the [Root.Monarch.GetTitle] [Root.Monarch.GetHerselfHimself] is therefore the center of learning for perhaps the entire known world." 
 cosmo_prostitutereward0017:0 "Our agent was successful, she has managed to not only gain entry to the palace, posing as a concubine for the emperor but has quickly become one of his favorites.  With such access surely we can make good use of this opportunity." 
 cosmo_prostitutereward0018:0 "Hopefully our colony in [colonyprovince.GetName] will benefit greatly from the excitement generated by our campaign to encourage more colonists to the area."    
