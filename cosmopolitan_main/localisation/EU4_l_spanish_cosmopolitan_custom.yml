 cosmo_blerb_henriiv:0 "[Root.Monarch.GetName]'s court is famed for its libertinism, and the [Root.Monarch.GetTitle] is known to seek the advice of their mistresses.  \n\nAnother famed libertine was the Bourbon king, Henry IV, the king of Navarre (1572-1610) and France (1589-1610), Henry was also known as Good King Henry, Henry the Great or The Green Gallant.  Henry was not only remembered for his successes on the battlefield, but for the number and influence of his royal mistresses. The most influential of his mistresses the Duchess of Beaufort, Gabrielle d'Estrees, was a close confident and advisor in Henry's Court.  Credited in part with persuading him to renounce Protestantism, and later playing a role in convincing influential Catholics to accept the terms of the Edict of Nantes.  Henry would have many more mistresses who would be regular fixtures in court up until his death when most were exiled by his wife Marie de' Medici during her regency."  
 cosmo_blerb_alexandervi:0 "[Root.Monarch.GetName]'s court is famed for its libertinism,but this has not compromises [Root.Monarch.GetHerHis] deep sense of care for the Catholic church and keeping its clergy happy.  \n\nPerhaps the most famous libertine of the Papacy would be Rodrigo de Borja, or as he was known Pope Alexander VI.  The pope acknowledged his children who held a role in the Papal court, or in seeking royal marriages.  While pope, his affair with Giulia Farnese would see her brother made a cardinal.  Though some dispute that the nature of the pope's relationship her influence must have been considerable considering the bounty paid to pirates by the pope on her behalf.  Years after the pope's death Giulia became governor of Carbognano where she was said to be a capable administrator."  
 cosmo_blerb_johnv:0 "[Root.Monarch.GetTitle] [Root.Monarch.GetName]'s favorite convent near [Root.Capital.GetCapitalName] is a source of regular comfort.  \n\nKing John V of Portugal was intimately connected to the convent at the Monastery of Saint Denis of Odivelas throughout his rule, and especially its abbess Mother Paula Odivelas who was considered his most famous mistress.  The site of an annual commemorative bullfight, and other festivities made it a frequent visit for the King and his court.  The beautiful abbess and royal mistress received a very generous yearly allowance, and had a residency built for her and her family who were also well looked after by the king.  The abbey was well known for hosting what was described as a magnificent dinner for all the nobility who attended during the festivity for the Relief of the Blessed Sacrament.  \n\nIn "The Travels of the Duke de Chatelet, in Portugal" the French Duke remarks that Portugal had the most depraved convents in all of Europe and that John V had made a "real harem of the convent" at Saint Denis of Odivelas, where it was rumored he had fathered bastards with several of the women there.  During the subsequent rule of the Marquis de Pombal who also was said to disapprove of the rumors such convents came under intense scrutiny with many suppressed or incorporated into other religious houses.  However, King John and the Abbess Paula Odivelas's illegitimate son would become Jose of Braganza, the High Inquisitor of Portugal during the Portuguese Inquisition."  
 cosmo_blerb_prostitution:0 "Under [Root.Monarch.GetName] [Root.GetName] benefits from at least one brothel district in its cities.  \n\nIn 1358 the Great Council of Venice decreed prostitution to be "absolutely indispensable to the world".  Almost half of Europe in 1444 has organized prostitution generating taxes and being regulated from Rome itself to the Western coast of Norway.  In Ming China and its neighbors prostitution has flourished, and unique customs and status for various classes of prostitutes helps shape society as even the powerful engage in the practice even vying for exclusivity with certain women of renown.  A form of prostitution also exists in the form of free unattached women in Nupe territory in Guinea and in Buganda where high status women funnel gifts and wealth from patrons to their local rulers in exchange for their protection and independence."  
 cosmo_blerb_royalmarriage:0 "Much of [Root.GetName]'s power comes from its alliances strengthened by marriage.  \n\nThe marriages of Ottoman sultans and their sons in the fourteenth and fifteenth centuries tended to be with members of the ruling dynasties of neighbouring powers.  With little regard for religion, the sultans contracted marriages with both Christians and Muslims; the purpose of these royal intermarriages were purely tactical. The Christian Byzantines and Serbians, as well as the Muslim beyliks of Germiyan, Saruhan, Karaman and Dulkadir were all potential enemies and marriage was seen as a way of securing alliances with them.\n\nMarriage with foreign dynasties seems to have ceased in 1504, with the last marriage of a sultan to a foreign princess being that of Murad II and Mara Brankovic, daughter of the Serbian ruler Durad Brankovic, in 1435. By this time, the Ottomans had consolidated their power in the area and absorbed or subjugated many of their former rivals, and so marriage alliances were no longer seen as important to their foreign policy."  
 cosmo_epilogue_henriiv:0 "[Root.Monarch.GetName]'s predecessor was a famed libertine who was known to seek the advice of their mistresses.  \n\nAnother famed libertine was the Bourbon king, Henry IV, better known as Good King Henry or Henry the Great.  Henry was not only known for his successes on the battlefield, but for the number of royal mistresses he was connected to. The most influential of his mistresses the Duchess of Beaufort, Gabrielle d'Estrees, was a close confident and advisor in Henry's Court.  Credited in part with persuading him to renounce Protestantism, and later playing a role in convincing influential Catholics to accept the terms of the Edict of Nantes.  Henry would have many more mistresses who would be regular fixtures in court up until his death when most were exiled by his wife Marie de' Medici during her regency."  
 cosmo_epilogue_alexandervi:0 "[Root.Monarch.GetName]'s predecessor was a famed libertine whose exploits did not compromise their deep care for the Catholic church.  \n\nPerhaps the most famous libertine of the Papacy would be Rodrigo de Borja, or as he was known Pope Alexander VI.  The pope acknowledged his children who held a role in the Papal court, or in seeking royal marriages.  While pope, his affair with Giulia Farnese would see her brother made a cardinal.  Though some dispute that the nature of the pope's relationship her influence must have been considerable considering the bounty paid to pirates by the pope on her behalf.  Years after the pope's death Giulia became governor of Carbognano northwest of Rome where she was said to be a capable administrator."  





