 cosmo_colonialgovernortitle002:0 "[From.Dip_Advisor.GetName] influences the [From.GetAdjective] [From.Monarch.GetTitle]"   
 cosmo_colonialgovernortext001:0 "[Root.Dip_Advisor.GetName] is eager to travel to the furthest reaches of the [Root.GovernmentName].  Spreading our borders and expanding our settlements are often the topic as she meets long into the night with [Root.Monarch.GetTitle] [Root.Monarch.GetName].  [Root.Dip_Advisor.GetName] so influences the [Root.Monarch.GetTitle]'s plans that [Root.Monarch.GetSheHe] has agreed to give her whatever support she needs to expand the [Root.GovernmentName]." 
 cosmo_colonialgovernortext002:0 "The [From.Monarch.GetTitle]'s [From.CosmoDipAdvisorCulture] advisor, [From.Dip_Advisor.GetName] is eager to travel to the furthest reaches of the [From.GovernmentName].  Spreading our borders and expanding our settlements are often the topic as she meets long into the night with [From.Monarch.GetTitle] [From.Monarch.GetName].  [From.Dip_Advisor.GetName] so influences the [From.GetAdjective] [From.Monarch.GetTitle]'s plans that [From.Monarch.GetSheHe] has agreed to give her whatever support she needs to expand the [From.GovernmentName]. \n\nThe [From.GetAdjective] [From.Monarch.GetTitle] is also grateful to [From.Monarch.GetHerHis] good friends in [Root.GetName] for introducing [From.Monarch.GetHerHim] to [From.Dip_Advisor.GetName]."  
 cosmo_recruitmastertitle001:0 "The [Root.CosmoMilAdvisorCulture] master recruiter influences the [Root.Monarch.GetTitle]" 
 cosmo_recruitmastertitle002:0 "The [From.CosmoMilAdvisorCulture] master recruiter influences the [From.GetAdjective] [From.Monarch.GetTitle]"   
 cosmo_recruitmastertext001:0 "[Root.Mil_Advisor.GetName] loves the [Root.GetAdjective] military, and is extremely adept at telling tales of the soldiers of [Root.GetName]'s great victories and honors.  [Root.Monarch.GetTitle] [Root.Monarch.GetName] [Root.Monarch.GetHerHim]self loves to hear her speak.  [From.Mil_Advisor.GetName] so influences the [Root.Monarch.GetTitle] that [Root.Monarch.GetSheHe] has agreed to give her whatever support she needs to expand the [Root.GovernmentName]'s armed forces." 
 cosmo_recruitmastertext002:0 "The [From.Monarch.GetTitle]'s [From.CosmoMilAdvisorCulture] advisor, [From.Mil_Advisor.GetName] loves the [From.GetAdjective] military, and is extremely adept at telling tales of the soldiers of [From.GetName]'s great victories and honors.  [From.Monarch.GetTitle] [From.Monarch.GetName] [From.Monarch.GetHerHim]self loves to hear her speak.  [From.Mil_Advisor.GetName] so influences the [From.GetAdjective] [From.Monarch.GetTitle] that [From.Monarch.GetSheHe] has agreed to give her whatever support she needs to expand the [From.GovernmentName]'s armed forces. \n\nThe [From.GetAdjective] [From.Monarch.GetTitle] is also grateful to [From.Monarch.GetHerHis] good friends in [Root.GetName] for introducing [From.Monarch.GetHerHim] to [From.Mil_Advisor.GetName]."  
 cosmo_grandcaptaintitle001:0 "The [Root.CosmoMilAdvisorCulture] Grand Captain influences the [Root.Monarch.GetTitle]" 
 cosmo_grandcaptaintitle002:0 "The [From.CosmoMilAdvisorCulture] Grand Captain's influence on [From.GetName]"   
 cosmo_grandcaptaintext001:0 "[Root.Mil_Advisor.GetName] loves the [Root.GetAdjective] military, and is extremely adept at telling tales of the soldiers of [Root.GetName]'s valiant soldiers.  [Root.Monarch.GetTitle] [Root.Monarch.GetName] [Root.Monarch.GetHerHim]self loves to hear her tales passed on from the battlefield.  [Root.Mil_Advisor.GetName] so influences the [Root.Monarch.GetTitle] that [Root.Monarch.GetSheHe] has agreed to give her whatever support she needs to organize the [Root.GovernmentName]'s military efforts." 
 cosmo_grandcaptaintext002:0 "The [From.Monarch.GetTitle]'s [From.CosmoMilAdvisorCulture] advisor, [From.Mil_Advisor.GetName] loves the [From.GetAdjective] military, and is extremely adept at telling tales of the soldiers of [From.GetName]'s valiant soldiers.  [From.Monarch.GetTitle] [From.Monarch.GetName] [From.Monarch.GetHerHim]self loves to hear her tales passed on from the battlefield.  [From.Mil_Advisor.GetName] so influences the [From.GetAdjective] [From.Monarch.GetTitle] that [From.Monarch.GetSheHe] has agreed to give her whatever support she needs to organize the [From.GovernmentName]'s military efforts. \n\nThe [From.GetAdjective] [From.Monarch.GetTitle] is also grateful to [From.Monarch.GetHerHis] good friends in [Root.GetName] for introducing [From.Monarch.GetHerHim] to [From.Mil_Advisor.GetName]."  
