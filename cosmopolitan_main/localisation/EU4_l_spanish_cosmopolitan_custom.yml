 cosmo_diplomattext001:0 "[Root.Dip_Advisor.GetName] has the [Root.Monarch.GetTitle]'s full attention and has used the opportunity to bring attention to her important work regarding [Root.GetName]'s' diplomatic efforts.  [Root.Monarch.GetTitle] [Root.Monarch.GetName] is so enamoured by the woman that [Root.Monarch.GetSheHe] has agreed to give her whatever support she needs to make her reforms possible." 
 cosmo_diplomattext002:0 "The [From.Monarch.GetTitle]'s [From.CosmoDipAdvisorCulture] advisor, [From.Dip_Advisor.GetName] has the [From.GetAdjective] [From.Monarch.GetTitle]'s full attention and has used the opportunity to bring attention to her important work regarding [From.GetName]'s' diplomatic efforts.  [From.Monarch.GetTitle] [From.Monarch.GetName] is so enamoured by the woman that [From.Monarch.GetSheHe] has agreed to give her whatever support she needs to make her reforms possible. \n\nThe [From.GetAdjective] [From.Monarch.GetTitle] is also grateful to [From.Monarch.GetHerHis] good friends in [Root.GetName] for introducing [From.Monarch.GetHerHim] to the most accommodating [From.Dip_Advisor.GetName]."   
 cosmo_artisttitle001:0 "An artist in the [Root.Monarch.GetTitle]'s Court" 
 cosmo_artisttitle002:0 "An artist in the [From.GetAdjective] [From.Monarch.GetTitle]'s Court"   
 cosmo_artisttitle003:0 "[From.Adm_Advisor.GetName]'s Artistic Inspiration'" 
 cosmo_artisttitle004:0 "[From.Adm_Advisor.GetName]'s Artistic Inspiration"    
 cosmo_artisttext001:0 "[Root.Adm_Advisor.GetName] has been gaining a great deal of renown in [Root.Capital.GetCapitalName] and beyond.  She certainly has captured the interest of [Root.Monarch.GetTitle] who spares no effort or opportunity to promote her.  When news of the generous patronage of [Root.Monarch.GetTitle] [Root.Monarch.GetName] spread throughout the [Root.GovernmentName] the court was flooded with those who wished to see themselves and their ideas flourish in the presence of the [Root.Monarch.GetTitle] and [Root.Monarch.GetHerHis] favored artist." 
 cosmo_artisttext002:0 "The [From.Monarch.GetTitle]'s [From.CosmoAdmAdvisorCulture] advisor, [From.Adm_Advisor.GetName] has been gaining a great deal of renown in [From.Capital.GetCapitalName] and beyond.  She certainly has captured the interest of [From.Monarch.GetTitle] who spares no effort or opportunity to promote her.  When news of the generous patronage of [From.Monarch.GetTitle] [From.Monarch.GetName] spread throughout the [From.GovernmentName] the court was flooded with those who wished to see themselves and their ideas flourish in the presence of the [From.GetAdjective] [From.Monarch.GetTitle] and [From.Monarch.GetHerHis] favored artist. \n\nThe [From.GetAdjective] [From.Monarch.GetTitle] is also grateful to [From.Monarch.GetHerHis] good friends in [Root.GetName] for introducing [From.Monarch.GetHerHim] to the enthralling [From.Adm_Advisor.GetName]."    
 cosmo_artisttext003:0 "[Root.Adm_Advisor.GetName] continues to fascinate and earn the admiration of the [Root.Monarch.GetTitle] and those at court in [Root.Capital.GetCapitalName].  This recognition has also reached outside [Root.GetName]'s borders and it has brought renown to both artist and her generous patron.  [Root.Adm_Advisor.GetName] is quickly becoming a symbol of pride for the [Root.GovernmentName] to rival that of any other." 
 cosmo_artisttext004:0 "[From.Adm_Advisor.GetName] continues to fascinate and earn the admiration of the [From.GetAdjective] [From.Monarch.GetTitle] and those at court in [From.Capital.GetCapitalName].  This recognition has also reached outside [From.GetName]'s borders and it has brought renown to both artist and her generous patron.  [From.Adm_Advisor.GetName] is quickly becoming a symbol of pride for the [From.GovernmentName] to rival that of any other \n\nThe [From.GetAdjective] [From.Monarch.GetTitle] is also grateful to [From.Monarch.GetHerHis] good friends in [Root.GetName] for introducing [From.Monarch.GetHerHim] to the enthralling [From.Adm_Advisor.GetName]."  
