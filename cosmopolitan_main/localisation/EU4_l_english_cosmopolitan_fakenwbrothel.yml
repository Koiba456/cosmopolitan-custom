 cosmo_fakenw_events.101.t:0 "Attracting new prostitutes to [Root.Capital.GetCapitalName]"
 cosmo_fakenw_events.101.d:0 "Prostitutes from the region are becoming quite popular in [Root.GetName].[Root.a great ocean in the New WorldMadams][Root.Westa great ocean in the New WorldMadams][Root.Sahela great ocean in the New WorldMadams][Root.Southa great ocean in the New WorldMadams][Root.Congoa great ocean in the New WorldMadams][Root.ZanzibarMadams][Root.EthiopiaMadams][Root.GreatLakesMadams][Root.ZembeziMadams][Root.KatsinaMadams].  For now the clientele in [Root.Capital.GetCapitalName] will have to make due with those already in the city."
 cosmo_fakenw_events.101.a:0 "See who else is available" 
 cosmo_fakenw_events.101.b:0 "See all options again"
 cosmo_fakenw_events.101.c:0 "Cancel plans"
 cosmo_fakenw_events.6111.t:0 "Prostitutes from the Amazon in [Root.Capital.GetCapitalName]"
 cosmo_fakenw_events.6111.d:0 "From across a great ocean in the New World, these women have some of the most unique and alien dress and customs in all of [Root.GetName].  Far from your average prostitute servicing drunks and poor students, they have received training from the most renowned madams to service only the finest of clientele.  Here in [Root.Capital.GetCapitalName] they are in high demand as entertainment for the wealthiest and most powerful.  The [Root.GetAdjective] [Root.GovernmentName] sees great value in their use in persuading those in power when other forms of persuasion prove insufficient"   
 cosmo_fakenw_events.6111.a:0 "Isani from the Maipurean"
 cosmo_fakenw_events.6111.b:0 "Twengga from the Lokono"
 cosmo_fakenw_events.6111.c:0 "Jougousa from the Guarani"
 cosmo_fakenw_events.6111.7:0 "See who else is available" 
 cosmo_fakenw_events.6211.t:0 "Isani of the Maipurean"
 cosmo_fakenw_events.6211.d:0 "Isani, originally from the Maipurean, is one of the more celebrated courtesans in the capital, and is highly sought after making her a useful ally to the [Root.GovernmentName].\n\n[Root.HeirOrAdvisor3] \n\n[Root.ProstituteReward]"
 cosmo_fakenw_events.6211.a:0 "For the good of [Root.CosmoTheName][Root.GetName]"
 cosmo_fakenw_events.6211.b:0 "For the good of [Root.CosmoTheName][Root.GetName]"
 cosmo_fakenw_events.6301.t:0 "Inspired Devotion"
 cosmo_fakenw_events.6301.d:0 "A visit from the [Root.Monarch.GetTitle] was the final push Isani needed to convince her to return to the region of her upbringing and help spread the new faith.  She promises [Root.Monarch.GetName] that as soon as she leaves she will contact the church and begin preparations to leave immediately.  She promises she will return to the district, but she must first make a visit to her homeland to tell the people there of [Root.Monarch.GetName]'s great benevolence and of the wisdom and charity that only [Root.Religion.GetName] can offer."
 cosmo_fakenw_events.6301.a:0 "Wish her luck in her proselytizing"
 cosmo_fakenw_events.6301.b:0 "Wish her luck in her proselytizing"
