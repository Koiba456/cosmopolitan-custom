l_english:
 cosmo_fakenw_events.1001.t:0 "Arrived in [Root.Capital.GetCapitalName]"
 cosmo_fakenw_events.1001.d:0 "Originally from an establishment in the Taino the three women have quickly made a name for themselves as favorites among [Root.GetName]'s top patrons of art and culture.  [Root.Monarch.GetTitle] [Root.Monarch.GetName] has been heard to express [Root.Monarch.GetHerHis] interest in the three as well.  Considering the demand for these exotic new arrivals to [Root.Capital.GetCapitalName], [Root.GetName] can hopefully convince them to work towards the best interests of the [Root.GovernmentName], for which they would be well compensated."
 cosmo_fakenw_events.1001.a:0 "They could be of use to [Root.GetName]"
 cosmo_fakenw_events.1002.t:0 "Arrived in [Root.Capital.GetCapitalName]"
 cosmo_fakenw_events.1002.d:0 "Inspired by our colony in [colonyprovince.GetName] the whole of [Root.GetName] is swept up in excitement over the possibilities this New World has to offer. It was not long before the brothels too capitalized, claiming to offer the most beautiful women straight from the new continent.  Though some look oddly familiar to other courtesans known in [Root.Capital.GetCapitalName], rich and poor alike however are easily swayed by their costumes and assumedly equally exotic talents in the bedroom. [Root.Monarch.GetTitle] [Root.Monarch.GetName] has been heard to express [Root.Monarch.GetHerHis] admiration of the three as well.  Considering the demand for these exotic new arrivals to [Root.Capital.GetCapitalName], [Root.GetName] can hopefully convince them to work towards the best interests of the [Root.GovernmentName], for which they would be well compensated."
 cosmo_fakenw_events.1002.a:0 "They could be of use to [Root.GetName]"
 cosmo_fakenw_events.1003.t:0 "Arrived in [prostitutecountry.Capital.GetCapitalName]"
 cosmo_fakenw_events.1003.d:0 "Inspired by news of the newest overseas colony of [prostitutecountry.GetName] the whole of [Root.GetName] is temporarily swept up in excitement over the possibilities this New World has to offer. Merchants and travelers claim that in [prostitutecountry.Capital.GetCapitalName] the brothels feature may of the most exotic and beautiful women from these new lands. [Root.Monarch.GetTitle] [Root.Monarch.GetName] has been heard to express [Root.Monarch.GetHerHis] interest in three of the most well known in particular.  Considering the demand for these exotic new arrivals to [prostitutecountry.Capital.GetCapitalName], [Root.GetName] can hopefully convince them to work towards the best interests of our own [Root.GovernmentName], for which they would surely be better compensated."
 cosmo_fakenw_events.1003.a:0 "[Root.GetName] does not need them" 
 cosmo_fakenw_events.1003.b:0 "[Root.GetName] should have them instead" 
