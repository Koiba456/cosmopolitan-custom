 cosmo_fakenw_events.6341.d:0 "A visit from the [Root.Monarch.GetTitle] was the final push Marguerite needed to convince her to return to the region of her upbringing and help spread the new faith.  She promises [Root.Monarch.GetName] that as soon as she leaves she will contact the church and begin preparations to leave immediately.  She promises she will return to the district, but she must first make a visit to her homeland to tell the people there of [Root.Monarch.GetName]'s great benevolence and of the wisdom and charity that only [Root.Religion.GetName] can offer."
 cosmo_fakenw_events.6341.a:0 "Wish her luck in her proselytizing"
 cosmo_fakenw_events.6341.b:0 "Wish her luck in her proselytizing"
 cosmo_fakenw_events.6541.t:0 "Proselytizing in [convertprovince.GetName]"
 cosmo_fakenw_events.6541.d:0 "Marguerite has arrived in [convertprovince.GetName] and it did not take long for her to acquaint herself with the local brothel's prostitutes and patrons.  The prostitutes practically leapt at the opportunity to abandon a faith which had so harshly condemned them as sinners, and many have become eager missionaries themselves for the faith, whispering into the ears of their satisfied clients."
 cosmo_fakenw_events.6541.a:0 "She is an inspiration to us all"
