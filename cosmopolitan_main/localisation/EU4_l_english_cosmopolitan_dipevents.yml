 cosmo_dipevents_events.101.9:0 "Sacrifice the [Root.Monarch.GetTitle]'s advisor, [Root.Mil_Advisor.GetName]"
 cosmo_dipevents_events.101.10:0 "Sacrifice one of the [Root.Monarch.GetTitle]'s concubines"
 cosmo_dipevents_events.101.11:0 "Sacrifice one of the [Root.Monarch.GetTitle]'s wives"
 cosmo_dipevents_events.101.12:0 "Sacrifice a [Root.GetAdjective] prostitute"
 cosmo_dipevents_events.101.13:0 "Actually, [Root.GetName] has no one to spare"
