 cosmo_koreabrothel_events.1001.t:0 "Arrived in [Root.Capital.GetCapitalName]"
 cosmo_koreabrothel_events.1001.d:0 "Originally from an establishment outside of the capital in Korea, the three women have quickly made a name for themselves as favorites among [Root.GetName]'s top patrons of art and culture.  [Root.Monarch.GetTitle] [Root.Monarch.GetName] has been heard to express [Root.Monarch.GetHerHis] interest in the three as well.  Considering the demand for these exotic new arrivals to [Root.Capital.GetCapitalName], [Root.GetName] can hopefully convince them to work towards the best interests of the [Root.GovernmentName], for which they would be well compensated."
